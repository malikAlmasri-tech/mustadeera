<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>المستديرة - احجز ملعبك</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #10b981;
  --primary-dark: #059669;
  --primary-light: #d1fae5;
  --bg-main: #f8fafc;
  --bg-card: #ffffff;
  --text-main: #0f172a;
  --text-muted: #64748b;
  --border-color: #e2e8f0;
  --danger: #ef4444;
  --danger-light: #fee2e2;
  --warning: #f59e0b;
  --warning-light: #fef3c7;
  
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
  
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  
  --transition: all 0.2s ease-in-out;
}

body.dark {
  --primary: #10b981;
  --primary-dark: #34d399;
  --primary-light: #064e3b;
  --bg-main: #0f172a;
  --bg-card: #1e293b;
  --text-main: #f8fafc;
  --text-muted: #94a3b8;
  --border-color: #334155;
  --theme-color: #0f172a;
}

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  height: 100%;
  direction: rtl;
  background-color: var(--bg-main);
  color: var(--text-main);
  font-family: 'Tajawal', 'Cairo', sans-serif;
  -webkit-font-smoothing: antialiased;
  font-size: 14px;
  line-height: 1.6;
}

body {
  display: flex;
  justify-content: center;
}

#app {
  width: 100%;
  max-width: 480px;
  min-height: 100vh;
  position: relative;
  overflow-x: hidden;
  background-color: var(--bg-main);
}

.page {
  display: none;
  padding-bottom: 90px;
  min-height: 100vh;
}

.page.active {
  display: block;
  animation: fadeIn 0.3s ease-out forwards;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

h1, h2, h3, h4 {
  font-family: 'Cairo', sans-serif;
  font-weight: 800;
  color: var(--text-main);
}

button {
  cursor: pointer;
  border: none;
  background: none;
  font-family: inherit;
  transition: var(--transition);
}

input, select, textarea {
  font-family: inherit;
  width: 100%;
  padding: 12px 16px;
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  background-color: var(--bg-card);
  color: var(--text-main);
  outline: none;
  transition: var(--transition);
}

input:focus, select:focus, textarea:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px var(--primary-light);
}

.form-group {
  margin-bottom: 16px;
}

.form-label {
  display: block;
  font-size: 13px;
  font-weight: 700;
  margin-bottom: 6px;
  color: var(--text-muted);
}

.btn-primary {
  width: 100%;
  background-color: var(--primary);
  color: #ffffff;
  padding: 14px;
  border-radius: var(--radius-lg);
  font-weight: 700;
  font-size: 15px;
  box-shadow: var(--shadow-sm);
}

.btn-primary:hover {
  background-color: var(--primary-dark);
  transform: translateY(-1px);
}

.btn-primary:active {
  transform: translateY(1px);
}

.btn-secondary {
  width: 100%;
  background-color: transparent;
  color: var(--text-main);
  padding: 14px;
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  font-weight: 700;
  margin-top: 8px;
}

.btn-secondary:hover {
  background-color: var(--border-color);
}

.card {
  background-color: var(--bg-card);
  border-radius: var(--radius-xl);
  padding: 20px;
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border-color);
  margin-bottom: 16px;
}

.header-container {
  background-color: var(--bg-card);
  padding: 24px 20px;
  border-bottom: 1px solid var(--border-color);
  position: sticky;
  top: 0;
  z-index: 50;
}

.header-title-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}

.app-title {
  font-size: 20px;
  color: var(--primary);
  display: flex;
  align-items: center;
  gap: 8px;
}

.search-bar-wrapper {
  display: flex;
  gap: 8px;
}

.search-btn {
  background-color: var(--primary);
  color: #ffffff;
  padding: 0 20px;
  border-radius: var(--radius-md);
  font-weight: 700;
}

.filter-tabs {
  display: flex;
  gap: 8px;
  padding: 16px 20px;
  overflow-x: auto;
  scrollbar-width: none;
}

.filter-tabs::-webkit-scrollbar {
  display: none;
}

.tab-btn {
  background-color: var(--bg-card);
  border: 1px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 99px;
  font-weight: 700;
  color: var(--text-muted);
  white-space: nowrap;
}

.tab-btn.active {
  background-color: var(--primary);
  color: #ffffff;
  border-color: var(--primary);
}

.section-title {
  padding: 0 20px 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.section-title h3 {
  font-size: 16px;
}

.section-title button {
  color: var(--primary);
  font-size: 13px;
  font-weight: 700;
}

.places-list {
  padding: 0 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.place-card {
  background-color: var(--bg-card);
  border-radius: var(--radius-xl);
  overflow: hidden;
  border: 1px solid var(--border-color);
  box-shadow: var(--shadow-sm);
  transition: var(--transition);
  cursor: pointer;
}

.place-card:hover {
  box-shadow: var(--shadow-md);
  transform: translateY(-2px);
}

.place-image-placeholder {
  height: 160px;
  background-color: var(--primary-light);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 40px;
  position: relative;
}

.badge-status {
  position: absolute;
  top: 12px;
  right: 12px;
  padding: 4px 12px;
  border-radius: 99px;
  font-size: 11px;
  font-weight: 700;
  background-color: rgba(255, 255, 255, 0.9);
  color: var(--text-main);
}

.place-content {
  padding: 16px;
}

.place-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 8px;
}

.place-name {
  font-size: 18px;
  font-weight: 800;
}

.place-price {
  font-size: 16px;
  font-weight: 800;
  color: var(--primary);
}

.place-meta {
  display: flex;
  gap: 12px;
  color: var(--text-muted);
  font-size: 13px;
  margin-bottom: 12px;
}

.place-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 12px;
  border-top: 1px solid var(--border-color);
}

.book-inline-btn {
  color: var(--primary);
  font-weight: 700;
  font-size: 14px;
}

.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 480px;
  background-color: var(--bg-card);
  border-top: 1px solid var(--border-color);
  display: none;
  justify-content: space-around;
  padding: 12px 20px;
  padding-bottom: max(12px, env(safe-area-inset-bottom));
  z-index: 100;
}

.bottom-nav.active {
  display: flex;
}

.nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  color: var(--text-muted);
  font-size: 11px;
  font-weight: 700;
}

.nav-item.active {
  color: var(--primary);
}

.nav-icon {
  width: 24px;
  height: 24px;
}

.nav-icon svg {
  width: 100%;
  height: 100%;
  stroke: currentColor;
  fill: none;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.modal-overlay {
  position: fixed;
  inset: 0;
  background-color: rgba(0, 0, 0, 0.5);
  display: none;
  align-items: flex-end;
  justify-content: center;
  z-index: 200;
}

.modal-overlay.active {
  display: flex;
}

.modal-content {
  background-color: var(--bg-card);
  width: 100%;
  max-width: 480px;
  border-radius: 24px 24px 0 0;
  padding: 24px;
  max-height: 90vh;
  overflow-y: auto;
}

.modal-handle {
  width: 40px;
  height: 4px;
  background-color: var(--border-color);
  border-radius: 4px;
  margin: 0 auto 20px;
}

.grid-selection {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
  gap: 8px;
  margin-bottom: 20px;
}

.selection-btn {
  border: 1px solid var(--border-color);
  padding: 10px;
  border-radius: var(--radius-md);
  text-align: center;
  font-size: 13px;
  font-weight: 700;
  color: var(--text-muted);
}

.selection-btn.active {
  background-color: var(--primary);
  color: #ffffff;
  border-color: var(--primary);
}

.selection-btn.disabled {
  background-color: var(--bg-main);
  opacity: 0.5;
  cursor: not-allowed;
}

.toast-container {
  position: fixed;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background-color: var(--text-main);
  color: var(--bg-card);
  padding: 12px 24px;
  border-radius: 99px;
  font-size: 14px;
  font-weight: 600;
  opacity: 0;
  pointer-events: none;
  transition: var(--transition);
  z-index: 500;
}

.toast-container.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

.hero-section {
  padding: 60px 20px;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
}

.hero-emoji {
  font-size: 64px;
  margin-bottom: 24px;
}

.hero-title {
  font-size: 32px;
  margin-bottom: 12px;
}

.hero-subtitle {
  color: var(--text-muted);
  margin-bottom: 40px;
}

.flex-row { display: flex; }
.flex-col { display: flex; flex-direction: column; }
.items-center { align-items: center; }
.justify-between { justify-content: space-between; }
.gap-2 { gap: 8px; }
.gap-3 { gap: 12px; }
.gap-4 { gap: 16px; }
.mt-2 { margin-top: 8px; }
.mt-4 { margin-top: 16px; }
.mb-2 { margin-bottom: 8px; }
.mb-4 { margin-bottom: 16px; }
.p-4 { padding: 16px; }

@media (min-width: 768px) {
  #app, .bottom-nav, .modal-content {
    max-width: 600px;
  }
}
</style>
</head>
<body>

<div id="app">

  <div id="welcomePage" class="page active">
    <div class="hero-section">
      <div class="hero-emoji">⚽</div>
      <h1 class="hero-title">المستديرة</h1>
      <p class="hero-subtitle">احجز ملعبك في ثوانٍ، بتجربة بسيطة ومباشرة.</p>
      
      <div class="flex-col gap-3" style="width: 100%;">
        <button class="btn-primary" onclick="showPage('home')">تصفح الملاعب</button>
        <button class="btn-secondary" onclick="showPage('login')">تسجيل الدخول / إنشاء حساب</button>
      </div>
    </div>
  </div>

  <div id="loginPage" class="page">
    <div class="header-container">
      <h2>تسجيل الدخول</h2>
    </div>
    <div class="p-4">
      <div class="card">
        <div class="form-group">
          <label class="form-label">رقم الهاتف</label>
          <input type="tel" id="loginPhone" placeholder="079xxxxxxx">
        </div>
        <div class="form-group">
          <label class="form-label">كلمة المرور</label>
          <input type="password" id="loginPassword" placeholder="••••••">
        </div>
        <button class="btn-primary" onclick="handleLogin()">دخول</button>
        <button class="btn-secondary" onclick="showPage('welcome')">رجوع</button>
      </div>
    </div>
  </div>

  <div id="homePage" class="page">
    <div class="header-container">
      <div class="header-title-row">
        <h1 class="app-title">⚽ المستديرة</h1>
        <button onclick="toggleTheme()" class="tab-btn">🌓</button>
      </div>
      <div class="search-bar-wrapper">
        <input type="text" id="searchInput" placeholder="ابحث عن ملعب أو منطقة...">
        <button class="search-btn">بحث</button>
      </div>
    </div>

    <div class="filter-tabs">
      <button class="tab-btn active">الكل</button>
      <button class="tab-btn">عمان</button>
      <button class="tab-btn">إربد</button>
      <button class="tab-btn">الزرقاء</button>
    </div>

    <div class="section-title">
      <h3>الملاعب المتاحة</h3>
      <button>تحديث ↺</button>
    </div>

    <div class="places-list" id="placesContainer">
    </div>
  </div>

  <div id="bookingModal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-handle"></div>
      <h2 class="mb-2" id="modalPlaceName">اسم الملعب</h2>
      <p class="text-muted mb-4">اختر اليوم والوقت المناسب لك</p>
      
      <h4 class="mb-2">الأيام المتاحة</h4>
      <div class="grid-selection" id="modalDays">
      </div>

      <h4 class="mb-2 mt-4">الأوقات المتاحة</h4>
      <div class="grid-selection" id="modalTimes">
      </div>

      <div class="mt-4">
        <button class="btn-primary" onclick="confirmBooking()">تأكيد الحجز</button>
        <button class="btn-secondary" onclick="closeModal('bookingModal')">إلغاء</button>
      </div>
    </div>
  </div>

  <div class="bottom-nav active" id="mainNav">
    <div class="nav-item active" onclick="showPage('home')">
      <div class="nav-icon"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg></div>
      <span>الرئيسية</span>
    </div>
    <div class="nav-item">
      <div class="nav-icon"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg></div>
      <span>حجوزاتي</span>
    </div>
    <div class="nav-item">
      <div class="nav-icon"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></div>
      <span>حسابي</span>
    </div>
  </div>

  <div id="toast" class="toast-container">تمت العملية بنجاح</div>

</div>

<script>
const dummyPlaces = [
  { id: 1, name: "ملعب الأبطال", location: "عمان - طبربور", price: "40", rating: "4.8" },
  { id: 2, name: "ملعب القمة", location: "عمان - خلدا", price: "50", rating: "4.9" },
  { id: 3, name: "أكاديمية النجوم", location: "إربد - الحي الجنوبي", price: "35", rating: "4.5" }
];

function showPage(pageId) {
  document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
  document.getElementById(pageId + 'Page').classList.add('active');
  
  const nav = document.getElementById('mainNav');
  if (pageId === 'home') {
    nav.classList.add('active');
    renderPlaces();
  } else {
    nav.classList.remove('active');
  }
}

function renderPlaces() {
  const container = document.getElementById('placesContainer');
  container.innerHTML = dummyPlaces.map(place => `
    <div class="place-card" onclick="openBookingModal('${place.name}')">
      <div class="place-image-placeholder">
        <span class="badge-status">متاح اليوم</span>
        ⚽
      </div>
      <div class="place-content">
        <div class="place-header">
          <div class="place-name">${place.name}</div>
          <div class="place-price">${place.price} JD</div>
        </div>
        <div class="place-meta">
          <span>📍 ${place.location}</span>
          <span>⭐ ${place.rating}</span>
        </div>
        <div class="place-footer">
          <span class="text-muted">ملعب خماسي</span>
          <span class="book-inline-btn">احجز الآن ←</span>
        </div>
      </div>
    </div>
  `).join('');
}

function openBookingModal(placeName) {
  document.getElementById('modalPlaceName').textContent = placeName;
  
  const days = ['الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء'];
  document.getElementById('modalDays').innerHTML = days.map((day, i) => 
    `<button class="selection-btn ${i===0 ? 'active' : ''}">${day}</button>`
  ).join('');

  const times = ['4:00 م', '6:00 م', '8:00 م', '10:00 م'];
  document.getElementById('modalTimes').innerHTML = times.map((time, i) => 
    `<button class="selection-btn ${i===1 ? 'disabled' : ''}">${time}</button>`
  ).join('');

  document.getElementById('bookingModal').classList.add('active');
}

function closeModal(modalId) {
  document.getElementById(modalId).classList.remove('active');
}

function confirmBooking() {
  closeModal('bookingModal');
  showToast('تم إرسال طلب الحجز بنجاح!');
}

function showToast(message) {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.classList.add('show');
  setTimeout(() => {
    toast.classList.remove('show');
  }, 3000);
}

function handleLogin() {
  showPage('home');
  showToast('تم تسجيل الدخول بنجاح');
}

function toggleTheme() {
  document.body.classList.toggle('dark');
}

document.addEventListener('click', (e) => {
  if (e.target.classList.contains('modal-overlay')) {
    e.target.classList.remove('active');
  }
});
</script>
</body>
</html>
