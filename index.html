<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#091a0f">
<title>المستديرة - احجز ملعبك</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
/* ============ RESET & BASE ============ /
,::before,::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

:root{
/* Core palette */
--forest:#071910; --forest-2:#0d2b18; --emerald:#1a6b3c; --emerald-2:#22883e; --sage:#4a8c64;
--gold:#c9a84c; --gold-2:#e8c96a; --gold-glow:rgba(201,168,76,.35);
--cream:#f0ede6; --surface:#ffffff; --surface-soft:#f7f5f0; --surface-muted:#ede9e0;
--input-bg:#ffffff; --ink:#0f1419; --ink-2:#374151; --muted:#6b7280; --soft:#9ca3af;
--text-muted:#6b7280; --soft-green:#e8f5ec; --soft-blue:#eff6ff;
--soft-yellow:#fef3c7; --soft-red:#fee2e2;
--line:rgba(10,61,31,.07); --line-2:rgba(10,61,31,.12);

/* Shadows - richer */
--shadow-xs:0 1px 2px rgba(7,25,16,.06);
--shadow-sm:0 2px 6px rgba(7,25,16,.07),0 1px 2px rgba(7,25,16,.05);
--shadow-md:0 6px 20px rgba(7,25,16,.10),0 2px 6px rgba(7,25,16,.06);
--shadow-lg:0 16px 40px rgba(7,25,16,.14),0 4px 10px rgba(7,25,16,.06);
--shadow-card:0 8px 28px rgba(7,25,16,.09),0 2px 6px rgba(7,25,16,.05);
--shadow-green:0 8px 28px rgba(26,107,60,.22),0 3px 8px rgba(26,107,60,.14);
--shadow-green-lg:0 16px 40px rgba(26,107,60,.28),0 6px 16px rgba(26,107,60,.16);
--shadow-gold:0 6px 20px rgba(201,168,76,.28);

/* Radii */
--r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:20px; --r-2xl:26px; --r-3xl:32px;

/* Spacing */
--s-1:4px;--s-2:8px;--s-3:12px;--s-4:16px;--s-5:20px;--s-6:24px;--s-8:32px;

/* Transitions */
--ease-out:cubic-bezier(.16,1,.3,1); --ease-spring:cubic-bezier(.34,1.56,.64,1);
--ease-smooth:cubic-bezier(.4,0,.2,1);
--t-fast:120ms; --t-base:200ms; --t-slow:300ms; --t-slower:450ms;
--max:480px;

/* Gradient shorthand */
--g-main:linear-gradient(160deg,var(--forest),var(--emerald));
--g-gold:linear-gradient(135deg,var(--gold),var(--gold-2));
--g-btn:linear-gradient(140deg,#1f8045,#0d5228);
}

body.dark{
--cream:#080f0a; --surface:#101510; --surface-soft:#151c15; --surface-muted:#0d1210;
--input-bg:#161e16; --ink:#e8ede8; --ink-2:#c4cdc4; --muted:#8aa38a; --soft:#5a6b5a;
--text-muted:#8aa38a; --soft-green:#0f2416; --soft-blue:#101c2a; --soft-yellow:#251c08;
--soft-red:#280d0d; --line:rgba(255,255,255,.05); --line-2:rgba(255,255,255,.08);
--shadow-xs:0 1px 2px rgba(0,0,0,.3); --shadow-sm:0 2px 6px rgba(0,0,0,.32);
--shadow-md:0 6px 20px rgba(0,0,0,.38),0 2px 6px rgba(0,0,0,.22);
--shadow-lg:0 16px 40px rgba(0,0,0,.48),0 4px 10px rgba(0,0,0,.28);
--shadow-card:0 8px 28px rgba(0,0,0,.38),0 2px 6px rgba(0,0,0,.22);
--surface:var(--surface);
--forest:#091a0f; --forest-2:#0f2418; --emerald:#1d5b39; --emerald-2:#237040; --gold:#d4b35a; --gold-2:#f0d07a;
}

html,body{height:100%;direction:rtl;background:var(--cream);color:var(--ink);font-family:'Tajawal','Cairo',-apple-system,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{display:flex;justify-content:center;background:var(--cream);font-size:14px;line-height:1.55}
#app{width:100%;max-width:var(--max);min-height:100vh;background:var(--cream);position:relative;overflow-x:hidden}

.page{display:none;padding-bottom:90px;min-height:100vh;background:var(--cream)}
.page.active{display:block;animation:pageIn var(--t-slow) var(--ease-out) both}
@keyframes pageIn{from{opacity:0;transform:translate3d(0,10px,0)}to{opacity:1;transform:translate3d(0,0,0)}}

h1,h2,h3{font-family:'Cairo','Tajawal',sans-serif;font-weight:900;letter-spacing:-.015em}
input,select,button,textarea{font-family:inherit;color:var(--ink);font-size:14px}
button{cursor:pointer;border:none;background:none}

/* ============ NOISE TEXTURE ============ */
.noise-overlay::before{content:'';position:absolute;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");pointer-events:none;z-index:0;border-radius:inherit;opacity:.5}

/* ============ FORMS ============ */
.form-label{font-size:12px;font-weight:800;color:var(--ink-2);display:block;margin-bottom:6px;letter-spacing:.01em}
.form-label-sm{font-size:11.5px;font-weight:700;color:var(--ink-2);display:block;margin-bottom:5px}
.field-title{font-size:13px;font-weight:800;color:var(--ink);margin-bottom:10px;letter-spacing:-.01em}
.finput{
width:100%;border:1.5px solid var(--line-2);border-radius:var(--r-md);padding:12px 14px;
font-size:14px;color:var(--ink);outline:none;background:var(--input-bg);
transition:border-color var(--t-base),box-shadow var(--t-base),background var(--t-fast)
}
.finput:focus{border-color:rgba(34,136,62,.55);box-shadow:0 0 0 3px rgba(34,136,62,.12),0 2px 8px rgba(26,107,60,.08)}
.finput::placeholder{color:var(--soft)}

/* ============ BUTTONS ============ */
.sbtn{
width:100%;background:var(--g-btn)!important;color:#fff;border:none;
border-radius:var(--r-lg);padding:15px;font-size:15px;font-weight:800;
box-shadow:var(--shadow-green);letter-spacing:.01em;position:relative;overflow:hidden;
transition:transform var(--t-fast) var(--ease-spring),box-shadow var(--t-base),opacity var(--t-fast)
}
.sbtn::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.12),transparent 60%);pointer-events:none}
.sbtn:hover{transform:translate3d(0,-2px,0);box-shadow:var(--shadow-green-lg)}
.sbtn:active{transform:translate3d(0,1px,0) scale(.99);opacity:.92;box-shadow:var(--shadow-green)}

.cbtn{
width:100%;background:var(--surface);color:var(--ink-2);border:1.5px solid var(--line-2);
border-radius:var(--r-lg);padding:13px;font-size:13px;font-weight:700;margin-top:10px;
transition:background var(--t-fast),border-color var(--t-fast),transform var(--t-fast)
}
.cbtn:hover{background:var(--surface-soft);border-color:rgba(26,107,60,.22);transform:translate3d(0,-1px,0)}
.cbtn:active{transform:scale(.99);opacity:.9}

/* ============ CARD ============ */
.card{background:var(--surface);border-radius:var(--r-xl);padding:16px;box-shadow:var(--shadow-card);color:var(--ink);border:1px solid rgba(0,0,0,.04)}

/* ============ BADGES ============ */
.badge-green,.badge-red,.badge-yellow,.badge-blue{
border-radius:999px;padding:5px 12px;font-size:11px;font-weight:800;
display:inline-flex;align-items:center;gap:6px;white-space:nowrap;letter-spacing:.01em
}
.badge-green{background:var(--surface);color:#15803d;border:1.5px solid rgba(21,128,61,.22)}
.badge-red{background:var(--surface);color:#dc2626;border:1.5px solid rgba(220,38,38,.20)}
.badge-yellow{background:var(--surface);color:#92400e;border:1.5px solid rgba(245,158,11,.25)}
.badge-blue{background:var(--soft-blue);color:#1d4ed8;border:1.5px solid rgba(29,78,216,.14)}
.badge-green::before,.badge-red::before,.badge-yellow::before{content:'';width:6px;height:6px;border-radius:999px;display:inline-block;flex-shrink:0}
.badge-green::before{background:#16a34a;box-shadow:0 0 0 2px rgba(22,163,74,.2)}
.badge-red::before{background:#dc2626}
.badge-yellow::before{background:#f59e0b}

/* ============ FILTER TABS ============ */
.ftab{
background:var(--surface);border:1.5px solid var(--line-2);border-radius:999px;
padding:9px 17px;font-size:12px;font-weight:800;color:var(--ink-2);white-space:nowrap;
flex-shrink:0;transition:all var(--t-base) var(--ease-out);
box-shadow:var(--shadow-xs);letter-spacing:.01em
}
.ftab.active-tab{
background:var(--g-btn);border-color:transparent;color:#fff;
box-shadow:var(--shadow-green);transform:translate3d(0,-1px,0)
}
.ftab:not(.active-tab):hover{border-color:rgba(26,107,60,.35);transform:translate3d(0,-1px,0);box-shadow:var(--shadow-sm)}

/* ============ HEADER — REVAMPED ============ /
.header{
background:linear-gradient(160deg,var(--forest) 0%,var(--forest-2) 40%,#0d3b20 100%);
color:#fff;position:relative;overflow:hidden;padding:20px 18px 68px;border-radius:0 0 36px 36px;
box-shadow:0 8px 32px rgba(7,25,16,.28)
}
/ Animated radial glow /
.header::before{
content:'';position:absolute;top:-80px;left:-60px;width:280px;height:280px;border-radius:50%;
background:radial-gradient(circle,rgba(201,168,76,.15) 0%,transparent 65%);
animation:pulseGlow 4s ease-in-out infinite;pointer-events:none
}
@keyframes pulseGlow{0%,100%{transform:scale(1);opacity:.8}50%{transform:scale(1.15);opacity:1}}
.header::after{content:'';position:absolute;bottom:-80px;right:-40px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(34,136,62,.18) 0%,transparent 65%);pointer-events:none}
/ Grid lines decoration /
.header-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:32px 32px;pointer-events:none}
.header>{position:relative;z-index:1}

.lux-page-header{
background:linear-gradient(160deg,var(--forest),var(--forest-2) 50%,#0d3b20);
color:#fff;position:relative;overflow:hidden;box-shadow:0 8px 32px rgba(7,25,16,.25)
}
.lux-page-header::before{content:'';position:absolute;top:-60px;left:-50px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(201,168,76,.12) 0%,transparent 65%);pointer-events:none;animation:pulseGlow 5s ease-in-out infinite}
.lux-page-header::after{content:'';position:absolute;bottom:-60px;right:-35px;width:190px;height:190px;border-radius:50%;background:radial-gradient(circle,rgba(34,136,62,.12) 0%,transparent 65%);pointer-events:none}
.lux-page-header>*{position:relative;z-index:1}
.lux-page-header.auth{padding:54px 24px 36px;text-align:center;border-radius:0 0 32px 32px}
.lux-page-header.compact{padding:22px 18px;text-align:right;border-radius:0 0 24px 24px}
.lux-page-header.owner{padding:22px 18px 26px;text-align:right;border-radius:0 0 32px 32px}

.lux-logo-box{
width:72px;height:72px;border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:34px;margin:0 auto 16px;
background:linear-gradient(135deg,rgba(201,168,76,.25),rgba(255,255,255,.12));
border:1.5px solid rgba(201,168,76,.3);box-shadow:0 4px 16px rgba(201,168,76,.2),inset 0 1px 0 rgba(255,255,255,.2)
}
.lux-header-emoji{font-size:44px;margin-bottom:12px;display:block;filter:drop-shadow(0 4px 12px rgba(0,0,0,.3))}
.lux-header-title{font-size:23px;font-weight:900;letter-spacing:-.02em;text-shadow:0 2px 8px rgba(0,0,0,.2)}
.lux-header-subtitle{font-size:12px;opacity:.7;margin-top:5px;font-weight:500}
.lux-title-row{display:flex;align-items:center;gap:9px;font-size:19px;font-weight:900;letter-spacing:-.02em;text-shadow:0 2px 8px rgba(0,0,0,.15)}
.lux-owner-head{display:flex;justify-content:space-between;align-items:center}
.lux-exit-btn{
background:rgba(255,255,255,.12);color:#fff;border:1.5px solid rgba(255,255,255,.20);
border-radius:12px;padding:8px 12px;font-size:12px;font-weight:800;
transition:background var(--t-fast),transform var(--t-fast);
box-shadow:0 2px 8px rgba(0,0,0,.15)
}
.lux-exit-btn:hover{background:rgba(255,255,255,.20);transform:translate3d(0,-1px,0)}
.lux-exit-btn:active{transform:scale(.96)}
.lux-muted-white{font-size:12px;opacity:.68;margin-top:3px;font-weight:500}
.lux-page-pad{padding:24px 18px}
.lux-home-pad{padding:26px 20px}
.lux-header-svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 1px 3px rgba(0,0,0,.3))}

/* ============ WELCOME / LANDING — REVAMPED ============ /
.welcome-hero{
background:linear-gradient(155deg,var(--forest) 0%,#0f2d18 35%,#14452a 70%,#1a5e35 100%);
padding:56px 24px 40px;text-align:center;color:#fff;
border-radius:0 0 40px 40px;position:relative;overflow:hidden;
box-shadow:0 12px 40px rgba(7,25,16,.35)
}
/ Decorative rings */
.welcome-hero::before{
content:'';position:absolute;top:-100px;left:50%;transform:translateX(-50%);
width:320px;height:320px;border-radius:50%;
border:1px solid rgba(201,168,76,.12);
box-shadow:0 0 0 40px rgba(201,168,76,.05),0 0 0 80px rgba(201,168,76,.03);
pointer-events:none
}
.welcome-hero::after{
content:'';position:absolute;inset:0;
background:repeating-linear-gradient(45deg,transparent,transparent 30px,rgba(255,255,255,.008) 30px,rgba(255,255,255,.008) 31px);
pointer-events:none
}
.welcome-ball-wrap{position:relative;z-index:1;margin-bottom:18px}
.welcome-ball{
font-size:62px;display:inline-block;
animation:ballFloat 3s ease-in-out infinite;
filter:drop-shadow(0 8px 20px rgba(0,0,0,.35));
}
@keyframes ballFloat{0%,100%{transform:translateY(0) rotate(-3deg)}33%{transform:translateY(-10px) rotate(3deg)}66%{transform:translateY(-5px) rotate(-1deg)}}
.welcome-title{
font-size:34px;font-weight:900;font-family:'Cairo',sans-serif;
margin-bottom:7px;letter-spacing:-.03em;position:relative;z-index:1;
text-shadow:0 3px 12px rgba(0,0,0,.25)
}
.welcome-title span{
background:var(--g-gold);-webkit-background-clip:text;-webkit-text-fill-color:transparent;
background-clip:text
}
.welcome-sub{font-size:14px;opacity:.72;margin-bottom:34px;position:relative;z-index:1;font-weight:500}
.welcome-actions{display:flex;flex-direction:column;gap:11px;max-width:310px;margin:0 auto;position:relative;z-index:1}
.welcome-cta{
padding:16px;border-radius:16px;font-size:15px;font-weight:800;cursor:pointer;
transition:transform var(--t-fast) var(--ease-spring),box-shadow var(--t-base);border:none;
letter-spacing:.01em;position:relative;overflow:hidden
}
.welcome-cta:active{transform:scale(.96)!important}
.welcome-cta-primary{
background:#fff;color:var(--forest);
box-shadow:0 4px 20px rgba(0,0,0,.2),0 1px 4px rgba(0,0,0,.1),inset 0 1px 0 rgba(255,255,255,.8)
}
.welcome-cta-primary::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.4),transparent 60%);pointer-events:none}
.welcome-cta-primary:hover{transform:translate3d(0,-2px,0);box-shadow:0 8px 28px rgba(0,0,0,.28)}
.welcome-cta-secondary{
background:rgba(255,255,255,.1);color:#fff;
border:1.5px solid rgba(255,255,255,.28);backdrop-filter:blur(8px);
box-shadow:0 2px 12px rgba(0,0,0,.15)
}
.welcome-cta-secondary:hover{background:rgba(255,255,255,.18);transform:translate3d(0,-2px,0)}
.welcome-cta-ghost{background:transparent;color:rgba(255,255,255,.6);font-size:13px;padding:10px}
.welcome-cta-ghost:hover{color:rgba(255,255,255,.85)}

.trust-row{display:flex;justify-content:center;gap:24px;margin-top:32px;flex-wrap:wrap;position:relative;z-index:1}
.trust-item{display:flex;flex-direction:column;align-items:center;gap:4px}
.trust-num{font-size:22px;font-weight:900;font-family:'Cairo',sans-serif;text-shadow:0 2px 8px rgba(0,0,0,.2)}
.trust-label{font-size:10px;opacity:.7;font-weight:600;letter-spacing:.02em}
.trust-divider{width:1px;height:36px;background:rgba(255,255,255,.15);align-self:center}

/* ============ MODAL ============ */
.modal-overlay{
display:none;position:fixed;inset:0;background:rgba(7,25,16,.55);z-index:200;
align-items:flex-end;justify-content:center;backdrop-filter:blur(8px);
-webkit-backdrop-filter:blur(8px);opacity:0;transition:opacity var(--t-base)
}
.modal-overlay.show{display:flex;opacity:1}
.modal{
background:var(--surface);border-radius:28px 28px 0 0;width:100%;max-width:var(--max);
max-height:92vh;overflow-y:auto;padding:20px 18px max(22px,env(safe-area-inset-bottom));
border-top:2px solid var(--gold);
box-shadow:0 -12px 48px rgba(7,25,16,.22),0 -2px 8px rgba(7,25,16,.08);
animation:slideUp var(--t-slow) var(--ease-out) both;-webkit-overflow-scrolling:touch
}
@keyframes slideUp{from{transform:translate3d(0,100%,0)}to{transform:translate3d(0,0,0)}}
.modal-handle{width:48px;height:5px;background:var(--line-2);border-radius:999px;margin:0 auto 16px}

/* ============ SUCCESS ============ */
.success-overlay{
display:none;position:fixed;inset:0;background:rgba(7,25,16,.6);z-index:300;
align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(10px);
-webkit-backdrop-filter:blur(10px);opacity:0;transition:opacity var(--t-base)
}
.success-overlay.show{display:flex;opacity:1}
.scard{
background:var(--surface);border-radius:var(--r-2xl);padding:34px 24px;text-align:center;
width:100%;max-width:320px;box-shadow:var(--shadow-lg);
animation:popIn var(--t-slow) var(--ease-spring) both;border:1px solid rgba(0,0,0,.04)
}
@keyframes popIn{from{transform:scale(.88);opacity:0}to{transform:scale(1);opacity:1}}

/* ============ TOAST ============ */
.toast{
position:fixed;left:50%;bottom:100px;transform:translate3d(-50%,14px,0);
background:var(--surface);border:1px solid var(--line-2);border-radius:16px;
padding:13px 16px;font-size:13px;font-weight:700;z-index:500;max-width:min(92%,420px);
box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;
transition:opacity var(--t-base),transform var(--t-base) var(--ease-out);
text-align:right;line-height:1.5;display:flex;align-items:center;gap:10px;color:var(--ink)
}
.toast.show{opacity:1;transform:translate3d(-50%,0,0)}
.toast-icon{width:24px;height:24px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 24px;font-weight:900;font-size:13px}
.toast.error .toast-icon{background:#fee2e2;color:#dc2626}
.toast.success .toast-icon{background:#dcfce7;color:#15803d}
.toast.warn .toast-icon{background:#fef3c7;color:#92400e}
.toast.error{color:#7a1f1f}
.toast.success{color:#0c5641}
.toast.warn{color:#633806}

/* ============ SKELETON ============ */
@keyframes shimmer{0%{background-position:-500px 0}100%{background-position:500px 0}}
.skeleton-card{background:var(--surface);border-radius:var(--r-xl);box-shadow:var(--shadow-sm);overflow:hidden;margin-bottom:12px}
.skeleton-img,.skeleton-line{
background:linear-gradient(90deg,rgba(0,0,0,.04) 0%,rgba(0,0,0,.08) 50%,rgba(0,0,0,.04) 100%);
background-size:700px 100%;animation:shimmer 1.5s linear infinite
}
.skeleton-img{height:160px}
.skeleton-body{padding:16px}
.skeleton-line{height:12px;border-radius:999px;margin-bottom:10px}
.skeleton-line.w70{width:70%}
.skeleton-line.w45{width:45%}
.skeleton-line.w88{width:88%}
.loading-box{background:transparent;border:none;padding:0}
.time-skeleton{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.time-skeleton>span{height:44px;border-radius:12px;background:linear-gradient(90deg,rgba(0,0,0,.04) 0%,rgba(0,0,0,.08) 50%,rgba(0,0,0,.04) 100%);background-size:500px 100%;animation:shimmer 1.5s linear infinite}
.day-btn.is-loading{opacity:.7;pointer-events:none}
body.dark .skeleton-img,body.dark .skeleton-line,body.dark .time-skeleton>span{background:linear-gradient(90deg,rgba(255,255,255,.04) 0%,rgba(255,255,255,.09) 50%,rgba(255,255,255,.04) 100%)!important;background-size:500px 100%!important}

/* ============ BOTTOM NAV — REVAMPED ============ */
.bnav{
position:fixed;bottom:0;left:50%;transform:translate3d(-50%,0,0);width:100%;max-width:var(--max);
background:rgba(255,255,255,.9);backdrop-filter:blur(24px) saturate(200%);
-webkit-backdrop-filter:blur(24px) saturate(200%);
border-top:1px solid rgba(0,0,0,.07);
display:none;justify-content:space-around;
padding:6px 12px max(12px,env(safe-area-inset-bottom));
z-index:100;box-shadow:0 -4px 24px rgba(7,25,16,.08)
}
.bnav.show{display:flex}
.nitem{
display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;
color:var(--soft);padding:2px 14px;min-width:60px;
transition:color var(--t-base);font-weight:700;cursor:pointer;
border-radius:14px;padding:6px 14px;
transition:all var(--t-base) var(--ease-out)
}
.nitem.active{color:var(--forest)}
.nitem.active .nicon{
background:linear-gradient(140deg,rgba(34,136,62,.15),rgba(26,107,60,.1));
border-radius:14px;box-shadow:0 2px 8px rgba(26,107,60,.12)
}
.nicon{width:38px;height:32px;margin-bottom:1px;display:flex;align-items:center;justify-content:center;transition:all var(--t-base) var(--ease-spring)}
.nicon svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nitem:active .nicon{transform:scale(.88)}
.nitem.active:active .nicon{transform:scale(.92)}

/* ============ DAY & TIME BUTTONS — REVAMPED ============ */
.day-btn{
border:1.5px solid var(--line-2);background:var(--surface);color:var(--ink-2);
border-radius:14px;padding:9px 8px;font-size:11px;font-weight:700;min-width:68px;
flex-shrink:0;transition:all var(--t-base) var(--ease-out);
box-shadow:var(--shadow-xs)
}
.day-btn.active{
background:var(--g-btn);border-color:transparent;color:#fff;
box-shadow:var(--shadow-green);transform:translate3d(0,-1px,0)
}
.day-btn:hover:not(.active){border-color:rgba(26,107,60,.32);transform:translate3d(0,-1px,0);box-shadow:var(--shadow-sm)}

.tbtn{
border:1.5px solid rgba(26,107,60,.18);border-radius:13px;padding:11px 5px;
text-align:center;font-size:11px;font-weight:800;color:#16a34a;background:var(--soft-green);
transition:all var(--t-base) var(--ease-out);line-height:1.4;position:relative;overflow:hidden
}
.tbtn::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.18),transparent 70%);pointer-events:none}
.tbtn:not(.taken):hover{border-color:var(--emerald);transform:translate3d(0,-1px,0);box-shadow:0 4px 12px rgba(26,107,60,.18)}
.tbtn.sel{
background:var(--g-btn);border-color:transparent;color:#fff;
box-shadow:var(--shadow-green);transform:translate3d(0,-1px,0)
}
.tbtn.taken{background:var(--surface-muted);color:var(--soft);cursor:not-allowed;border-color:var(--line);opacity:.7}

/* ============ PLACE CARDS — FULLY REVAMPED ============ */
.place-card{
background:var(--surface);border-radius:22px;overflow:hidden;cursor:pointer;
box-shadow:var(--shadow-card);
transition:transform var(--t-slow) var(--ease-out),box-shadow var(--t-slow);
position:relative;opacity:0;animation:fadeUp var(--t-slower) var(--ease-out) forwards;will-change:transform;
border:1px solid rgba(0,0,0,.045)
}
@keyframes fadeUp{from{opacity:0;transform:translate3d(0,16px,0)}to{opacity:1;transform:translate3d(0,0,0)}}
.place-card:nth-child(1){animation-delay:.00s}
.place-card:nth-child(2){animation-delay:.07s}
.place-card:nth-child(3){animation-delay:.14s}
.place-card:nth-child(4){animation-delay:.21s}
.place-card:nth-child(5){animation-delay:.28s}
.place-card:hover{transform:translate3d(0,-4px,0);box-shadow:0 20px 50px rgba(7,25,16,.15),0 6px 16px rgba(7,25,16,.08)}
.place-card:active{transform:translate3d(0,-1px,0);box-shadow:var(--shadow-card)}

.place-cover{
height:178px;background-size:cover!important;background-position:center!important;
position:relative;display:flex;align-items:flex-end;overflow:hidden
}
/* Shine effect on hover */
.place-cover::before{
content:'';position:absolute;top:0;left:-120%;width:80%;height:100%;
background:linear-gradient(105deg,transparent 20%,rgba(255,255,255,.12) 50%,transparent 80%);
pointer-events:none;z-index:4;transition:left var(--t-slow) ease
}
.place-card:hover .place-cover::before{left:130%}
.place-cover::after{
content:'';position:absolute;inset:0;
background:linear-gradient(to bottom,transparent 0%,rgba(0,0,0,.08) 35%,rgba(5,15,8,.82) 100%);
z-index:1
}
.place-cover-emoji{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:52px;z-index:0;filter:blur(2px) opacity(.6)}
.place-top-badges{position:absolute;top:11px;right:11px;left:11px;z-index:3;display:flex;justify-content:space-between;align-items:flex-start}
.place-avail-badge{
border-radius:999px;padding:6px 12px;font-size:10px;font-weight:800;
backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);letter-spacing:.02em;
box-shadow:0 2px 8px rgba(0,0,0,.18)
}
.avail-yes{background:rgba(220,252,231,.92);color:#166534}
.avail-no{background:rgba(254,226,226,.92);color:#991b1b}
.place-price-badge{
background:rgba(255,255,255,.94);border-radius:999px;padding:6px 12px;
font-size:11px;font-weight:900;color:var(--forest);
box-shadow:0 2px 10px rgba(0,0,0,.18);letter-spacing:.01em
}

.place-footer{position:absolute;bottom:0;left:0;right:0;z-index:3;padding:14px 15px 16px}
.place-name{font-size:18px;font-weight:900;color:#fff;letter-spacing:-.02em;text-shadow:0 2px 6px rgba(0,0,0,.25);line-height:1.2}
.place-meta-row{display:flex;align-items:center;justify-content:space-between;margin-top:5px}
.place-loc{font-size:11px;color:rgba(255,255,255,.78);display:flex;align-items:center;gap:3px;font-weight:600}
.place-rating{font-size:11px;color:rgba(255,255,255,.92);font-weight:800;background:rgba(0,0,0,.25);border-radius:999px;padding:3px 8px;backdrop-filter:blur(6px)}

.place-strip{
display:flex;align-items:center;justify-content:space-between;
padding:11px 15px;gap:12px;background:var(--surface)
}
.place-strip-info{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.place-strip-type{font-size:11px;color:var(--muted);font-weight:700}
.place-strip-fields{font-size:11px;color:var(--muted)}
.place-book-btn{
background:var(--g-btn)!important;color:#fff!important;border:none;border-radius:12px;
padding:10px 18px;font-size:12px;font-weight:800;white-space:nowrap;flex-shrink:0;
box-shadow:var(--shadow-green);cursor:pointer;position:relative;overflow:hidden;
transition:transform var(--t-fast) var(--ease-spring),box-shadow var(--t-base)
}
.place-book-btn::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.15),transparent 60%);pointer-events:none}
.place-book-btn:hover{transform:translate3d(0,-2px,0) scale(1.03);box-shadow:var(--shadow-green-lg)}
.place-book-btn:active{transform:scale(.96)}

/* ============ AMENITIES ============ */
.amenities-row{display:flex;gap:7px;flex-wrap:wrap;padding:0 15px 12px}
.amenity-chip{
background:linear-gradient(135deg,rgba(34,136,62,.08),rgba(26,107,60,.06));
border:1px solid rgba(26,107,60,.14);border-radius:999px;padding:4px 11px;
font-size:10px;font-weight:800;color:#15803d;display:inline-flex;align-items:center;gap:4px
}

/* ============ SECTION TITLE ============ */
.sec-title{font-size:15px;font-weight:900;color:var(--ink);padding:0 16px 13px;display:flex;justify-content:space-between;align-items:center;letter-spacing:-.01em}
.sec-title a{color:var(--emerald);cursor:pointer;font-size:12px;font-weight:700}

/* ============ SEARCH BAR ============ */
.search-bar{
margin-top:18px;background:rgba(255,255,255,.97);border-radius:16px;
display:flex;align-items:center;padding:4px 4px 4px 14px;gap:8px;position:relative;z-index:1;
box-shadow:0 6px 24px rgba(0,0,0,.16),0 2px 6px rgba(0,0,0,.08);
border:1px solid rgba(255,255,255,.9)
}
.search-bar input{flex:1;border:none;outline:none;font-size:13px;color:var(--ink-2);background:transparent;padding:10px 0;font-weight:500}
.search-btn{
background:var(--g-btn);color:#fff;border:none;border-radius:12px;
padding:10px 16px;font-size:12px;font-weight:800;cursor:pointer;
box-shadow:0 2px 8px rgba(26,107,60,.25);transition:all var(--t-fast) var(--ease-spring)
}
.search-btn:hover{transform:scale(1.05);box-shadow:0 4px 14px rgba(26,107,60,.35)}
.search-btn:active{transform:scale(.96)}

/* ============ OWNER STATS ============ */
.owner-stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;margin-bottom:14px}
.owner-stat-card{
background:var(--surface);border-radius:20px;padding:14px;min-height:86px;
box-shadow:var(--shadow-card);opacity:0;animation:fadeUp var(--t-base) var(--ease-out) forwards;
border:1px solid rgba(0,0,0,.04);position:relative;overflow:hidden
}
.owner-stat-card::after{content:'';position:absolute;top:-30px;right:-20px;width:80px;height:80px;border-radius:50%;opacity:.06;pointer-events:none}
.owner-stat-card.stat-confirmed::after{background:#16a34a}
.owner-stat-card.stat-pending::after{background:#f59e0b}
.owner-stat-card.stat-today::after{background:#2563eb}
.owner-stat-card:nth-child(1){animation-delay:.04s}
.owner-stat-card:nth-child(2){animation-delay:.08s}
.owner-stat-card:nth-child(3){animation-delay:.12s}
.owner-stat-card:nth-child(4){animation-delay:.16s}
.owner-stat-card.stat-confirmed{border-right:3px solid #16a34a}
.owner-stat-card.stat-pending{border-right:3px solid #f59e0b}
.owner-stat-card.stat-today{border-right:3px solid #2563eb}
.owner-stat-value{font-size:22px;font-weight:900;color:var(--ink);line-height:1.2;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.owner-stat-label{font-size:11px;color:var(--muted);margin-top:4px;font-weight:800}
.owner-stat-hint{font-size:10px;color:var(--soft);margin-top:2px}

.owner-mini-row{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;color:var(--ink-2);margin-bottom:8px}
.owner-progress{height:8px;background:var(--surface-muted);border-radius:999px;overflow:hidden}
.owner-progress>div{height:100%;background:linear-gradient(90deg,#2563eb,#3b82f6);border-radius:999px;transition:width 700ms var(--ease-out)}
.owner-section-title{font-size:14px;font-weight:900;color:var(--ink);margin-bottom:11px;display:flex;justify-content:space-between;align-items:center;letter-spacing:-.01em}
.mini-badge{background:var(--soft-blue);color:#1d4ed8;border-radius:999px;padding:3px 10px;font-size:10px;font-weight:800}
.day-group-header{position:sticky;top:0;z-index:10}

/* ============ SUBFIELD CARD ============ */
.subfield-card{
border:1.5px solid var(--line-2);border-radius:16px;padding:12px 14px;
background:var(--surface);box-shadow:var(--shadow-xs);
transition:all var(--t-base) var(--ease-out);cursor:pointer
}
.subfield-card:hover:not(.active){border-color:rgba(26,107,60,.3);transform:translate3d(0,-1px,0)}
.subfield-card.active{
border-color:var(--emerald-2);background:var(--soft-green);
box-shadow:0 0 0 3px rgba(34,136,62,.1),var(--shadow-sm);transform:translate3d(0,-1px,0)
}

.star{font-size:28px;color:#d1d5db;cursor:pointer;padding:0 3px;display:inline-block;transition:all var(--t-base) var(--ease-spring)}
.star.active{color:#f59e0b;text-shadow:0 2px 8px rgba(245,158,11,.4)}
.star:hover{transform:scale(1.2);color:#fbbf24}

.owner-action{
border:none;border-radius:10px;padding:9px 13px;font-size:12px;font-weight:800;color:#fff;
display:inline-flex;align-items:center;gap:5px;box-shadow:var(--shadow-sm);
transition:transform var(--t-fast) var(--ease-spring),box-shadow var(--t-base)
}
.owner-action:hover{transform:translate3d(0,-2px,0);box-shadow:var(--shadow-md)}
.owner-action:active{transform:scale(.95);box-shadow:var(--shadow-xs)}
.owner-confirm{background:linear-gradient(135deg,#16a34a,#14532d)}
.owner-reject{background:linear-gradient(135deg,#d97706,#92400e)}
.owner-cancel{background:linear-gradient(135deg,#dc2626,#991b1b)}
.owner-edit{background:linear-gradient(135deg,#2563eb,#1e40af)}

.booking-status-strip{border-right-width:4px!important;border-right-style:solid!important}
.booking-status-strip.confirmed{border-right-color:#16a34a!important}
.booking-status-strip.pending{border-right-color:#f59e0b!important}
.booking-status-strip.cancelled,.booking-status-strip.rejected{border-right-color:#dc2626!important}

/* ============ DETAIL PAGE ============ */
#detailHeader{border-radius:0 0 32px 32px;overflow:hidden;position:relative}
#detailHeader::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,25,16,.1),rgba(7,25,16,.38));pointer-events:none}
#dPrice,#mPrice{
display:inline-block!important;padding:7px 12px;
background:linear-gradient(135deg,rgba(34,136,62,.12),rgba(26,107,60,.08));
border:1.5px solid rgba(26,107,60,.18);border-radius:13px;box-shadow:0 2px 8px rgba(26,107,60,.12);
font-weight:900!important;color:var(--forest)!important;font-size:inherit;
line-height:1.4;font-variant-numeric:tabular-nums
}

/* ============ ECON CARDS ============ */
.econ-card{background:var(--surface);border:1px solid rgba(201,168,76,.16);border-radius:var(--r-xl);padding:15px;box-shadow:var(--shadow-card);margin-bottom:14px}
.econ-title{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;font-weight:900;color:var(--ink);margin-bottom:12px;letter-spacing:-.01em}
.econ-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.econ-item{background:var(--surface-soft);border:1px solid var(--line);border-radius:14px;padding:12px;min-height:80px;transition:all var(--t-fast)}
.econ-item:hover{border-color:rgba(26,107,60,.2);transform:translate3d(0,-1px,0)}
.econ-value{font-size:19px;font-weight:900;color:var(--ink);line-height:1.2;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.econ-label{font-size:10.5px;font-weight:800;color:var(--muted);margin-top:5px}
.econ-hint{font-size:9.5px;font-weight:600;color:var(--soft);margin-top:2px;line-height:1.4}
.econ-decision{margin-top:11px;padding:11px 13px;border-radius:13px;background:linear-gradient(135deg,rgba(34,136,62,.1),rgba(26,107,60,.07));color:#14532d;font-size:12px;font-weight:700;line-height:1.65;border:1px solid rgba(26,107,60,.12)}
body.dark .econ-decision{color:#bbf7d0;background:rgba(26,107,60,.12)}

/* ============ SVG HELPERS ============ */
.svg-icon{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:inline-block;vertical-align:middle}
.svg-sm{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:inline-block;vertical-align:middle;flex-shrink:0}

/* ============ DARK MODE ============ */
body.dark .card,body.dark .place-card,body.dark .subfield-card,body.dark .owner-stat-card,body.dark .modal,body.dark .scard,body.dark .skeleton-card,body.dark .econ-card,body.dark .econ-item{background:var(--surface)!important;color:var(--ink)!important;border-color:var(--line)!important}
body.dark .econ-item{background:var(--surface-soft)!important}
body.dark .subfield-card.active{background:rgba(34,136,62,.12)!important;border-color:#5fb27d!important}
body.dark .place-card{background:#101510!important;border-color:rgba(255,255,255,.05)!important}
body.dark .place-cover::after{background:linear-gradient(to bottom,transparent 0%,rgba(0,0,0,.12) 35%,rgba(4,10,6,.88) 100%)!important}
body.dark .place-cover{filter:saturate(.7) brightness(.8)}
body.dark .place-strip{background:#101510!important}
body.dark .place-book-btn{background:linear-gradient(140deg,#1d5b39,#0f3320)!important}
body.dark .finput,body.dark input,body.dark select,body.dark textarea{background:var(--input-bg)!important;color:var(--ink)!important;border-color:var(--line-2)!important}
body.dark input::placeholder,body.dark textarea::placeholder{color:var(--soft)!important;opacity:.7}
body.dark .cbtn,body.dark .ftab,body.dark .day-btn{background:var(--surface)!important;color:var(--ink)!important;border-color:var(--line-2)!important}
body.dark .ftab.active-tab,body.dark .day-btn.active,body.dark .tbtn.sel{color:#fff!important}
body.dark .day-btn.active{background:linear-gradient(140deg,#237040,#0f3320)!important;border-color:transparent!important}
body.dark .tbtn{background:rgba(34,136,62,.1)!important;color:#86efac!important;border-color:rgba(103,192,139,.14)!important}
body.dark .tbtn.sel{background:linear-gradient(140deg,#237040,#0f3320)!important;border-color:transparent!important}
body.dark .tbtn.taken{background:rgba(255,255,255,.03)!important;color:#5a6b5a!important;border-color:var(--line)!important}
body.dark .bnav{background:rgba(14,20,15,.9)!important;border-top-color:var(--line)!important}
body.dark .nitem{color:#5a6b5a!important}
body.dark .nitem.active{color:#e8ede8!important}
body.dark .nitem.active .nicon{background:rgba(255,255,255,.07)!important}
body.dark .badge-green,body.dark .badge-red,body.dark .badge-yellow{background:var(--surface)!important;border-color:var(--line-2)!important}
body.dark .badge-blue,body.dark .mini-badge{background:rgba(29,78,216,.14)!important;color:#93c5fd!important}
body.dark #dPrice,body.dark #mPrice{background:rgba(34,136,62,.14)!important;color:#86efac!important;border-color:rgba(103,192,139,.2)!important}
body.dark .toast{background:#131a13!important;color:var(--ink)!important;border:1px solid var(--line-2)!important}
body.dark #mapLink{background:rgba(29,78,216,.12)!important;border-color:rgba(29,78,216,.18)!important;color:#93c5fd!important}
body.dark #callPlaceBtn{background:rgba(34,136,62,.12)!important;border-color:rgba(103,192,139,.18)!important;color:#86efac!important}
body.dark .welcome-hero{background:linear-gradient(155deg,#060e08,#0b1e0f,#102a18,#164030)!important}
body.dark .welcome-cta-primary{background:#e8ede8!important;color:#071910!important}
body.dark .place-price-badge{background:rgba(14,20,15,.92);color:#86efac}
body.dark .amenity-chip{background:rgba(34,136,62,.12);color:#86efac;border-color:rgba(103,192,139,.14)}
body.dark .sbtn{background:linear-gradient(140deg,#237040,#0f3320)!important}
body.dark .search-bar{background:rgba(20,28,20,.97)!important}
body.dark .search-btn{background:linear-gradient(140deg,#237040,#0f3320)!important}
body.dark .owner-progress{background:var(--surface-muted)!important}
body.dark [style*="color:#111827"],body.dark [style*="color: #111827"]{color:var(--ink)!important}
body.dark [style*="color:#374151"],body.dark [style*="color: #374151"],body.dark [style*="color:#4b5563"],body.dark [style*="color: #4b5563"],body.dark [style*="color:#6b7280"],body.dark [style*="color: #6b7280"]{color:var(--text-muted)!important}
body.dark [style*="background:white"],body.dark [style*="background: white"],body.dark [style*="background:#fff"],body.dark [style*="background: #fff"]{background:var(--surface)!important}
body.dark [style*="background:#f9fafb"]{background:var(--surface-muted)!important}
body.dark [style*="background:#f0fdf4"]{background:var(--soft-green)!important}
body.dark [style*="background:#eff6ff"]{background:var(--soft-blue)!important}
body.dark [style*="background:#fee2e2"]{background:var(--soft-red)!important}
body.dark [style*="background:#fef3c7"]{background:var(--soft-yellow)!important}

/* ============ RESPONSIVE ============ /
@media(min-width:700px){
:root{--max:720px}
.place-card{display:grid;grid-template-columns:270px 1fr}
.place-cover{height:100%;min-height:188px}
.modal{border-radius:24px!important;max-width:560px;margin-bottom:30px}
}
@media(min-width:1024px){
:root{--max:1100px}
#placesList{display:grid!important;grid-template-columns:repeat(2,1fr);gap:20px!important}
.place-card{display:block}
.place-cover{height:205px}
#detailPage>div:nth-child(2){max-width:850px;margin:auto}
#detailTimeGrid,#timeGrid{grid-template-columns:repeat(4,1fr)!important}
.bnav{max-width:1100px}
}
@media(min-width:1400px){
:root{--max:1200px}
#placesList{grid-template-columns:repeat(3,1fr)}
.econ-grid{grid-template-columns:repeat(4,1fr)}
}
@media(prefers-reduced-motion:reduce){,::before,::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
@media(max-width:600px){.owner-action{padding:9px 11px;font-size:12px}}

/* Scrollbar hide */
#regionTabs::-webkit-scrollbar,#detailDaysGrid::-webkit-scrollbar,#daysGrid::-webkit-scrollbar,#manualDaysGrid::-webkit-scrollbar{display:none}
</style>
</head>
<body>
<div id="app">

<!-- ===== WELCOME PAGE ===== -->
<div id="welcomePage" class="page active">
<div style="padding-bottom:0">
<div class="welcome-hero">
<div class="welcome-ball-wrap">
<span class="welcome-ball">⚽</span>
</div>
<div class="welcome-title">ال<span>مستديرة</span></div>
<div class="welcome-sub">احجز ملعبك في ثوانٍ — بدون تعقيد</div>
<div class="welcome-actions">
<button class="welcome-cta welcome-cta-primary" onclick="startBrowsing()">🏟️ تصفح الملاعب</button>
<button class="welcome-cta welcome-cta-secondary" onclick="s
