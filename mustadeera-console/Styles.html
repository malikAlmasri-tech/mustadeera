<style>
/* ═══════════════════════════════════════════════════════════════════
   المستديرة — لوحة الإدارة
   ───────────────────────────────────────────────────────────────────
   § 1  التوكنات        § 5  الجداول
   § 2  الأساس والهيكل  § 6  الحاسبة ووضع العرض
   § 3  المكوّنات        § 7  الرسوم
   § 4  البطاقات        § 8  الطبقات العائمة
   ═══════════════════════════════════════════════════════════════════ */

/* ═══ § 1  التوكنات ═══════════════════════════════════════════════ */
/* النهاري على :root عاريًا، والداكن يُعاد تعريفه في نطاقين: استعلام
   نظام التشغيل، ووسمُ المستخدم — كي يغلب اختيارُه في الاتّجاهين. */

:root {
  color-scheme: light;

  --bg:        #F6F7F9;
  --bg-rgb:    246,247,249;   /* لغسل زجاجيّ على الشريط العلوي واللوحة السفلية — rgba() لا تقرأ متغيّرًا هيكسيًّا */
  --surf:      #FFFFFF;
  --surf-2:    #F2F3F6;
  --surf-3:    #E9EBF0;
  --line:      #E3E6EC;
  --line-2:    #CFD4DD;

  --ink:       #12151A;
  --ink-2:     #4E5665;
  --ink-3:     #5E6673;   /* مقيس: 5.79 على الأبيض · 4.85 على أغمق سطح */

  --accent:      #4A3AA7;
  --accent-2:    #372A80;
  --on-accent:   #FFFFFF;
  --accent-soft: rgba(74,58,167,.085);
  --accent-line: rgba(74,58,167,.26);

  --good:    #0A6E0A;    /* مقيس: 5.3 على صبغته — كان 4.22 */
  --warn:    #8A5A00;
  --serious: #A9491F;
  --bad:     #AE2926;    /* مقيس: 5.04 على صبغته فوق حبّة التنقّل النشِطة — كان 4.49 */
  --good-bg: rgba(10,127,10,.10);
  --warn-bg: rgba(138,90,0,.10);
  --bad-bg:  rgba(174,41,38,.10);

  /* سلاسل الرسوم — من لوحةٍ مُتحقَّقٍ منها لعمى الألوان. والبنفسجيّة
     لا تُستعمل سلسلةً أبدًا: هي لون الواجهة، ولونٌ واحد لا يحمل معنيين. */
  --s1: #2A78D6;  --s2: #EB6834;  --s3: #1BAF7A;  --s4: #EDA100;
  --grid:  #EAECF1;
  --track: #E9EBF0;

  --shadow-1: 0 1px 2px rgba(12,16,24,.05), 0 4px 14px rgba(12,16,24,.05);
  --shadow-2: 0 8px 34px rgba(12,16,24,.11), 0 2px 6px rgba(12,16,24,.06);
  --shadow-3: 0 24px 70px rgba(12,16,24,.20);

  --r-ctl:   10px;
  --r-surf:  14px;
  --r-sheet: 22px;
  --r-pill:  999px;

  --rail: 254px;
  --pad:  clamp(16px, 2.4vw, 30px);
  --tap:  44px;

  --lh-body: 1.7;
  --lh-head: 1.35;

  --ease: cubic-bezier(.22,.61,.36,1);
  --dur:  200ms;
}

@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --bg:     #0A0B0D;
    --bg-rgb: 10,11,13;
    --surf:   #111317;
    --surf-2: #171A20;
    --surf-3: #1F232B;
    --line:   #242932;
    --line-2: #313743;

    --ink:    #F2F4F7;
    --ink-2:  #A6ADB9;
    --ink-3:  #868E9C;

    --accent:      #9085E9;
    --accent-2:    #B3ABF1;
    --on-accent:   #0A0B0D;
    --accent-soft: rgba(144,133,233,.15);
    --accent-line: rgba(144,133,233,.34);

    --good:    #46C25E;
    --warn:    #FAB219;
    --serious: #EC835A;
    --bad:     #F07A7A;
    --good-bg: rgba(70,194,94,.13);
    --warn-bg: rgba(250,178,25,.13);
    --bad-bg:  rgba(240,122,122,.13);

    --s1: #3987E5;  --s2: #D95926;  --s3: #199E70;  --s4: #C98500;
    --grid:  #22262E;
    --track: #1F232B;

    --shadow-1: 0 1px 2px rgba(0,0,0,.40);
    --shadow-2: 0 10px 34px rgba(0,0,0,.50);
    --shadow-3: 0 28px 80px rgba(0,0,0,.62);
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --bg:     #0A0B0D;
  --bg-rgb: 10,11,13;
  --surf:   #111317;
  --surf-2: #171A20;
  --surf-3: #1F232B;
  --line:   #242932;
  --line-2: #313743;

  --ink:    #F2F4F7;
  --ink-2:  #A6ADB9;
  --ink-3:  #868E9C;

  --accent:      #9085E9;
  --accent-2:    #B3ABF1;
  --on-accent:   #0A0B0D;
  --accent-soft: rgba(144,133,233,.15);
  --accent-line: rgba(144,133,233,.34);

  --good:    #46C25E;
  --warn:    #FAB219;
  --serious: #EC835A;
  --bad:     #F07A7A;
  --good-bg: rgba(70,194,94,.13);
  --warn-bg: rgba(250,178,25,.13);
  --bad-bg:  rgba(240,122,122,.13);

  --s1: #3987E5;  --s2: #D95926;  --s3: #199E70;  --s4: #C98500;
  --grid:  #22262E;
  --track: #1F232B;

  --shadow-1: 0 1px 2px rgba(0,0,0,.40);
  --shadow-2: 0 10px 34px rgba(0,0,0,.50);
  --shadow-3: 0 28px 80px rgba(0,0,0,.62);
}


/* ═══ § 2  الأساس والهيكل ═════════════════════════════════════════ */

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: 'IBM Plex Sans Arabic', 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  font-size: 15px;
  line-height: var(--lh-body);
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, h4 { margin: 0; line-height: var(--lh-head); font-weight: 600; }
p  { margin: 0; }
ul { margin: 0; padding: 0; list-style: none; }

/* الأرقام اللاتينية تُعزَل عن اتجاه السطر العربي — وإلّا انقلب المدى
   «40–60» إلى «60–40» لأنّ الشرطة محايدة بين رقمين أوروبيّين. */
.num  { font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; display: inline-block; }
.numP { direction: ltr; unicode-bidi: isolate; display: inline-block; }

::selection { background: var(--accent-soft); }

:where(a, button, input, select, textarea, summary, [tabindex]):focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 6px;
}

.ic   { display: inline-grid; place-items: center; width: 18px; height: 18px; flex: none; }
.ic svg { width: 18px; height: 18px; }
.ic-l svg { width: 20px; height: 20px; }

[hidden] { display: none !important; }

/* ── الإقلاع ── */
.boot {
  position: fixed; inset: 0; z-index: 90;
  display: grid; place-content: center; justify-items: center;
  background: var(--bg); color: var(--accent);
}
.boot-spin { transform-origin: 24px 24px; animation: spin 1.05s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.boot-t { margin-top: 14px; font-size: 19px; font-weight: 700; color: var(--ink); }
.boot-s { font-size: 13.5px; color: var(--ink-3); max-width: 420px; text-align: center; }
.boot.is-err { color: var(--bad); }
.boot.is-err .boot-s { color: var(--bad); }

.shell { display: grid; grid-template-columns: var(--rail) minmax(0,1fr); min-height: 100vh; }

/* ── الرصيف ── */
.rail {
  position: sticky; top: 0; align-self: start;
  height: 100vh; display: flex; flex-direction: column;
  padding: 18px 12px;
  background: var(--surf);
  border-inline-start: 1px solid var(--line);
}
.rail-top { padding: 4px 8px 14px; }
.brand { display: flex; align-items: center; gap: 10px; color: var(--accent); }
.brand-txt { display: flex; flex-direction: column; line-height: 1.25; }
.brand-txt b { font-size: 16px; font-weight: 700; color: var(--ink); }
.brand-txt i { font-size: 11.5px; font-style: normal; color: var(--ink-3); }

.nav { display: flex; flex-direction: column; gap: 2px; flex: 1; overflow-y: auto; }
.nav-sec { padding: 15px 12px 5px; font-size: 11px; font-weight: 600; color: var(--ink-3); letter-spacing: .03em; }

.nav-btn {
  display: flex; align-items: center; gap: 11px;
  min-height: var(--tap); padding: 0 12px;
  border: 0; border-radius: var(--r-ctl);
  background: transparent; color: var(--ink-2);
  font: inherit; font-size: 14.5px; font-weight: 500;
  cursor: pointer; text-align: start; width: 100%;
  transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
}
.nav-btn:hover  { background: var(--surf-3); color: var(--ink); }
.nav-btn .ic    { color: var(--ink-3); }
.nav-btn:hover .ic { color: var(--ink-2); }
.nav-btn.on     { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav-btn.on .ic { color: var(--accent); }
.nav-btn .tail  {
  margin-inline-start: auto; min-width: 22px; height: 20px; padding: 0 6px;
  display: grid; place-items: center; border-radius: var(--r-pill);
  background: var(--surf-3); color: var(--ink-2);
  font-size: 11.5px; font-weight: 600;
}
.nav-btn.on .tail  { background: var(--accent); color: var(--on-accent); }
.nav-btn .tail.hot { background: var(--bad-bg); color: var(--bad); }

.rail-foot { display: flex; flex-direction: column; gap: 2px; padding-top: 10px; border-top: 1px solid var(--line); }
.rail-btn {
  display: flex; align-items: center; gap: 11px;
  min-height: 40px; padding: 0 12px;
  border: 0; border-radius: var(--r-ctl); background: transparent;
  color: var(--ink-3); font: inherit; font-size: 13.5px; cursor: pointer;
  text-decoration: none;
  transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
}
.rail-btn:hover { background: var(--surf-3); color: var(--ink); }

/* ── الشريط العلوي ── */
.main { min-width: 0; display: flex; flex-direction: column; }

.topbar {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; gap: 14px;
  padding: 13px var(--pad);
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}
/* زجاجٌ تدريجيّ: خلفيةٌ صلبة أوّلًا (حاسوبٌ بلا `backdrop-filter` يبقى
   مقروءًا تمامًا)، والغسل الشفّاف فقط حيث يدعمه المتصفّح فعلًا. */
@supports ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .topbar {
    background: rgba(var(--bg-rgb), .74);
    -webkit-backdrop-filter: blur(10px) saturate(1.15);
    backdrop-filter: blur(10px) saturate(1.15);
  }
}
.crumbs { min-width: 0; flex: 1; }
.crumbs h1 { font-size: 19px; font-weight: 700; letter-spacing: -.01em; }
.crumbs p  { font-size: 12.5px; color: var(--ink-3); line-height: 1.4; }

.cmd-open {
  display: flex; align-items: center; gap: 8px;
  min-height: 38px; padding: 0 12px;
  border: 1px solid var(--line); border-radius: var(--r-ctl);
  background: var(--surf); color: var(--ink-3);
  font: inherit; font-size: 13px; cursor: pointer; white-space: nowrap;
  transition: border-color var(--dur) var(--ease), color var(--dur) var(--ease);
}
.cmd-open:hover { border-color: var(--line-2); color: var(--ink-2); }
kbd {
  font-size: 10.5px; font-family: 'IBM Plex Sans', ui-monospace, monospace;
  padding: 1px 5px; border-radius: 5px;
  background: var(--surf-3); color: var(--ink-3); border: 1px solid var(--line);
}

.sync { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--ink-3); white-space: nowrap; }
.sync .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--good); flex: none; }
.sync.busy .dot { background: var(--warn); animation: pulse 1s ease-in-out infinite; }
.sync.err  .dot { background: var(--bad); }
@keyframes pulse { 50% { opacity: .28; } }

.view { padding: var(--pad); padding-bottom: 76px; max-width: 1500px; width: 100%; }
.stack { display: flex; flex-direction: column; gap: 22px; }

.sec-h    { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.sec-h h2 { font-size: 15.5px; font-weight: 600; }
.sec-h p  { font-size: 12.5px; color: var(--ink-3); }
.sp       { margin-inline-start: auto; }


/* ═══ § 3  المكوّنات ══════════════════════════════════════════════ */

.btn {
  position: relative;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: var(--tap); padding: 0 16px;
  border: 1px solid transparent; border-radius: var(--r-ctl);
  background: var(--accent); color: var(--on-accent);
  font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
  transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease), color var(--dur) var(--ease);
}
.btn:hover { background: var(--accent-2); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }

/* حالة التحميل: النصّ يختفي وحلقةٌ تدور مكانه — تغذيةٌ راجعة أثناء
   نداء الخادم لا مجرّد بهتان الزرّ. `spin` مُعرَّفة أصلًا للإقلاع فتُستعمَل هنا. */
.btn.loading, .icon-btn.loading { color: transparent !important; pointer-events: none; }
.btn.loading .ic, .icon-btn.loading .ic { visibility: hidden; }
.btn.loading::after, .icon-btn.loading::after {
  content: ''; position: absolute; inset: 0; margin: auto;
  width: 16px; height: 16px;
  border: 2px solid var(--on-accent); border-inline-end-color: transparent;
  border-radius: 50%;
  animation: spin .6s linear infinite;
}
.btn.ghost.loading::after, .btn.quiet.loading::after, .btn.danger.loading::after, .icon-btn.loading::after {
  border-color: var(--ink-2); border-inline-end-color: transparent;
}

.btn.ghost { background: var(--surf); color: var(--ink); border-color: var(--line-2); }
.btn.ghost:hover { background: var(--surf-3); }
.btn.quiet { background: transparent; color: var(--ink-2); border-color: transparent; }
.btn.quiet:hover { background: var(--surf-3); color: var(--ink); }
.btn.danger { background: transparent; color: var(--bad); border-color: var(--line-2); }
.btn.danger:hover { background: var(--bad-bg); }
.btn.sm { min-height: 34px; padding: 0 11px; font-size: 13px; }

.icon-btn {
  position: relative;
  display: inline-grid; place-items: center;
  width: var(--tap); height: var(--tap); flex: none;
  border: 0; border-radius: var(--r-ctl);
  background: transparent; color: var(--ink-2); cursor: pointer;
  transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
}
.icon-btn:hover { background: var(--surf-3); color: var(--ink); }

/* ── الحقول ── */
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field > label { font-size: 12.5px; font-weight: 500; color: var(--ink-2); }

/* 🔴 كانت `.field .hint` وحدها، والحاشية مستعملةٌ تحت المزالج وخارج الحقول —
   فكانت ترث 15px بلون الحبر فتنافس تسميتها. الصنف مستقلٌّ الآن. */
.hint { font-size: 11.5px; color: var(--ink-3); line-height: 1.55; display: block; }
.hint b { color: var(--ink-2); font-weight: 600; }

.input, select.input, textarea.input {
  width: 100%; min-height: 42px; padding: 8px 12px;
  border: 1px solid var(--line-2); border-radius: var(--r-ctl);
  background: var(--surf-2); color: var(--ink);
  font: inherit; font-size: 14.5px;
  transition: border-color var(--dur) var(--ease), background var(--dur) var(--ease);
}
.input:focus { border-color: var(--accent); background: var(--surf); }
textarea.input { min-height: 78px; resize: vertical; line-height: 1.6; }
select.input { cursor: pointer; }
.input.n { font-variant-numeric: tabular-nums; direction: ltr; text-align: start; }

.row2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; }

/* ── الشرائح ── */
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  min-height: 28px; padding: 0 10px;
  border-radius: var(--r-pill);
  background: var(--surf-3); color: var(--ink-2);
  font-size: 12.5px; font-weight: 500; white-space: nowrap;
}
.chip .dt { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }
.chip.good { background: var(--good-bg); color: var(--good); }
.chip.warn { background: var(--warn-bg); color: var(--warn); }
.chip.bad  { background: var(--bad-bg);  color: var(--bad); }
.chip.acc  { background: var(--accent-soft); color: var(--accent); }

button.chip { border: 0; font-family: inherit; cursor: pointer; transition: background var(--dur) var(--ease); }
button.chip:hover { background: var(--line-2); }
button.chip.on { background: var(--accent); color: var(--on-accent); }

/* شكلٌ ثانٍ مع اللون: الحالة لا تُحمَل على اللون وحده. */
.chip .shape { width: 8px; height: 8px; flex: none; }
.chip.good .shape { border-radius: 50%; background: currentColor; }
.chip.warn .shape { width: 0; height: 0; background: none; border-inline: 4px solid transparent; border-block-end: 8px solid currentColor; }
.chip.bad  .shape { background: currentColor; }

/* ── التنبيهات ── */
.note {
  display: flex; gap: 11px; padding: 13px 15px;
  border: 1px solid var(--line); border-inline-start: 3px solid var(--ink-3);
  border-radius: var(--r-ctl); background: var(--surf);
  font-size: 13.5px; color: var(--ink-2); line-height: 1.65;
}
.note b { color: var(--ink); font-weight: 600; }
.note .ic { color: var(--ink-3); margin-top: 3px; }
.note.warn { border-inline-start-color: var(--warn); background: var(--warn-bg); border-color: transparent; }
.note.warn .ic { color: var(--warn); }
.note.bad  { border-inline-start-color: var(--bad); background: var(--bad-bg); border-color: transparent; }
.note.bad .ic { color: var(--bad); }
.note.acc  { border-inline-start-color: var(--accent); background: var(--accent-soft); border-color: transparent; }
.note.acc .ic { color: var(--accent); }


/* ═══ § 4  البطاقات ══════════════════════════════════════════════ */

.card {
  background: var(--surf);
  border: 1px solid var(--line);
  border-radius: var(--r-surf);
  padding: 18px;
}
.card.pad-0 { padding: 0; overflow: hidden; }
.card-h { display: flex; align-items: baseline; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.card-h h3 { font-size: 14.5px; font-weight: 600; }
.card-h p  { font-size: 12px; color: var(--ink-3); }

.grid { display: grid; gap: 14px; }
.g-4 { grid-template-columns: repeat(auto-fit, minmax(215px, 1fr)); }
.g-3 { grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); }
.g-2 { grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); }

/* ── بلاطة المقياس: تسمية · قيمة · مقامها · اتجاه ── */
.kpi { display: flex; flex-direction: column; gap: 2px; }
.kpi .k-l { font-size: 12.5px; color: var(--ink-2); font-weight: 500; }
.kpi .k-v {
  font-size: 30px; font-weight: 600; letter-spacing: -.02em; line-height: 1.15;
  margin-top: 4px; direction: ltr; unicode-bidi: isolate; align-self: flex-start;
}
.kpi .k-v .u { font-size: 15px; font-weight: 500; color: var(--ink-3); margin-inline-start: 3px; }
.kpi .k-d { font-size: 12px; color: var(--ink-3); line-height: 1.5; }
.kpi .k-t { margin-top: 8px; }

/* الرقم البطل — واحدٌ لا غير في كل شاشة */
/* 🔴 flex عمدًا: `align-self` على الرقم لا معنى له في تدفّقٍ عاديّ، فكان
   الرقم — وهو `direction:ltr` — يبدأ من يسار الصندوق بينما تسميتُه يمينه. */
.hero {
  background: var(--surf); border: 1px solid var(--line); border-radius: var(--r-surf);
  padding: 22px; position: relative; overflow: hidden;
  grid-column: span 2;
  display: flex; flex-direction: column; align-items: flex-start;
}
.hero .h-l { font-size: 13px; color: var(--ink-2); font-weight: 500; }
.hero .h-v {
  font-size: clamp(40px, 5.2vw, 60px); font-weight: 600; letter-spacing: -.03em;
  line-height: 1.05; margin: 8px 0 2px; direction: ltr; unicode-bidi: isolate;
  align-self: flex-start; color: var(--ink);
}
.hero .h-v .u { font-size: .38em; font-weight: 500; color: var(--ink-3); margin-inline-start: 6px; letter-spacing: 0; }
.hero .h-d { font-size: 13px; color: var(--ink-3); }
.hero .h-spark { margin-top: 14px; }
@media (max-width: 700px) { .hero { grid-column: span 1; } }

.delta { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; font-weight: 600; }
.delta.up   { color: var(--good); }
.delta.down { color: var(--bad); }


/* ═══ § 5  الجداول ═══════════════════════════════════════════════ */

/* 🔴 `overflow-x:auto` يجعل `overflow-y` تُحسَب `auto` كذلك ⇒ يصير **الصندوق**
   مرسى الالتصاق لا الصفحة، وارتفاعُه من محتواه فلا يتمرّر رأسيًّا أبدًا ⇒
   `thead th{position:sticky}` لا تُفعَّل قطّ. سقفُ ارتفاعٍ يُحييها، والجداول
   الأقصر منه لا تتأثّر بحرف. */
.tbl-wrap { overflow-x: auto; }
.card.pad-0 .tbl-wrap { max-block-size: min(68vh, 620px); overflow-y: auto; }
table.tbl { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13.5px; }
table.tbl th {
  position: sticky; top: 0; z-index: 2;
  padding: 10px 12px; text-align: start; white-space: nowrap;
  font-size: 12px; font-weight: 600; color: var(--ink-3);
  background: var(--surf-2);
  box-shadow: inset 0 -1px 0 var(--line);
}
table.tbl td {
  padding: 11px 12px; border-block-end: 1px solid var(--line);
  color: var(--ink-2); vertical-align: middle;
}
table.tbl td.nm { color: var(--ink); font-weight: 600; }
table.tbl tbody tr { transition: background var(--dur) var(--ease); }
table.tbl tbody tr:hover { background: var(--surf-2); }
table.tbl tbody tr.clickable { cursor: pointer; }
table.tbl td.n { font-variant-numeric: tabular-nums; direction: ltr; }
table.tbl tfoot td { font-weight: 600; color: var(--ink); background: var(--surf-2); border-block-end: 0; }

/* حرارة عمود «منذ» — سلّم من هيوٍ واحد، والرقم نفسه هو الحامل الأوّل */
.heat { display: inline-flex; align-items: center; gap: 7px; }
.heat .bar { width: 34px; height: 5px; border-radius: 3px; background: var(--track); overflow: hidden; }
/* الغياب لا يُرسَم أقصى القيمة: شريطٌ ممتلئ لِما لا نعرفه يُقرأ قياسًا. */
.heat.h0 .bar { display: none; }
.heat .bar i { display: block; height: 100%; background: var(--s1); border-radius: 3px; }
.heat.h3 .bar i { background: var(--bad); }
.heat.h2 .bar i { background: var(--warn); }

/* العمود الأوّل يثبت أفقيًّا على الجوّال — الجدول يمرَّر أفقيًّا وصفوفه
   بلا هويّة لولاه. `border-inline-end` منطقيّ: حافّة الانفصال تقع دومًا
   في الجهة التي يُكشَف منها المحتوى الممرَّر، يمينًا في RTL ويسارًا في LTR. */
@media (max-width: 700px) {
  .card.pad-0 .tbl-wrap td:first-child {
    position: sticky; inset-inline-start: 0; z-index: 1;
    background: var(--surf);
    border-inline-end: 1px solid var(--line);
  }
  .card.pad-0 .tbl-wrap th:first-child {
    position: sticky; inset-inline-start: 0; z-index: 3;
    border-inline-end: 1px solid var(--line);
  }
  .card.pad-0 .tbl-wrap tbody tr:hover td:first-child { background: var(--surf-2); }
}

.empty { padding: 46px 20px; text-align: center; color: var(--ink-3); }
.empty h4 { font-size: 15px; color: var(--ink-2); margin-bottom: 4px; }
.empty p  { font-size: 13px; }

/* ── قائمة الاتصال ── */
.call { display: flex; flex-direction: column; }
.call-row {
  display: flex; align-items: center; gap: 12px;
  padding: 13px 0; border-block-end: 1px solid var(--line);
}
.call-row:last-child { border-block-end: 0; }
.call-rank {
  width: 30px; height: 30px; flex: none; display: grid; place-items: center;
  border-radius: var(--r-ctl); background: var(--surf-3);
  font-size: 12.5px; font-weight: 600; color: var(--ink-3);
  font-variant-numeric: tabular-nums;
}
.call-row.hot .call-rank { background: var(--bad-bg); color: var(--bad); }
.call-b { min-width: 0; flex: 1; }
.call-b b { display: block; font-size: 14.5px; font-weight: 600; color: var(--ink); }
.call-b span { font-size: 12.5px; color: var(--ink-3); }
.call-a { display: flex; gap: 6px; flex: none; }


/* ═══ § 6  الحاسبة ووضع العرض ════════════════════════════════════ */

.calc-grid { display: grid; grid-template-columns: minmax(300px, 350px) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 1000px) { .calc-grid { grid-template-columns: 1fr; } }

/* ── حقل الرقم: ثلاثة مداخل لرقمٍ واحد ────────────────────────────
   الكتابة للدقّة · الخطوة ± للضبط الأخير · السحب للاستكشاف (حيث يُطلَب).
   والحقل نصٌّ لا `type=number`: الأخير يجرّ أسهمًا مجهرية لا تُلمَس على
   الجوّال، ويردّ '' على المدخَل الجزئي فيقفز الرقم صفرًا وأنت تكتب.
   ─────────────────────────────────────────────────────────────── */
.nf { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.nf-top { display: flex; align-items: baseline; gap: 8px; }
.nf-top label { font-size: 13px; color: var(--ink-2); font-weight: 500; }
.nf-row { display: flex; align-items: center; gap: 8px; }
.nf-step {
  width: var(--tap); height: var(--tap); flex: none;
  border: 1px solid var(--line-2); border-radius: var(--r-ctl);
  background: var(--surf-2); color: var(--ink);
  display: grid; place-items: center; cursor: pointer;
  transition: background var(--dur) var(--ease), transform 120ms var(--ease);
}
.nf-step:hover  { background: var(--surf-3); }
.nf-step:active { transform: scale(.93); }
.nf-val {
  flex: 1; min-width: 0;
  min-height: var(--tap); padding: 6px 8px;
  border: 1px solid var(--line-2); border-radius: var(--r-ctl);
  background: var(--surf-2); color: var(--ink);
  font: inherit; font-size: 17px; font-weight: 600; text-align: center;
  font-variant-numeric: tabular-nums; direction: ltr;
  transition: border-color var(--dur) var(--ease), background var(--dur) var(--ease);
}
.nf-val:focus { border-color: var(--accent); background: var(--surf); }
.nf-suffix { font-size: 13px; color: var(--ink-3); flex: none; }
.nf input[type="range"] { margin-top: 2px; }

/* النسخة الكبيرة — رقمُ المتابعة في وضع العرض */
.nf.is-big .nf-val  { font-size: 30px; min-height: 56px; letter-spacing: -.02em; }
.nf.is-big .nf-step { width: 56px; height: 56px; }
.nf.is-big .nf-top label { font-size: 13.5px; }

/* شبكةٌ للحقول — تنطوي إلى عمودٍ واحد على الجوّال بلا استعلامٍ إضافي */
.nf-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(178px, 1fr)); gap: 14px; }

input[type="range"] {
  -webkit-appearance: none; appearance: none;
  width: 100%; height: 26px; background: transparent; cursor: pointer; margin: 0;
  direction: ltr;
}
input[type="range"]::-webkit-slider-runnable-track { height: 5px; border-radius: 3px; background: var(--track); }
input[type="range"]::-moz-range-track            { height: 5px; border-radius: 3px; background: var(--track); }
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 19px; height: 19px; margin-top: -7px; border-radius: 50%;
  background: var(--accent); border: 3px solid var(--surf);
  box-shadow: 0 1px 4px rgba(0,0,0,.3);
  transition: transform 120ms var(--ease);
}
input[type="range"]::-moz-range-thumb {
  width: 19px; height: 19px; border-radius: 50%;
  background: var(--accent); border: 3px solid var(--surf);
  box-shadow: 0 1px 4px rgba(0,0,0,.3);
}
input[type="range"]:active::-webkit-slider-thumb { transform: scale(1.14); }

/* ── وضع العرض: ما تفتحه أمام صاحب الملعب ── */
.stage {
  position: fixed; inset: 0; z-index: 70;
  background: var(--bg);
  display: flex; flex-direction: column;
  overflow-y: auto;
}
/* ارتفاع اللوحة مقيسٌ **١٩٠px** بعد أن صار حقلُها مكوّنَ الرقم القياسيّ
   وشرائحُها سطرًا واحدًا (كان ٢٥٠ فاختفى آخرُ سطرٍ خلفها فعلًا). و٣٠٠
   تترك فسحةً لالتفاف الشرائح سطرين على أضيق شاشة. */
.stage-in { margin: auto; width: 100%; max-width: 1080px; padding: clamp(20px, 4vw, 52px); padding-block-end: 300px; }
.stage-x     { position: fixed; inset-block-start: 16px; inset-inline-end: 16px; z-index: 8; }
.stage-share { position: fixed; inset-block-start: 16px; inset-inline-end: 68px; z-index: 8; color: var(--good); }

.stage-eyebrow { font-size: 13.5px; color: var(--ink-3); margin-bottom: 6px; }
.stage-title  { font-size: clamp(22px, 3.4vw, 32px); font-weight: 700; letter-spacing: -.02em; margin-bottom: 26px; }

.stage-hero .h-v { font-size: clamp(56px, 10vw, 108px); }
.stage-hero { border: 0; background: transparent; padding: 0; }

.stage-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; margin-top: 26px; }
.stage-tile {
  position: relative;
  background: var(--surf); border: 1px solid var(--line); border-radius: var(--r-surf); padding: 16px 18px;
  transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease);
}
/* لحظة السقف: بطاقة العمولة تنقلب إلى «رابحة» بصريًّا — نفس رقمَي
   `pay` و`capTotal` المحسوبين أصلًا، لا حالةٌ مخترَعة. */
.stage-tile.cap-hit { background: var(--good-bg); border-color: var(--good); }
.stage-tile.cap-hit .k-v, .stage-tile.cap-hit .k-l { color: var(--good); }
.cap-lock { position: absolute; inset-block-start: 14px; inset-inline-end: 14px; color: var(--good); }

.verdict {
  display: flex; align-items: flex-start; gap: 12px;
  margin-top: 26px; padding: 16px 18px;
  border-radius: var(--r-surf); font-size: 15px; font-weight: 500; line-height: 1.6;
}
.verdict.ok  { background: var(--good-bg); color: var(--good); }
.verdict.no  { background: var(--bad-bg);  color: var(--bad); }
.verdict b { font-weight: 700; }

/* ── الأرقام التي يتحكّم فيها: ظاهرةٌ كلُّها، بلا طيّة ──────────────
   كانت مطويّةً خلف `<details>` فبدت غائبة؛ والمطلوب أن يُعدَّل أيُّ رقمٍ
   أمام العميل بلا بحثٍ عنه. رقمُ المتابعة وحده ينزل إلى اللوحة السفلية. */
.stage-inputs { margin-top: 26px; padding-top: 20px; border-top: 1px solid var(--line); }
.stage-inputs > h3 { font-size: 13.5px; font-weight: 600; color: var(--ink-2); margin-bottom: 14px; }

/* ── لوحة التحكّم السفلية: منطقة الإبهام ── */
/* عائمةٌ فوق كلّ شيء بثبات — لا داخل تمرير `.stage-in`، فتبقى في متناول
   الإبهام مهما نزل العميل بنظره في الرسم فوقها. */
.stage-dock {
  position: fixed; inset-inline: 0; inset-block-end: 0; z-index: 6;
  background: var(--bg);
  border-block-start: 1px solid var(--line);
  box-shadow: var(--shadow-2);
}
@supports ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .stage-dock {
    background: rgba(var(--bg-rgb), .82);
    -webkit-backdrop-filter: blur(14px) saturate(1.15);
    backdrop-filter: blur(14px) saturate(1.15);
  }
}
.stage-dock-in {
  max-width: 1080px; margin-inline: auto;
  padding: 12px clamp(20px, 4vw, 52px) calc(12px + env(safe-area-inset-bottom));
  display: flex; flex-direction: column; gap: 10px;
}
/* الشرائح سطرٌ واحد: تسمياتها أرقامٌ قصيرة عمدًا كي لا تلتفّ فتأكل
   خمسين بكسلًا من ارتفاع اللوحة. */
.dock-chips { display: flex; gap: 8px; flex-wrap: wrap; }
.dock-chips .chip { font-variant-numeric: tabular-nums; }


/* ═══ § 7  الرسوم ════════════════════════════════════════════════ */

.chart { width: 100%; display: block; overflow: visible; }
.chart .ax   { stroke: var(--grid); stroke-width: 1; }
.chart .axt  { fill: var(--ink-3); font-size: 10.5px; font-variant-numeric: tabular-nums; }
.chart .ln   { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .dot  { stroke: var(--surf); stroke-width: 2; }
.chart .bar  { rx: 4; }
.chart .lbl  { fill: var(--ink-2); font-size: 11px; font-weight: 600; }

.legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 10px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-2); }
.legend i { width: 10px; height: 10px; border-radius: 3px; flex: none; }

.chart-tip {
  position: absolute; z-index: 5; pointer-events: none;
  padding: 8px 11px; border-radius: var(--r-ctl);
  background: var(--surf); border: 1px solid var(--line-2);
  box-shadow: var(--shadow-2); font-size: 12.5px; color: var(--ink);
  white-space: nowrap; opacity: 0; transition: opacity 120ms var(--ease);
}
.chart-tip.on { opacity: 1; }
.chart-tip .t-l { color: var(--ink-3); font-size: 11.5px; }
.chart-host { position: relative; }

.hbar { display: flex; flex-direction: column; gap: 11px; }
.hbar-row { display: grid; grid-template-columns: minmax(84px, 128px) 1fr auto; gap: 11px; align-items: center; font-size: 13px; }
.hbar-row .t { color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hbar-row .tr { height: 8px; border-radius: 4px; background: var(--track); overflow: hidden; }
.hbar-row .tr i { display: block; height: 100%; border-radius: 4px; background: var(--s1); transition: width 420ms var(--ease); }
.hbar-row .v { font-variant-numeric: tabular-nums; color: var(--ink); font-weight: 600; direction: ltr; }


/* ═══ § 8  الطبقات العائمة ═══════════════════════════════════════ */

.pal-wrap { position: fixed; inset: 0; z-index: 80; display: grid; place-items: start center; padding-top: 12vh; }
.pal-scrim { position: absolute; inset: 0; background: rgba(6,8,12,.55); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.pal {
  position: relative; width: min(620px, calc(100vw - 32px));
  background: var(--surf); border: 1px solid var(--line-2);
  border-radius: var(--r-sheet); box-shadow: var(--shadow-3);
  overflow: hidden;
  animation: palIn 180ms var(--ease);
}
@keyframes palIn { from { opacity: 0; transform: translateY(-8px) scale(.985); } }
.pal-in { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-block-end: 1px solid var(--line); color: var(--ink-3); }
.pal-in input { flex: 1; border: 0; background: transparent; color: var(--ink); font: inherit; font-size: 15.5px; outline: none; }
.pal-list { max-height: min(420px, 52vh); overflow-y: auto; padding: 6px; }
.pal-row {
  display: flex; align-items: center; gap: 11px;
  padding: 9px 11px; border-radius: var(--r-ctl); cursor: pointer;
  color: var(--ink-2); font-size: 14px;
}
.pal-row .ic { color: var(--ink-3); }
.pal-row b { color: var(--ink); font-weight: 500; }
.pal-row .sub { margin-inline-start: auto; font-size: 12px; color: var(--ink-3); }
.pal-row.on { background: var(--accent-soft); color: var(--accent); }
.pal-row.on b, .pal-row.on .ic { color: var(--accent); }
.pal-empty { padding: 26px; text-align: center; color: var(--ink-3); font-size: 13.5px; }

/* ── الورقة المنزلقة ── */
.sheet-wrap { position: fixed; inset: 0; z-index: 60; }
.sheet-scrim {
  position: absolute; inset: 0; background: rgba(6,8,12,.5); animation: fade 180ms var(--ease);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
}
@keyframes fade { from { opacity: 0; } }
/* على الطرف المقابل للرصيف: ورقةٌ تنزلق **فوق** التنقّل تُخفي أين أنت،
   وهذه تفتح كلوحِ تفصيلٍ بجانبه فيبقى السياق مرئيًّا. */
.sheet {
  position: absolute; inset-block: 0; inset-inline-end: 0;
  width: min(520px, 100vw);
  display: flex; flex-direction: column;
  background: var(--surf); border-inline-start: 1px solid var(--line);
  box-shadow: var(--shadow-3);
  animation: sheetIn 260ms var(--ease);
}
/* `transform` فيزيائيّ ⇒ الإزاحة تُضرَب في اتّجاه السطر لا تُكتب مرّتين. */
@keyframes sheetIn { from { transform: translateX(calc(var(--dirx) * -100%)); } }
.sheet { --dirx: 1; }
:root:dir(rtl) .sheet { --dirx: -1; }
.sheet-head { display: flex; align-items: center; gap: 10px; padding: 16px 18px; border-block-end: 1px solid var(--line); }
.sheet-head h2 { font-size: 16px; font-weight: 600; flex: 1; }
.sheet-body { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 15px; }
.sheet-foot { display: flex; gap: 10px; padding: 14px 18px; border-block-start: 1px solid var(--line); background: var(--surf-2); }
.sheet-foot .btn { flex: 1; }
.sheet-foot .btn.danger { flex: none; }

/* ── ملخّص العميل: نصٌّ يُنسَخ ويُرسَل يدويًّا ──────────────────── */
.msg-wrap { position: fixed; inset: 0; z-index: 85; display: grid; place-items: center; padding: 20px; }
.msg-scrim {
  position: absolute; inset: 0; background: rgba(6,8,12,.55);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
}
.msg {
  position: relative; width: min(480px, 100%);
  background: var(--surf); border: 1px solid var(--line-2);
  border-radius: var(--r-sheet); box-shadow: var(--shadow-3);
  display: flex; flex-direction: column; overflow: hidden;
  animation: palIn 180ms var(--ease);
}
.msg-head { display: flex; align-items: center; gap: 10px; padding: 16px 18px; border-block-end: 1px solid var(--line); }
.msg-head h2 { font-size: 16px; font-weight: 600; flex: 1; }
.msg-note { padding: 12px 18px 0; font-size: 12.5px; color: var(--ink-3); line-height: 1.6; }
.msg-text {
  margin: 12px 18px 0; padding: 14px; min-height: 200px;
  border: 1px solid var(--line-2); border-radius: var(--r-ctl);
  background: var(--surf-2); color: var(--ink);
  font: inherit; font-size: 14px; line-height: 1.75; resize: vertical;
}
.msg-text:focus { border-color: var(--accent); background: var(--surf); }
.msg-foot { display: flex; gap: 10px; padding: 16px 18px; }
.msg-foot .btn { flex: 1; }

/* ── التوستات ── */
.toasts { position: fixed; inset-block-end: 20px; inset-inline-start: 20px; z-index: 95; display: flex; flex-direction: column; gap: 8px; }
.toast {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 16px; border-radius: var(--r-ctl);
  background: var(--surf); border: 1px solid var(--line-2);
  box-shadow: var(--shadow-2); font-size: 13.5px; color: var(--ink);
  animation: toastIn 220ms var(--ease);
  max-width: min(420px, calc(100vw - 40px));
}
@keyframes toastIn { from { opacity: 0; transform: translateY(10px); } }
.toast.ok  .ic { color: var(--good); }
.toast.bad .ic { color: var(--bad); }
.toast.out { opacity: 0; transform: translateY(6px); transition: opacity 200ms, transform 200ms; }



/* ═══ الدفتر الشامل — اقتصاديات المنصة ════════════════════════════
   شبكةٌ **واحدة** و`display:contents` على الصفّ، لا شبكةً لكلّ صفّ:
   الثانية تعطي كلَّ صفٍّ عرضَ عمودٍ يخصّه فتخرج الأرقام غيرَ محاذاة،
   وشريطٌ ممتلئ في مسارٍ أقصر يبدو أقلَّ من شريطٍ أقلّ في مسارٍ أطول.
   ═══════════════════════════════════════════════════════════════════ */

.ldg-boxes {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(196px, 1fr));
  gap: 12px; margin-bottom: 20px;
}
.ldg-box {
