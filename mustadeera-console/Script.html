<script>
/* ═══════════════════════════════════════════════════════════════════
   المستديرة — التطبيق
   ───────────────────────────────────────────────────────────────────
   وحدةٌ واحدة مغلّفة: صفر متغيّرٍ عامّ في window عدا ما تحتاجه الواجهة.
   ═══════════════════════════════════════════════════════════════════ */
(function () {
'use strict';

var $  = function (s, r) { return (r || document).querySelector(s); };
var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };

var S = {
  boot: null, page: 'home', ready: false,
  calc: null, econ: null,          // مدخلاتٌ محلّية حتى يُطلَب الحفظ صراحةً
  calcDirty: false, econDirty: false,
  wrote: false,
  vFilter: { q: '', status: '', region: '' },
  palIdx: 0, palRows: [], sheetCtx: null, stageOn: false,
  /* بأيّ وحدةٍ يُعرَض حقل «متى تنضمّ» لكلّ رياضة — عرضٌ محض، لا يُحفَظ
     في الشيت ولا يُبنى منه `start` إلّا لحظة الكتابة. */
  econUnits: []
};

var stagePrevTheme = null;   // المظهر قبل فتح وضع العرض — يُستعاد عند إغلاقه

/**
 * عدّادٌ متصاعد على عنصرٍ حقيقي — بدل قفزةٍ فورية من رقمٍ لرقم.
 * يقرأ الرقم الحاليّ من نصّ العنصر نفسه فلا يحتاج حالةً محفوظة، ويحترم
 * «تقليل الحركة» — القاعدة العامّة في CSS لا تمسّ هذه الحلقة لأنها ليست
 * transition/animation بل كتابة نصٍّ يدويّة بـrequestAnimationFrame.
 */
var REDUCE_MOTION = matchMedia('(prefers-reduced-motion: reduce)');
function animateNumber(el, toVal, opts) {
  opts = opts || {};
  var fmt = opts.fmt || n0, dur = opts.dur || 320;
  if (REDUCE_MOTION.matches || !isNum(toVal)) { el.textContent = fmt(toVal); return; }

  var fromVal = Number(String(el.textContent || '0').replace(/[^0-9.\-]/g, '')) || 0;
  if (Math.abs(toVal - fromVal) < 0.5) { el.textContent = fmt(toVal); return; }

  if (el._animRaf) cancelAnimationFrame(el._animRaf);
  var t0 = performance.now();
  (function tick(now) {
    var p = Math.min(1, (now - t0) / dur);
    var eased = 1 - Math.pow(1 - p, 3);          // خروجٌ مكعّب — يبطئ قرب الوصول
    el.textContent = fmt(fromVal + (toVal - fromVal) * eased);
    el._animRaf = p < 1 ? requestAnimationFrame(tick) : null;
  })(t0);
}

var PAGES = [
  { g: 'العمل',   items: [
    { id: 'home',   t: 'لوحة اليوم',        ic: 'home',    sub: 'ما يستحقّ فعلًا اليوم' },
    { id: 'venues', t: 'الملاعب',            ic: 'pin',     sub: 'قائمتك، وأين وصلتَ مع كلٍّ منها' },
    { id: 'tasks',  t: 'المهام',             ic: 'square',  sub: 'ما عليك أنت' },
    { id: 'logs',   t: 'سجل التواصل',        ic: 'chat',    sub: 'ماذا قلتَ ومتى ولمن' }
  ]},
  { g: 'الأرقام', items: [
    { id: 'calc',   t: 'حاسبة الملعب',       ic: 'calc',    sub: 'ما يربحه هو — هذه ما تفتحها أمامه' },
    { id: 'econ',   t: 'اقتصاديات المنصة',   ic: 'chart',   sub: 'ما تربحه أنت' }
  ]},
  { g: 'المرجع',  items: [
    { id: 'terms',  t: 'نموذج العمل',        ic: 'sliders', sub: 'النسب والسقف والقواعد — مصدر الحقيقة' },
    { id: 'ideas',  t: 'الأفكار',            ic: 'bulb',    sub: 'صندوق الوارد' }
  ]}
];

/* ═══ الجسر إلى الخادم ═══════════════════════════════════════════ */
var READ_ONLY = { getBootstrap: 1, refresh: 1 };
function call(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  if (!READ_ONLY[fn]) S.wrote = true;
  setSync('busy');
  return new Promise(function (res, rej) {
    google.script.run
      .withSuccessHandler(function (r) { setSync('ok'); res(r); })
      .withFailureHandler(function (e) { setSync('err'); rej(e); })
      [fn].apply(null, args);
  });
}

/* «محفوظ» تُقال بعد كتابةٍ وقعت فعلًا لا عند أوّل قراءة —
   وإلّا ادّعى الشريط حفظًا لم يحدث. */
function setSync(state) {
  var el = $('#sync'); if (!el) return;
  el.className = 'sync' + (state === 'busy' ? ' busy' : state === 'err' ? ' err' : '');
  $('#syncTxt').textContent = state === 'busy' ? 'نكتب…'
                            : state === 'err'  ? 'ما وصل'
                            : S.wrote ? 'محفوظ في الشيت' : 'متّصل بالشيت';
}

/* ═══ التوستات ═══════════════════════════════════════════════════ */
function toast(msg, kind) {
  var el = document.createElement('div');
  el.className = 'toast ' + (kind || 'ok');
  el.innerHTML = icon(kind === 'bad' ? 'alert' : 'check') + '<span>' + esc(msg) + '</span>';
  $('#toasts').appendChild(el);
  setTimeout(function () {
    el.classList.add('out');
    setTimeout(function () { el.remove(); }, 220);
  }, kind === 'bad' ? 5200 : 3000);
}

/* ═══ مساعدات على البيانات ═══════════════════════════════════════ */
var C = {};                                   // الثوابت
function T() { return terms(C); }

function venues()  { return (S.boot.venues.rows  || []).filter(function (r) { return r['اسم الملعب']; }); }
function tasksAll(){ return (S.boot.tasks.rows   || []).filter(function (r) { return r['المهمّة']; }); }
function ideasAll(){ return (S.boot.ideas.rows   || []).filter(function (r) { return r['الفكرة']; }); }
function logsAll() { return (S.boot.logs.rows    || []).filter(function (r) { return r['الملعب'] || r['خلاصة ما دار']; }); }

var ON_PLATFORM = 'على المنصّة';

/** كم يومًا مضى على تاريخٍ نصّيّ (YYYY-MM-DD) — أو `null` إن لم يكن تاريخًا. */
function daysAgo(d) {
  if (!d) return null;
  var t = Date.parse(String(d) + 'T00:00:00');
  if (isNaN(t)) return null;
  return Math.max(0, Math.round((Date.now() - t) / 86400000));
}
function daysSince(row) { return daysAgo(row['آخر تواصل']); }

function phoneDigits(p) { return String(p || '').replace(/\D/g, ''); }
function intlPhone(p) {
  var d = phoneDigits(p);
  if (!d) return '';
  if (d.indexOf('962') === 0) return d;
  if (d.charAt(0) === '0') return '962' + d.slice(1);
  return '962' + d;
}
function telHref(p) { var d = intlPhone(p); return d ? 'tel:+' + d : ''; }
function waHref(p)  { var d = intlPhone(p); return d ? 'https://wa.me/' + d : ''; }

function vocab(table, col) {
  var v = (S.boot.vocab && S.boot.vocab[table] && S.boot.vocab[table][col]) || [];
  return v.slice();
}

/** ملاعب فرعية على المنصّة — مقيسة من الصفوف لا مكتوبة بيد. */
function liveSubfields() {
  var n = 0, missing = 0;
  venues().forEach(function (r) {
    if (String(r['الحالة'] || '').trim() !== ON_PLATFORM) return;
    var s = Number(r['عدد الملاعب الفرعية']);
    if (s > 0) n += s; else missing++;
  });
  return { total: n, missing: missing };
}

/* ═══ الإقلاع ════════════════════════════════════════════════════ */
function boot() {
  call('getBootstrap').then(function (b) {
    S.boot = b; C = b.constants || {};

    S.calc = Object.assign({ current: 30, subfields: 1, price: 40, varCost: 5, through: 1, newB: 8 }, b.calcInputs || {});
    S.econ = JSON.parse(JSON.stringify(b.econInputs || {}));
    if (!S.econ.sports || !S.econ.sports.length) {
      S.econ = { sports: [{ name: 'كرة قدم', places: 30, perPlace: 1, weekly: 15, price: 40 }],
                 msgCost: .01, msgPer: 1, infra: 33, fixed: 0, churn: 0, newPlace: 3 };
    }
    /* شهرُ الانضمام قد يغيب (شيتٌ لم يُنشَأ فيه صفُّ الخطّة بعد) ⇒ يُطبَّع
       إلى ١ = «على المنصّة اليوم». والغيابُ هنا حالةٌ عادية لا عطل. */
    S.econ.sports.forEach(function (x) { x.start = Math.max(1, Math.round(Number(x.start) || 1)); });
    /* انحرافُ السيناريوهات: يأتي من الشيت إن كُتب، وإلّا فالأرقام المبدئية.
       و`|| SCEN_DEFAULTS.x` وحدها لا تكفي — صفرٌ محفوظٌ عمدًا قيمةٌ صالحة
       («لا انحراف»)، فيُفحَص الوجودُ لا الصدق. */
    var dflt = function (v, d) { return isNum(Number(v)) && v !== '' && v !== null ? Number(v) : d; };
    S.econ.devWeekly   = dflt(S.econ.devWeekly,   SCEN_DEFAULTS.weekly);
    S.econ.devChurn    = dflt(S.econ.devChurn,    SCEN_DEFAULTS.churn);
    S.econ.devNewPlace = dflt(S.econ.devNewPlace, SCEN_DEFAULTS.newPlace);

    /* ── ③④ الطلبُ والتحصيل: افتراضاتٌ **محايدة** لا مخترَعة ──────────
       شيتٌ لم يُكتب فيه صفُّهما بعد يقرأ «تبنٍّ كامل · بلا تسريب · تحصيلٌ
       فوريّ» — أي **سلوكَ النموذج قبل هذه الدفعة بالحرف**، فلا يتحرّك
       رقمٌ تحت المالك بلا أن يطلبه. والقيمةُ الصحيحة تُقاس من ملاعبه.
       و`dflt` لا `||` لأنّ صفرًا محفوظًا عمدًا قيمةٌ صالحة هنا كذلك. */
    S.econ.adopt0      = dflt(S.econ.adopt0,      1);
    S.econ.adoptMax    = dflt(S.econ.adoptMax,    1);
    S.econ.adoptMonths = dflt(S.econ.adoptMonths, 6);
    S.econ.leak        = dflt(S.econ.leak,        0);
    S.econ.collect     = dflt(S.econ.collect,     1);
    S.econ.collectDays = dflt(S.econ.collectDays, 0);
    S.econ.sports.forEach(function (x) { x.maxPlaces = Math.max(0, Number(x.maxPlaces) || 0); });
    S.econStartRow = b.econStartRow || 0;

    $('#btnSheet').href = b.sheetUrl || '#';
    paintStaticIcons();
    $('#msgCopy').onclick = copyProposal;
    buildNav();
    paintTheme();
    $('#boot').hidden = true;
    $('#shell').hidden = false;
    S.ready = true;
    go(location.hash.replace('#', '') || 'home');
    setSync('ok');
  }).catch(function (e) {
    var m = (e && e.message) ? e.message : 'ما قدرنا نقرأ الشيت.';
    $('#boot').classList.add('is-err');
    $('#bootMsg').textContent = m;
  });
}

/* ═══ التنقّل ════════════════════════════════════════════════════ */
function buildNav() {
  var h = '';
  PAGES.forEach(function (grp) {
    h += '<p class="nav-sec">' + esc(grp.g) + '</p>';
    grp.items.forEach(function (p) {
      h += '<button class="nav-btn" type="button" data-go="' + p.id + '">' +
             icon(p.ic) + '<span>' + esc(p.t) + '</span>' +
             '<span class="tail" data-tail="' + p.id + '" hidden></span></button>';
    });
  });
  $('#nav').innerHTML = h;
}

function pageMeta(id) {
  for (var i = 0; i < PAGES.length; i++) {
    var f = PAGES[i].items.filter(function (p) { return p.id === id; })[0];
    if (f) return f;
  }
  return PAGES[0].items[0];
}

function go(id) {
  if (!pageMeta(id) || !S.ready) id = 'home';
  S.page = id;
  history.replaceState(null, '', '#' + id);

  var m = pageMeta(id);
  $('#pageTitle').textContent = m.t;
  $('#pageSub').textContent   = m.sub;
  $$('#nav .nav-btn').forEach(function (b) { b.classList.toggle('on', b.dataset.go === id); });
  $('#rail').classList.remove('open');

  render();
  $('.view').scrollTop = 0;
  window.scrollTo(0, 0);
}

function render() {
  var v = $('#view');
  var fn = ({ home: vHome, venues: vVenues, calc: vCalc, econ: vEcon,
              terms: vTerms, tasks: vTasks, ideas: vIdeas, logs: vLogs })[S.page];
  v.innerHTML = fn ? fn() : '';
  if (afterRender[S.page]) afterRender[S.page]();
  paintBadges();
}
var afterRender = {};

function paintBadges() {
  var due = toCall().length, open = openTasks().length;
  setTail('venues', due, due > 0);
  setTail('tasks', open, false);
}
function setTail(id, n, hot) {
  var el = $('[data-tail="' + id + '"]');
  if (!el) return;
  el.hidden = !n;
  el.textContent = n;
  el.className = 'tail' + (hot ? ' hot' : '');
}

/* ═══════════════════════════════════════════════════════════════════
   ① لوحة اليوم
   ═══════════════════════════════════════════════════════════════════ */

function toCall() {
  return venues()
    .filter(function (r) { return String(r['الحالة'] || '').trim() !== ON_PLATFORM; })
    .map(function (r) { var d = daysSince(r); return { r: r, d: d, k: (d === null ? 99999 : d) }; })
    .sort(function (a, b) { return b.k - a.k; });
}
function openTasks() {
  return tasksAll().filter(function (t) {
    var st = String(t['الحالة'] || '').trim();
    return st !== 'تمّت' && st !== 'منجزة' && st !== 'ملغاة' && st !== 'مكتملة';
  });
}
function undecidedIdeas() {
  return ideasAll().filter(function (i) { return String(i['القرار'] || '').trim() === 'لم يُقرَّر' || !String(i['القرار'] || '').trim(); });
}
function unfilled() {
  var out = [];
  Object.keys(C).forEach(function (k) {
    if (String(C[k].value).indexOf('املأني') > -1) out.push({ cell: k, label: C[k].label, hint: C[k].hint });
  });
  return out;
}

function vHome() {
  var t = T(), sf = liveSubfields();
  var all = venues(), live = all.filter(function (r) { return String(r['الحالة'] || '').trim() === ON_PLATFORM; });
  var ceiling = sf.total * t.cap;
  var calls = toCall(), tasks = openTasks(), ideas = undecidedIdeas(), gaps = unfilled();

  var h = '<div class="stack">';

  /* ── الرقم البطل: سقفٌ مقيس لا توقُّع ── */
  h += '<div class="grid g-4">' +
    '<div class="hero">' +
      '<p class="h-l">سقف دخلك الشهري اليوم</p>' +
      '<div class="h-v">' + big(ceiling, 'د.أ') + '</div>' +
      '<p class="h-d">' + esc(fieldsNoun(sf.total)) + ' فرعيًّا على المنصّة × ' + n0(t.cap) + ' سقف كلٍّ. ' +
      '<b>سقفٌ لا توقُّع</b> — ولا يبلغه إلّا الملعب الذي امتلأ.</p>' +
      (sf.missing ? '<p class="h-d" style="color:var(--warn);margin-top:6px">' +
        icon('alert') + ' ' + placesNoun(sf.missing) + ' على المنصّة بلا «عدد الملاعب الفرعية» — الرقم أعلاه ناقصٌ بمقدارها.</p>' : '') +
    '</div>' +

    kpi('أماكن على المنصّة', n0(live.length), 'من ' + placesNoun(all.length) + ' في قائمتك') +
    kpi('يستحقّون اتّصالًا', n0(calls.length), calls.length ? 'أقدمهم ' + (calls[0].d === null ? 'ما تواصلتَ معه أصلًا' : 'منذ ' + daysNoun(calls[0].d)) : 'لا أحد ينتظر') +
  '</div>';

  /* ── مين تتصل فيه اليوم ── */
  h += '<div class="card"><div class="card-h"><h3>مين تتصل فيه اليوم؟</h3>' +
       '<p>الأقدم أوّلًا — ومن لم تتواصل معه قطّ فوق الجميع</p>' +
       '<button class="btn quiet sm sp" type="button" data-go="venues">كلّ الملاعب ' + icon('arrow') + '</button></div>';

  if (!calls.length) {
    h += '<div class="empty"><h4>ما في أحد ينتظر اتّصالًا</h4><p>كلّ من في قائمتك إمّا على المنصّة أو تواصلتَ معه للتوّ.</p></div>';
  } else {
    h += '<div class="call">';
    calls.slice(0, 6).forEach(function (c, i) {
      var r = c.r, ph = r['رقم التلفون'];
      var when = c.d === null ? 'ما في تواصل مسجَّل' : 'آخر تواصل منذ ' + daysNoun(c.d);
      h += '<div class="call-row' + (c.d === null || c.d > 21 ? ' hot' : '') + '">' +
        '<span class="call-rank">' + (i + 1) + '</span>' +
        '<span class="call-b"><b>' + esc(r['اسم الملعب']) + '</b>' +
          '<span>' + esc(r['المنطقة'] || '—') + ' · ' + esc(when) + (r['الخطوة التالية'] ? ' · ' + esc(r['الخطوة التالية']) : '') + '</span></span>' +
        '<span class="call-a">' +
          (ph ? '<a class="icon-btn" href="' + esc(telHref(ph)) + '" aria-label="اتّصل بـ' + esc(r['اسم الملعب']) + '">' + icon('phone') + '</a>' +
                '<a class="icon-btn" href="' + esc(waHref(ph)) + '" target="_blank" rel="noopener" aria-label="واتساب">' + icon('wa') + '</a>'
              : '<span class="chip warn"><span class="shape"></span>لا رقم</span>') +
          '<button class="icon-btn" type="button" data-venue="' + r._row + '" aria-label="افتح البطاقة">' + icon('edit') + '</button>' +
        '</span></div>';
    });
    h += '</div>';
  }
  h += '</div>';

  /* ── صفّان: المهام والأفكار ── */
  h += '<div class="grid g-2">';

  h += '<div class="card"><div class="card-h"><h3>مهامّ مفتوحة</h3><p>' + n0(tasks.length) + '</p>' +
       '<button class="btn quiet sm sp" type="button" data-add="task">' + icon('plus') + 'أضف</button></div>';
  h += tasks.length
    ? '<ul>' + tasks.slice(0, 6).map(function (t2) {
        return '<li class="call-row" style="padding:10px 0">' +
          '<button class="icon-btn" type="button" data-done="' + t2._row + '" aria-label="علّمها منجزة">' + icon('check') + '</button>' +
          '<span class="call-b"><b style="font-size:14px">' + esc(t2['المهمّة']) + '</b>' +
          '<span>' + esc([t2['المجال'], t2['الأولوية'], t2['الموعد']].filter(Boolean).join(' · ') || '—') + '</span></span></li>';
      }).join('') + '</ul>'
    : '<div class="empty"><p>لا مهامّ مفتوحة.</p></div>';
  h += '</div>';

  h += '<div class="card"><div class="card-h"><h3>أفكار تنتظر قرارًا</h3><p>' + n0(ideas.length) + '</p>' +
       '<button class="btn quiet sm sp" type="button" data-go="ideas">افتحها ' + icon('arrow') + '</button></div>';
  h += ideas.length
    ? '<ul>' + ideas.slice(0, 6).map(function (i2) {
        return '<li class="call-row" style="padding:10px 0"><span class="call-b"><b style="font-size:14px">' +
          esc(i2['الفكرة']) + '</b><span>' + esc(i2['من أين جاءت'] || '—') + '</span></span>' +
          '<span class="chip warn"><span class="shape"></span>لم يُقرَّر</span></li>';
      }).join('') + '</ul>'
    : '<div class="empty"><p>كلّ فكرةٍ أخذت حكمها.</p></div>';
  h += '</div>';

  h += '</div>';

  /* ── الخانات الناقصة: ما سيسألك عنه المحامي ── */
  if (gaps.length) {
    h += '<div class="note warn">' + icon('alert') + '<div><b>' + countNoun(gaps.length, 'خانةٌ واحدة', 'خانتان', 'خانات', 'خانة') +
         ' في نموذج عملك بلا جواب</b> — وهي بالضبط ما سيسألك عنه المحامي: ' +
         gaps.map(function (g) { return '«' + esc(g.label) + '»'; }).join('، ') +
         '. <button class="btn quiet sm" type="button" data-go="terms">افتح نموذج العمل</button></div></div>';
  }

  h += '</div>';
  return h;
}

function kpi(label, val, den, trend) {
  return '<div class="card kpi"><span class="k-l">' + esc(label) + '</span>' +
         '<span class="k-v"><span class="numP">' + val + '</span></span>' +
         '<span class="k-d">' + esc(den || '') + '</span>' +
         (trend ? '<span class="k-t">' + trend + '</span>' : '') + '</div>';
}

/* ═══════════════════════════════════════════════════════════════════
   ② الملاعب
   ═══════════════════════════════════════════════════════════════════ */

/* ── ⭐ ترتيب الحالات كما يجري القمع لا كما تجري الأبجدية ──────────
   كانت `.sort()` — فتقع «على المنصّة» بين «تفاوض» و«لم نتواصل» بلا معنى،
   ويُقرأ الصفُّ قائمةَ وسومٍ لا مسارًا.
   🔴 **والترتيب من الشيت لا من قائمةٍ أكتبها هنا**: قائمةُ التحقّق في
      عمود «الحالة» مكتوبةٌ بترتيبها الطبيعي، وهي مصدرُ الحقيقة نفسه الذي
      تُقرأ منه المفردات (القرار ⑤ في README). وقائمةٌ ثانية هنا تنحرف عنها
      أوّلَ مرّةٍ يضيف فيها المالك حالة.
   ⚠️ وما ليس في القائمة يُلحَق بعدها بترتيبه الأبجدي — لا يُحذَف ولا
      يُخمَّن موضعُه. و«بلا حالة» آخرًا دائمًا: هي غيابُ مرحلةٍ لا مرحلة. */
function funnelOrder(keys) {
  var order = vocab('venues', 'الحالة');
  var at = function (k) {
    if (k === '—') return 1e6;
    var i = order.indexOf(k);
    return i === -1 ? 1e5 : i;
  };
  return keys.slice().sort(function (a, b) {
    var d = at(a) - at(b);
    return d || (a < b ? -1 : a > b ? 1 : 0);
  });
}

/* ═══════════════════════════════════════════════════════════════════
   حقل الرقم  —  مكوّنٌ واحد تستعمله الصفحات الثلاث
   ───────────────────────────────────────────────────────────────────
   🔴 المزلاج وحده كان يستحيل معه بلوغُ رقمٍ بعينه على شاشة لمس. وثلاث
      صفحاتٍ بثلاث معالجاتٍ مختلفة للأرقام تنحرف إحداها يومًا — فمدخلٌ
      واحد لكلّها: كتابةٌ مباشرة (والحقل يُحدَّد كلُّه عند اللمس فتكتب
      فوقه فورًا) · خطوة ± بهدفٍ ٤٤px · ومزلاجٌ حيث يُطلَب السحبُ فعلًا.
   ⚠️ والقيم في الواجهة **بمساحة العرض** (٪ من ٠ إلى ١٠٠)، والمكوّن هو
      من يحوّلها إلى مساحة التخزين (كسرٌ من ٠ إلى ١) قبل أن يسلّمها —
      فلا يحمل كلُّ نداءٍ تحويلَه بيده ويسهو أحدُها.
   ═══════════════════════════════════════════════════════════════════ */
function numField(o) {
  var dec   = stepDec(o.step);
  var shown = snapTo(o.val, o.step, dec);
  var id    = 'nf-' + String(o.k).replace(/[^\w]/g, '_');
  return '<div class="nf' + (o.big ? ' is-big' : '') + '" data-nf="' + esc(o.k) + '"' +
      ' data-min="' + o.min + '" data-max="' + o.max + '" data-step="' + o.step + '" data-dec="' + dec + '"' +
      (o.pct ? ' data-pct="1"' : '') + '>' +
    '<div class="nf-top"><label for="' + id + '">' + esc(o.label) + '</label></div>' +
    '<div class="nf-row">' +
      '<button class="nf-step" type="button" data-d="-1" aria-label="أنقص">' + icon('minus') + '</button>' +
      '<input class="nf-val" id="' + id + '" type="text" autocomplete="off" spellcheck="false"' +
        ' inputmode="' + (dec ? 'decimal' : 'numeric') + '" value="' + esc(shown) + '">' +
      (o.suffix ? '<span class="nf-suffix">' + esc(o.suffix) + '</span>' : '') +
      '<button class="nf-step" type="button" data-d="1" aria-label="زِد">' + icon('plus') + '</button>' +
    '</div>' +
    (o.slider ? '<input type="range" data-nfr="1" min="' + o.min + '" max="' + o.max +
                '" step="' + o.step + '" value="' + o.val + '" aria-label="' + esc(o.label) + '">' : '') +
    (o.hint ? '<span class="hint">' + esc(o.hint) + '</span>' : '') +
  '</div>';
}

/** يربط كلّ حقول الرقم داخل `root`، ويسلّم `(مفتاح، قيمةٌ مخزَّنة)`. */
function wireNumFields(root, onChange) {
  $$('[data-nf]', root).forEach(function (box) {
    var key  = box.dataset.nf;
    var min  = Number(box.dataset.min), max = Number(box.dataset.max);
    var step = Number(box.dataset.step), dec = Number(box.dataset.dec);
    var pct  = box.dataset.pct === '1';
    var inp  = $('.nf-val', box), rng = $('[data-nfr]', box);

    function cur() { var v = parseNum(inp.value); return isFinite(v) ? v : min; }

    function emit(disp, writeBack) {
      var v = Math.max(min, Math.min(max, disp));
      if (rng) rng.value = v;
      /* ⚠️ لا يُكتب في الحقل أثناء الكتابة: إعادةُ الكتابة تنقل المؤشّر
         إلى الطرف فيستحيل إدخالُ رقمٍ من رقمين. التطبيعُ عند المغادرة. */
      if (writeBack) inp.value = String(snapTo(v, step, dec));
      onChange(key, pct ? v / 100 : v);
    }

    /* 🔴 `select()` داخل معالج `focus` نفسه يضيع: المتصفّح يضع المؤشّر
       **بعد** الحدث فيمحو التحديد. مقيس: `selectionEnd === 0`. التأجيل
       بمهمّةٍ واحدة يجعله يقع بعد وضعِ المتصفّح مؤشّرَه. */
    inp.onfocus = function () {
      setTimeout(function () { try { inp.select(); } catch (e) {} }, 0);
    };
    inp.oninput = function () {
      var raw = parseNum(inp.value);
      if (isFinite(raw)) emit(raw, false);
    };
    inp.onblur   = function () { emit(cur(), true); };
    inp.onkeydown = function (e) {
      if (e.key === 'Enter')     { inp.blur(); }
      if (e.key === 'ArrowUp')   { e.preventDefault(); emit(cur() + step, true); }
      if (e.key === 'ArrowDown') { e.preventDefault(); emit(cur() - step, true); }
    };
    $$('.nf-step', box).forEach(function (b) {
      b.onclick = function () { emit(cur() + Number(b.dataset.d) * step, true); };
    });
    if (rng) rng.oninput = function () { emit(Number(rng.value), true); };
  });
}

/** يكتب قيمةً مخزَّنة في حقلٍ قائم — للقفزات السريعة في وضع العرض. */
function setNumField(root, key, stored) {
  var box = $('[data-nf="' + key + '"]', root); if (!box) return;
  var pct = box.dataset.pct === '1';
  var disp = pct ? stored * 100 : stored;
  var inp = $('.nf-val', box), rng = $('[data-nfr]', box);
  inp.value = String(snapTo(disp, Number(box.dataset.step), Number(box.dataset.dec)));
  if (rng) rng.value = disp;
}

function repaintCalc() {

  var hv = $('#view .hero .h-v');
  if (hv) {
    /* يُسبَط رقمُ العنصر لا يُستبدَل الوسم كلّه — استبدالٌ كامل يقتل حالة
       الحركة الجارية ويُفقد `._animRaf` أثره، وBig() يبني numP+u كشقيقين
       أصلًا فعزل الرقم وحده آمن. */
    var numEl = hv.querySelector('.numP');
    if (numEl) animateNumber(numEl, r.net, { fmt: n0 });
    else hv.innerHTML = big(r.net, 'د.أ');
    hv.style.color = r.net >= 0 ? 'var(--good)' : 'var(--bad)';
  }
  var hd = $('#view .hero .h-d');
  if (hd) hd.textContent = 'ربح حجوزاته الجديدة (' + n0(r.grossNew) + ') ناقصَ ما يدفعه (' + n0(r.pay) + ').';

  var tiles = $$('#view .kpi .k-v');
  if (tiles[0]) tiles[0].innerHTML = '<span class="numP">' + n0(r.pay) + '<span class="u">د.أ</span></span>';
  if (tiles[1]) tiles[1].innerHTML = '<span class="numP">' + pct(r.effRate) + '</span>';
  var dens = $$('#view .kpi .k-d');
  if (dens[0]) dens[0].textContent = 'من الشهر الثاني · سقفه المطلق ' + n0(r.capTotal);

  var vd = $('#view .verdict');
  if (vd) {
    var ok = isNum(r.breakEven) && S.calc.newB >= r.breakEven;
    vd.className = 'verdict ' + (ok ? 'ok' : 'no');
    vd.innerHTML = icon(ok ? 'check' : 'alert') + '<div>' +
      (!isNum(r.breakEven) ? 'ما في تعادل بهذي الأرقام — هامشه ما بيغطّي العمولة.'
        : ok ? 'رابح — فوق التعادل بـ<b> ' + n1(S.calc.newB - r.breakEven) + ' </b>حجزة جديدة شهريًّا.'
             : 'تحت التعادل بـ<b> ' + n1(r.breakEven - S.calc.newB) + ' </b>حجزة جديدة شهريًّا.') +
      (isNum(r.breakEven) ? '<br><span style="opacity:.85;font-weight:400">نقطة التعادل: ' + n1(r.breakEven) +
        ' حجزة جديدة — أي نموّ ' + pct(r.growthNeeded, 0) + ' على حجوزاته الحالية.</span>' : '') + '</div>';
  }

  var save = $('#calcSave'); if (save) save.disabled = !S.calcDirty;
  drawCalcCharts();
  if (S.stageOn) paintStage();
}

function drawCalcCharts() {
  var t = T();
  var host1 = $('#ch1'), host2 = $('#ch2');
  if (host1) {
    var w = host1.clientWidth || 460;
    var xs = [0, 3, 5, 8, 10, 15, 20, 25, 30, 40, 50, 60, 80, 100];
    var a = xs.map(function (x) {
      return [x, venueCalc(Object.assign({}, S.calc, { newB: x }), t).net];
    });
    host1.innerHTML = svgLine({
      w: w, h: 236, series: [{ pts: a, color: cssVar('--s1') }],
      fmtY: n0, fmtX: n0,
      rule: { y: 0, color: cssVar('--ink-3'), label: 'التعادل' },
      aria: 'صافي فائدة صاحب الملعب بالدينار مقابل عدد الحجوزات الجديدة الشهرية.'
    });
  }
  if (host2) {
    var w2 = host2.clientWidth || 460;
    var pts = [], capStart = null;
    for (var k = 0; k <= 90; k += 3) {
      var c = commissionPerSubfield(k, S.calc.price, t.r1, t.n1, t.r2, t.cap);
      pts.push([k, c]);
      if (capStart === null && t.cap > 0 && c >= t.cap - 0.001) capStart = k;
    }
    host2.innerHTML = svgLine({
      w: w2, h: 236, series: [{ pts: pts, color: cssVar('--s1') }], fmtY: n0, fmtX: n0,
      rule: t.cap > 0 ? { y: t.cap, color: cssVar('--warn'), label: 'السقف ' + n0(t.cap) } : null,
      aria: 'عمولة الملعب الفرعي الواحد مقابل عدد حجوزاته الشهرية — تتدرّج ثمّ تقف عند السقف.'
    }) + '<p class="hint" style="margin-top:8px">' +
      (capStart !== null ? 'السقف يبدأ عند الحجزة <b class="num">' + n0(capStart) + '</b> تقريبًا بسعر ' + n0(S.calc.price) + ' د.أ — وبعدها لا يزيد ما يدفعه ولو حجز الشهر كلّه.'
                         : 'بلا سقفٍ في النموذج الحالي.') + '</p>';
  }
}

/* ═══ وضع العرض ══════════════════════════════════════════════════ */
function openStage() {
  S.stageOn = true;
  /* الداكن يُفرَض على المشهد وحده — التفضيل المحفوظ في localStorage لا
     يُمَسّ، فيعود المظهر كما كان تمامًا عند الإغلاق. التباين الأعلى
     يركّز نظر العميل على الرقم لا على تفاصيل الشاشة حوله. */
  stagePrevTheme = document.documentElement.getAttribute('data-theme');
  document.documentElement.setAttribute('data-theme', 'dark');
  $('#stage').hidden = false;
  document.body.style.overflow = 'hidden';
  paintStage();
}
function closeStage() {
  S.stageOn = false;
  if (stagePrevTheme) document.documentElement.setAttribute('data-theme', stagePrevTheme);
  else document.documentElement.removeAttribute('data-theme');
  stagePrevTheme = null;
  $('#stage').hidden = true;
  document.body.style.overflow = '';
}

function paintStage() {
  var t = T(), r = venueCalc(S.calc, t);
  var ok = isNum(r.breakEven) && S.calc.newB >= r.breakEven;
  var capHit = t.cap > 0 && r.pay >= r.capTotal - 0.005;

  var h = '<button class="icon-btn stage-x" type="button" id="stageX" aria-label="أغلق وضع العرض">' + icon('x') + '</button>';
  h += '<button class="icon-btn stage-share" type="button" id="stageShare" aria-label="جهّز ملخّصًا للعميل">' + icon('wa') + '</button>';
  h += '<div class="stage-in">';
  h += '<p class="stage-eyebrow">المستديرة · لو ' + esc(bookingsNoun(S.calc.newB)) + ' جديدة بالشهر</p>';
  h += '<h2 class="stage-title">هذا اللي بترجعلك من المنصّة</h2>';

  h += '<div class="hero stage-hero"><p class="h-l">صافي فائدتك الشهرية</p>' +
       '<div class="h-v" style="color:' + (r.net >= 0 ? 'var(--good)' : 'var(--bad)') + '">' + big(r.net, 'د.أ') + '</div>' +
       '<p class="h-d">وفي الشهر الأول <b>' + n0(r.firstMonth) + ' د.أ</b> — لأنّه مجّانيّ بالكامل، ما بتدفع فلس.</p></div>';

  h += '<div class="stage-tiles">' +
    stageTile('اللي بتدفعه للمنصّة', n0(r.pay) + ' د.أ',
      capHit ? 'السقف اكتمل — كلّ دينار إضافي من هون يدخل جيبك بالكامل'
             : 'من الشهر الثاني · وسقفك ' + n0(r.capTotal) + ' مهما حجزت',
      capHit ? 'cap-hit' : '') +
    stageTile('النسبة الفعلية', pct(r.effRate), 'مش ' + pct(t.r1, 0) + ' — التدرّج والسقف بينزّلوها') +
    stageTile('بتدفع بعد ما تقبض', 'نقدًا', 'اللاعب بيدفع سعرك كامل عندك في الملعب') +
  '</div>';

  h += '<div class="verdict ' + (ok ? 'ok' : 'no') + '">' + icon(ok ? 'check' : 'alert') + '<div>' +
    (!isNum(r.breakEven)
      ? 'بهذي الأرقام ما في تعادل — هامشك ما بيغطّي العمولة.'
      : ok ? 'من <b>' + n1(r.breakEven) + '</b> حجزة جديدة بالشهر وبتصير رابح — وإحنا حاطّينها ' + n0(S.calc.newB) + '.'
           : 'لازم <b>' + n1(r.breakEven) + '</b> حجزة جديدة بالشهر عشان تتعادل.') + '</div></div>';

  /* كلّ ما يتحكّم فيه ظاهرٌ هنا — بلا طيّةٍ تُخفيه. ورقمُ المتابعة
     («حجوزات جديدة») وحده ينزل إلى اللوحة السفلية لأنّه الذي يُحرَّك
     أثناء الحديث، لا لأنّ البقيّة أقلّ شأنًا. */
  h += '<div class="stage-inputs"><h3>الأرقام اللي بتتحكّم فيها</h3><div class="nf-grid">' +
    numField({ k: 'price',     label: 'سعر الحجزة عندك (د.أ)',  min: 1, max: 400, step: 1, val: S.calc.price }) +
    numField({ k: 'subfields', label: 'عدد ملاعبك',              min: 1, max: 30,  step: 1, val: S.calc.subfields }) +
    numField({ k: 'current',   label: 'حجوزاتك الشهرية اليوم',   min: 0, max: 600, step: 1, val: S.calc.current }) +
    numField({ k: 'varCost',   label: 'تكلفتك لكلّ حجزة (د.أ)',  min: 0, max: 300, step: 1, val: S.calc.varCost }) +
    numField({ k: 'through',   label: '٪ اللي بيمرّ عبر المنصّة', min: 0, max: 100, step: 5, val: S.calc.through * 100,
               pct: true, suffix: '٪' }) +
  '</div></div>';

  h += '<p class="hint" style="margin-top:18px">الأرقام محسوبة على مدخلاتك أنت — عدّل أيّ رقم وشوف.</p>';
  h += '</div>';   // نهاية .stage-in

  /* ── لوحة التحكّم السفلية: منطقة الإبهام ── */
  var capAt = capReachNewB(S.calc, t);
  h += '<div class="stage-dock"><div class="stage-dock-in">' +
    numField({ k: 'newB', label: 'حجوزات جديدة بالشهر', min: 0, max: 300, step: 1,
               val: S.calc.newB, slider: true, big: true }) +
    '<div class="dock-chips">' +
      ['+5', '+10', '+20'].map(function (j) {
        return '<button class="chip" type="button" data-jump="' + j + '">' + j + '</button>';
      }).join('') +
      (isNum(capAt) ? '<button class="chip acc" type="button" data-jump="cap">عند السقف</button>' : '') +
      '<button class="chip" type="button" data-jump="0">صفر</button>' +
    '</div>' +
  '</div></div>';

  $('#stage').innerHTML = h;
  $('#stageX').onclick = closeStage;
  $('#stageShare').onclick = openProposal;

  /* مدخلٌ واحد لكلّ الحقول — بما فيها حقل اللوحة السفلية. */
  wireNumFields($('#stage'), function (k, v) {
    S.calc[k] = v; S.calcDirty = true;
    if (k === 'newB') paintStageNumbers();
    else { paintStageNumbers(); refreshCapChip(); }
  });

  function refreshCapChip() {
    var chip = $('#stage [data-jump="cap"]');
    if (chip) chip.hidden = !isNum(capReachNewB(S.calc, T()));
  }

  $$('#stage [data-jump]').forEach(function (btn) {
    btn.onclick = function () {
      var j = btn.dataset.jump;
      var next = j === 'cap' ? capReachNewB(S.calc, T())
               : j === '0'   ? 0
                             : S.calc.newB + Number(j.replace('+', ''));
      if (!isNum(next)) return;
      S.calc.newB = Math.max(0, Math.min(300, Math.round(next)));
      S.calcDirty = true;
      setNumField($('#stage'), 'newB', S.calc.newB);
      paintStageNumbers();
    };
  });
}

/** تحديثٌ موضعيّ — إعادةُ بناء اللوح كلّه تُفقد المزلاجَ تركيزَه تحت الإصبع. */
function paintStageNumbers() {
  var t = T(), r = venueCalc(S.calc, t), ok = isNum(r.breakEven) && S.calc.newB >= r.breakEven;
  var capHit = t.cap > 0 && r.pay >= r.capTotal - 0.005;

  var hv = $('#stage .h-v');
  if (hv) {
    var numEl = hv.querySelector('.numP');
    if (numEl) animateNumber(numEl, r.net, { fmt: n0 }); else hv.innerHTML = big(r.net, 'د.أ');
    hv.style.color = r.net >= 0 ? 'var(--good)' : 'var(--bad)';
  }
  var hd = $('#stage .h-d');
  if (hd) hd.innerHTML = 'وفي الشهر الأول <b>' + n0(r.firstMonth) + ' د.أ</b> — لأنّه مجّانيّ بالكامل، ما بتدفع فلس.';

  var tl = $$('#stage .stage-tile');
  if (tl[0]) {
    tl[0].classList.toggle('cap-hit', capHit);
    var lockEl = tl[0].querySelector('.cap-lock');
    if (capHit && !lockEl) tl[0].insertAdjacentHTML('afterbegin', icon('lock', 'cap-lock'));
    else if (!capHit && lockEl) lockEl.remove();

    var payNum = tl[0].querySelector('.numP');
    if (payNum) animateNumber(payNum, r.pay, { fmt: function (v) { return n0(v) + ' د.أ'; } });
    else $('.k-v', tl[0]).innerHTML = '<span class="numP">' + n0(r.pay) + ' د.أ</span>';

    $('.k-d', tl[0]).textContent = capHit
      ? 'السقف اكتمل — كلّ دينار إضافي من هون يدخل جيبك بالكامل'
      : 'من الشهر الثاني · وسقفك ' + n0(r.capTotal) + ' مهما حجزت';
  }
  if (tl[1]) $('.k-v', tl[1]).innerHTML = '<span class="numP">' + pct(r.effRate) + '</span>';

  var eb = $('#stage .stage-eyebrow');
  if (eb) eb.textContent = 'المستديرة · لو ' + bookingsNoun(S.calc.newB) + ' جديدة بالشهر';
  var vd = $('#stage .verdict');
  if (vd) {
    vd.className = 'verdict ' + (ok ? 'ok' : 'no');
    vd.innerHTML = icon(ok ? 'check' : 'alert') + '<div>' +
      (!isNum(r.breakEven) ? 'بهذي الأرقام ما في تعادل — هامشك ما بيغطّي العمولة.'
        : ok ? 'من <b>' + n1(r.breakEven) + '</b> حجزة جديدة بالشهر وبتصير رابح — وإحنا حاطّينها ' + n0(S.calc.newB) + '.'
             : 'لازم <b>' + n1(r.breakEven) + '</b> حجزة جديدة بالشهر عشان تتعادل.') + '</div>';
  }
}

/* ═══ ملخّص العميل ══════════════════════════════════════════════
   نصٌّ يُبنى من نفس الأرقام المعروضة على الشاشة، يُعرَض ليُنسَخ ويُرسَل
   يدويًّا — **صفر إرسالٍ من هنا وصفر رقم هاتف**. المستخدم يختار القناة. */
function openProposal() {
  var t = T(), r = venueCalc(S.calc, t);
  $('#msgText').value = buildProposalText(r, t, S.calc);
  $('#msgWrap').hidden = false;
  setTimeout(function () { var ta = $('#msgText'); ta.focus(); ta.select(); }, 60);
}
function closeProposal() { $('#msgWrap').hidden = true; }

function copyProposal() {
  var btn = $('#msgCopy'), ta = $('#msgText');
  var done = function () {
    var old = btn.innerHTML;
    btn.innerHTML = icon('check') + 'انتُسخ';
    setTimeout(function () { btn.innerHTML = old; }, 1600);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(ta.value).then(done).catch(function () {
      ta.select(); document.execCommand('copy'); done();
    });
  } else {
    ta.select(); document.execCommand('copy'); done();
  }
}

function stageTile(l, v, d, cls) {
  return '<div class="stage-tile kpi' + (cls ? ' ' + cls : '') + '">' +
         (cls === 'cap-hit' ? icon('lock', 'cap-lock') : '') +
         '<span class="k-l">' + esc(l) + '</span>' +
         '<span class="k-v" style="font-size:26px"><span class="numP">' + v + '</span></span>' +
         '<span class="k-d">' + esc(d) + '</span></div>';
}

/* ═══════════════════════════════════════════════════════════════════
   ④ اقتصاديات المنصة
   ═══════════════════════════════════════════════════════════════════ */

function vEcon() {
  var t = T(), r = econCalc(S.econ, t);
  var TILES = econTiles(r, t);

  var h = '<div class="stack">';

  /* ── ① الجواب: رقمٌ واحد ومعه مؤشّراته ──
     ولا يتكرّر أيٌّ منها في الملخّص تحته: «الدخل الشهري» و«تكلفة الرسائل»
     كانتا بلاطتين تقولان ما يقوله الدفتر سطرًا سطرًا، فسقطتا. */
  h += '<div class="grid g-4">' +
    /* 🔴 اللون بالصنف لا بنمطٍ سطريّ: النمط السطريّ يغلب كلَّ قاعدة في
       الورقة، فكان حبرُ `--ink` يقع فوق اللون الممتلئ ويقيس **2.14**.
       ⚠️ والبطاقة الممتلئة **للجواب الموجب وحده**: خسارةٌ مصبوغةٌ بلون
          الهويّة تُقرأ احتفاءً بها. فالخسارة تبقى على سطحٍ محايد بحبر
          التحذير — نفس منطق «الأحمر للخطر لا للتحذير» في التطبيق. */
    '<div class="hero' + (r.realProfit1 >= 0 ? ' is-answer' : ' is-loss') + '" id="ecHero">' +
      /* 🔴 «الحقيقي» تُقرأ **مقبوضًا** — والرقم توقُّعٌ من مدخلاتك لا شيءٌ
         وقع. والتسمية الدقيقة أطول، فتحتها سطرٌ خفيف يقول ما هي بكلماتٍ
         عادية — وهو ما يجعل التسمية الاحترافية مفهومةً بدل أن تكون حاجزًا.
         ⚠️ والمفتاح `realProfit1` **لم يتغيّر**: مطابقةُ الشيت تقرؤه باسمه
            وتقارنه بـB78، وتغييرُه يكسر الحارس بلا أن يصرخ شيء. */
      '<p class="h-l">الربح التشغيلي الشهري المتوقَّع</p>' +
      '<p class="h-n">ما يبقى في جيبك من شهرٍ كامل بعد كلّ المصاريف — ' +
        '<b>توقُّعٌ محسوبٌ من مدخلاتك</b>، لا مبلغٌ قبضتَه</p>' +
      '<div class="h-v" id="ecProfit">' + big(r.realProfit1, 'د.أ') + '</div>' +
      '<p class="h-d" id="ecProfitD">' + econHeroDesc(r) + '</p>' +
      '<div class="h-spark" id="spark"></div></div>' +
    /* ⚠️ المعرّف من الفهرس الأصلي لا من فهرس الشريحة — `slice().map` كان
       سيبدأ العدّ من صفرٍ ثانية فيتكرّر `ecT0v` مرّتين في المستند. */
    TILE_ORDER.map(function (i) { return kpiE(TILES[i], i); }).join('') +
  '</div>';

  /* ── الملخّص الشامل: وحدتان كبيرتان وتحت كلٍّ تفصيلُها ──
     كان في الصفحة كلُّ رقمٍ على حدة — دخلٌ في بلاطة وتكاليفُ رسائل في
     أخرى ورواتبُ في حاشية — ولا موضعَ واحدٌ يقول «هذا ما يدخل وهذا ما
     يخرج». والملخّص لا يخترع رقمًا: يجمع ما في الصفحة أصلًا في دفترٍ
     واحد بثلاثة أعمدة، ومصدرُه دالّةٌ واحدة فلا ينحرف عمّا تحته. */
  h += '<div class="card"><div class="card-h"><h3>الملخّص الشامل</h3>' +
    '<p>كلّ دينارٍ يدخل وكلّ دينارٍ يخرج — شهريًّا وسنويًّا</p>' +
    '<span class="chip sp" id="ecToday">' + econTodayChip(r) + '</span></div>' +
    '<div id="ecLedger">' + econSummaryHTML(r, t) + '</div>' +
    '<p class="hint" style="margin-top:12px">عمودُ كلّ سنة <b>مجموعُ اثني عشر شهرًا من مسار ٤٨ شهرًا</b> ' +
    'لا الشهرَ في اثني عشر: الأماكن تنمو بالإضافة وتنقص بالتسرّب، والرواتبُ والتسويق يتبدّلان في السنة الثانية. ' +
    'وعمودُ الشهر هو <b>الشهر الأوّل</b> بمدخلاتك كما هي.</p></div>';

  h += '<div class="sec-h"><h2>الاتجاه</h2>' +
       '<p>إلى أين يذهب هذا الرقم على مدى أربع سنوات، ومن أيّ رياضةٍ يأتي</p></div>';

  h += '<div class="grid g-2">' +
    '<div class="card chart-host"><div class="card-h"><h3>مسار ٤٨ شهرًا</h3>' +
      '<p id="ecPathSub">' + econPathSub() + '</p></div><div id="ep1"></div></div>' +
    '<div class="card"><div class="card-h"><h3>الدخل بحسب الرياضة</h3>' +
      '<p>شهريًّا بالدينار — عند اكتمال أماكن كلٍّ منها</p></div>' +
      '<div id="ecBars">' + econBars(r) + '</div>' +
      '<p class="hint" id="ecCap" style="margin-top:10px">' + econCapNote(r, t) + '</p></div>' +
  '</div>';

  /* ── المكان الواحد والتعادل ──────────────────────────────────────
     «ربحي الشهري» يقول أين أنت. وهذان يقولان ما هو أهمّ لقرارٍ
     استثماري: هل المكان الواحد يستحقّ ثمنه؟ وكم نقدًا يلزم قبل أن
     يُطعم العملُ نفسَه؟ وكلُّها مشتقّةٌ من مدخلاتك لا مخترَعة. */
  if (r.market) {
    h += '<div class="card"><div class="card-h"><h3>حصّتك من السوق</h3>' +
      '<p>كم من ملاعب السوق معك اليوم — <b>والمقام تقديرُك أنت</b>، من حقل ' +
      '«سقف السوق» في بطاقة كلّ رياضة أدناه</p></div>' +
      '<div id="ecMarket">' + econMarketHTML(r) + '</div>' +
      '<p class="hint" style="margin-top:12px">🔴 <b>هذه نسبةٌ إلى تقديرك لا إلى إحصاءٍ رسميّ</b> — ' +
      'ودقّتُها من دقّة السقف الذي أدخلتَه. وهي مع ذلك أنفعُ من العدد وحده: ' +
      '«٧ مكانًا» لا تقول أين أنت من الطريق، و«٧ من ٥٠٠» تقول.</p></div>';
  }

  h += '<div class="grid g-2">' +
    '<div class="card"><div class="card-h"><h3>المكان الواحد</h3>' +
      '<p>كم يكلّف اكتسابه وكم يعيد لك على عمره</p></div>' +
      '<div id="ecUnit">' + econUnitRows(r) + '</div></div>' +
    '<div class="card"><div class="card-h"><h3>التعادل والنقد المطلوب</h3>' +
      '<p>متى يُطعم نفسَه، وكم يلزم قبل ذلك</p></div>' +
      '<div id="ecBreak">' + econBreakRows(r) + '</div></div>' +
  '</div>';

  /* ── السيناريوهات: «ماذا لو ساء الحظّ؟» ─────────────────────────
     أهمّ ما ينقص النموذج ليس رقمًا بل **حدودَ ثقته**. وهذه تحرّك أقلّ
     ثلاثة أرقامٍ يقينًا وتُري أثرها على القرارات السبعة. */
  h += '<div class="card"><div class="card-h"><h3>السيناريوهات الثلاثة</h3>' +
    '<p>نفس مدخلاتك، وقد ساءت أو تحسّنت الأرقام الأقلّ يقينًا</p></div>' +
    '<div class="nf-grid">' +
      /* ⚠️ مزالج لا حقولٌ رقمية: هذه الثلاثة **استكشافية** — تُحرَّك لترى
         الأثر لا لتُكتب بدقّة، والمزلاج يقول مداها ويدعو إلى تحريكها.
         ويبقى الحقل الرقمي حيث تكون الدقّة مقصودة (السعر · الأماكن). */
      numField({ k: 'devWeekly',   label: 'انحراف الحجوزات الأسبوعية', min: 0, max: 90, step: 5, val: S.econ.devWeekly * 100,   pct: true, suffix: '٪', slider: true }) +
      numField({ k: 'devChurn',    label: 'انحراف التسرّب',            min: 0, max: 90, step: 5, val: S.econ.devChurn * 100,    pct: true, suffix: '٪', slider: true }) +
      numField({ k: 'devNewPlace', label: 'انحراف الأماكن الجديدة',    min: 0, max: 90, step: 5, val: S.econ.devNewPlace * 100, pct: true, suffix: '٪', slider: true }) +

    '<div id="ecScen" style="margin-top:14px">' + econScenRows(r, t) + '</div>' +
    '<p class="hint" style="margin-top:10px">🔴 <b>هذه النِسَب تقديرٌ مبدئيّ منّي لا قياسٌ من بياناتك</b> — ' +
    'وُضعت كنقطة بداية، وغيّرْها بما تراه ثمّ احفظ. ' +
    'و<b>السعر وعدد الأماكن لا يتحرّكان</b>: الأوّل قرارُك والثاني خطّتك، وليسا تقديرين — ' +
    'وتحريكُهما يخلط «ماذا لو ساء الحظّ» بـ«ماذا لو غيّرتُ قراري».</p></div>';

  /* ── المدخلات: بطاقةٌ لكلّ رياضة بدل جدولٍ يُمرَّر أفقيًّا ──
     ستّة عشر حقلًا في جدولٍ عرضُه ٦٣١px داخل شاشة ٣٧٥ يعني تمريرًا
     أفقيًّا لكلّ رقمٍ يُعدَّل. والبطاقة تحمل حقولها في شبكةٍ تنطوي. */

  h += '<div class="sec-h"><h2>المدخلات</h2>' +
       '<p>عدّلْ أيّ رقمٍ وشوف الأثر فورًا في الأعلى — ولا شيء يصل الشيت حتى تضغط «احفظ». ' +
       'والحجوزات الأسبوعية <b>لكلّ ملعبٍ فرعيّ</b> لا لكلّ مكان، و<b>متى تنضمّ</b> يقول متى ' +
       'تدخل الرياضةُ المنصّة فلا يُحسَب دخلُها قبله</p>' +
       '<button class="btn ghost sm sp" type="button" id="econSave"' + (S.econDirty ? '' : ' disabled') + '>' +
       icon('save') + 'احفظ في الشيت</button></div>';

  h += '<div class="grid g-2">' + S.econ.sports.map(function (s, i) {
    return '<div class="card"><div class="card-h"><h3>' + esc(s.name) + '</h3>' +

      '<div class="nf-grid">' +

      numField({ k: 'churn',    label: 'تسرّب الأماكن شهريًّا',      min: 0, max: 100, step: 1,    val: S.econ.churn * 100, pct: true, suffix: '٪' }) +
      numField({ k: 'newPlace', label: 'أماكن جديدة شهريًّا',        min: 0, max: 200, step: 1,    val: S.econ.newPlace }) +
    '</div></div>';

  /* ── التكاليف الحقيقية ─────────────────────────────────────────
     ما كان غائبًا عن اللوحة كلِّها: الرواتب والضمان والتسويق والإداري
     وبوّابة الدفع والضريبة. وبدونها كان الرقم المعروض «هامش مساهمة»
