  h += '<div class="card"><div class="card-h"><h3>الفريق والتسويق والإداري</h3>' +
    '<p>كلّها <b>مبالغُ شهرية</b> — و«السنة الأولى/الثانية» تعني الفترة التي تُستعمَل فيها لا مجموعَها</p></div>' +
    '<div class="nf-grid">' +
      numField({ k: 'salary1',   label: 'رواتب شهريًّا — السنة الأولى (د.أ)',   min: 0, max: 20000, step: 25, val: S.econ.salary1 }) +
      numField({ k: 'salary2',   label: 'رواتب شهريًّا — من السنة الثانية',      min: 0, max: 20000, step: 25, val: S.econ.salary2 }) +
      numField({ k: 'ssRate',    label: 'الضمان الاجتماعي على الشركة',   min: 0, max: 30, step: .25, val: S.econ.ssRate * 100, pct: true, suffix: '٪' }) +
      numField({ k: 'mkt1',      label: 'تسويق شهريًّا — السنة الأولى (د.أ)',   min: 0, max: 20000, step: 25, val: S.econ.mkt1 }) +
      numField({ k: 'mkt2',      label: 'تسويق شهريًّا — من السنة الثانية',      min: 0, max: 20000, step: 25, val: S.econ.mkt2 }) +
      numField({ k: 'admin',     label: 'إداري وقانوني شهريًّا (د.أ)',   min: 0, max: 5000, step: 5,  val: S.econ.admin }) +
      numField({ k: 'salesComm', label: 'عمولة مبيعات لكلّ مكان جديد',   min: 0, max: 500, step: 5,   val: S.econ.salesComm }) +
    '</div>' +
    '<div class="note" style="margin-top:10px">' + icon('info') + '<div id="ecExtra">' + econExtraNote(r) + '</div></div></div>';

  /* ── ③④ الطلبُ والتحصيل: ما كان النموذجُ لا يراه ──────────────────
     كان يفترض أنّ المكان يدخل بكامل حجوزاته يوم يوقّع، وأنّ كلّ دينارٍ
     يُحصَّل في شهره. والثلاثةُ **محايدةٌ افتراضًا** فلا يتحرّك رقمٌ قبل
     أن يُدخلها المالك — وقياسُها من ملاعبه السبعة أصدقُ من تقديرها. */
  h += '<div class="card"><div class="card-h"><h3>الطلب والتحصيل</h3>' +
    '<p>ما لم يكن النموذج يراه: <b>متى يمرّ الحجز عبرك فعلًا</b>، و<b>كم منه يصلك</b>. ' +
    'كلُّها اليوم على القيمة المحايدة (لا تغيّر شيئًا) — <b>قِسْها من ملاعبك السبعة</b> ثمّ أدخلها</p></div>' +
    '<div class="nf-grid">' +
      numField({ k: 'adopt0',      label: 'تبنٍّ في الشهر الأوّل للمكان',  min: 0, max: 100, step: 5, val: (S.econ.adopt0 == null ? 1 : S.econ.adopt0) * 100, pct: true, suffix: '٪' }) +
      numField({ k: 'adoptMax',    label: 'وإلى كم يصل',                  min: 0, max: 100, step: 5, val: (S.econ.adoptMax == null ? 1 : S.econ.adoptMax) * 100, pct: true, suffix: '٪' }) +
      numField({ k: 'adoptMonths', label: 'في كم شهرًا يصل إليه',          min: 0, max: 36, step: 1, val: S.econ.adoptMonths || 0 }) +
      numField({ k: 'leak',        label: 'تسريب: وجدك ثمّ حجز مباشرةً',   min: 0, max: 100, step: 1, val: (S.econ.leak || 0) * 100, pct: true, suffix: '٪' }) +
      numField({ k: 'collect',     label: 'نسبة ما تُحصّله فعلًا',          min: 0, max: 100, step: 1, val: (S.econ.collect == null ? 1 : S.econ.collect) * 100, pct: true, suffix: '٪' }) +
      numField({ k: 'collectDays', label: 'متوسّط أيام التحصيل',           min: 0, max: 180, step: 5, val: S.econ.collectDays || 0 }) +
    '</div>' +
    '<div class="note" style="margin-top:10px">' + icon('info') + '<div id="ecDemand">' + econDemandNote(r) + '</div></div></div>';

  h += '<div class="grid g-2">' +
    '<div class="card"><div class="card-h"><h3>بوّابة الدفع</h3>' +
      '<p>مطفأة اليوم — الدفع نقدًا في الملعب</p></div>' +
      '<div class="nf-grid">' +
        numField({ k: 'gwOn',   label: 'مفعّلة؟ (0 = لا · 1 = نعم)', min: 0, max: 1, step: 1, val: S.econ.gwOn }) +
        numField({ k: 'gwRate', label: 'نسبة عمولة البوّابة',        min: 0, max: 10, step: .1, val: S.econ.gwRate * 100, pct: true, suffix: '٪' }) +
      '</div>' +
      '<p class="hint" id="ecGw" style="margin-top:8px">' + econGwNote(r) + '</p></div>' +
    /* 🔴 «ضريبة الدخل» تُقرأ **التزامًا محسوبًا**، والرقم هنا نسبةٌ مسطّحة
       على الربح لا حسابَ ضريبةٍ حقيقيًّا: لا يعرف تصنيف الشركة ولا
       المصاريف المقبولة ولا الإهلاك ولا ترحيل الخسائر. والتسمية تقول
       ذلك بدل أن تقوله حاشيةٌ تحتها وحدها. */
    '<div class="card"><div class="card-h"><h3>ضريبة تقديرية</h3>' +
      '<p>نسبةٌ مسطّحة على ربح السنة — <b>ليست حساب ضريبةٍ حقيقيًّا</b></p></div>' +
      '<div class="nf-grid">' +
        numField({ k: 'taxRate', label: 'نسبة ضريبة الدخل السنوية', min: 0, max: 40, step: 1, val: S.econ.taxRate * 100, pct: true, suffix: '٪' }) +
      '</div>' +
      '<p class="hint" style="margin-top:8px">هذا <b>افتراضٌ مبدئيّ</b> حتى يؤكّده محاسبٌ مرخَّص: ' +
      'الضريبة الفعلية تعتمد على تصنيف الشركة والمصاريف المقبولة والإهلاك وترحيل الخسائر — ' +
      'ولا شيء من ذلك محسوبٌ هنا.</p></div>' +
  '</div>';

  h += '<div class="note">' + icon('info') + '<div>الحجوزات الشهرية = الأسبوعية × ٥٢ ÷ ١٢ (لا × ٤ — الشهر ٤٫٣٣ أسبوع). ' +
       'والنسب والسقف <b>مقروءةٌ من نموذج العمل</b> فاستحال أن تختلف عن حاسبة صاحب الملعب.</div></div>';

  h += '</div>';
  return h;
}

/* ── قطعٌ تُبنى مرّةً ويُعاد بناؤها موضعيًّا، فلا تنحرف نسختان ── */
function econHeroDesc(r) {
  return 'دخلٌ ' + n0(r.revenue) + ' ناقصَ تشغيلٍ ' + n0(r.costs) +
         ' وناقصَ فريقٍ وتسويقٍ ' + n0(r.extra1) +
         (r.gwFee ? ' وبوّابةِ دفعٍ ' + n0(r.gwFee) : '') + '. ' +
         '<b>قبل ضريبة الدخل</b> — وهي سنويةٌ لا شهرية، فانظر صافي السنوات الأربع أدناه.';
}
function econPathSub() {
  return '+' + n0(S.econ.newPlace) + ' مكان شهريًّا · تسرّب ' + pct(S.econ.churn, 0);
}
function econExtraNote(r) {
  return '<b>التكاليف الإضافية:</b> السنة الأولى ' + n0(r.extra1) + ' د.أ شهريًّا · ' +
         'من الثانية ' + n0(r.extra2) + ' د.أ — شاملةً الضمان (' + n0(r.ss1) + ' ثمّ ' + n0(r.ss2) + ') ' +
         'وعمولة المبيعات عن الأماكن الجديدة.';
}
/* ── حاشيةُ الطلب والتحصيل ─────────────────────────────────────────
   تقول **ما هو مطفأ** بالاسم لا «كل شيء تمام»: مِعلَمٌ محايدٌ صامت يُقرأ
   «النموذج يعدّه» وهو لا يعدّه. */
function econDemandNote(r) {
  var e = S.econ, out = [];
  var a0 = (e.adopt0 == null ? 1 : e.adopt0), aM = (e.adoptMax == null ? 1 : e.adoptMax);
  var co = (e.collect == null ? 1 : e.collect);

  if (a0 >= 1 && aM >= 1) out.push('<b>التبنّي مطفأ</b> — كلُّ مكانٍ يدخل بكامل حجوزاته من شهره الأوّل');
  else out.push('التبنّي ' + pct(a0, 0) + ' ⇐ ' + pct(aM, 0) +
                (e.adoptMonths ? ' خلال ' + monthsNoun(e.adoptMonths) : ' فورًا') +
                ' — <b>والرياضةُ التي على المنصّة اليوم تدخل ناضجةً</b>، فحجوزاتُها مقروءةٌ من واقعها');

  out.push(e.leak ? 'وتسريبٌ ' + pct(e.leak, 0) + ' يخرج قبل أن تُحسَب عليه عمولة'
                  : '<b>ولا تسريب</b> — أي أنّ من وجدك عبرنا لن يحجز مباشرةً أبدًا');

  if (co >= 1 && !e.collectDays) out.push('<b>والتحصيل فوريٌّ وكامل</b> — وأنت دائنٌ لأصحاب الملاعب بعمولةٍ قبضوا ثمنها نقدًا');
  else out.push('وتحصيلٌ ' + pct(co, 0) + (e.collectDays ? ' بعد ' + daysNoun(e.collectDays) : '') +
                ' — والتأخيرُ يزحزح <b>النقد لا الربح</b>، فأثرُه في «أقصى نقدٍ يلزمك» وحده');

  return out.join('. ') + '.';
}
function econGwNote(r) {
  return r.gwFee
    ? 'مفعّلة: ' + n0(r.gwFee) + ' د.أ شهريًّا — على قيمة الحجوزات كاملةً لا على عمولتك.'
    : 'مطفأة ⇒ صفر تكلفة. فعّلها يوم تُوصَل بوّابة دفعٍ فعلية.';
}
/* ── رقمٌ في الدفتر ─────────────────────────────────────────────────
   `sign = -1` يعني «هذا بندُ خروج» فيُعرَض سالبًا وإن كانت قيمتُه موجبة
   في النموذج — والصفر يُكتب صفرًا لا «-0». وغيرُ الرقم شرطةٌ لا صفر:
   «لا رقم لهذا هنا» غيرُ «قيمتُه صفر». */
function ldgMoney(v, sign) {
  if (!isNum(v)) return '—';
  var x = Math.round(v);
  if (x === 0) return '0';
  return (sign === -1 || x < 0 ? '-' : '') + n0(Math.abs(x));
}

/**
 * الملخّص الشامل — ثلاثة صناديق ثمّ دفترٌ بثلاثة أعمدة.
 * الأرقام كلُّها من `econLedger` **بنداءٍ واحد**، فلا ينحرف صندوقٌ عن
 * سطرٍ تحته كما ينحرف رقمان يُحسَبان مرّتين.
 */
function econSummaryHTML(r, t) {
  var g = econLedger(S.econ, t, r);

  var vc = function (v, sign, cls, auto) {
    var c = cls || '';
    if (auto) c = v < 0 ? 'neg' : 'pos';
    if (!isNum(v)) c = 'dim';
    return '<span class="ldg-v' + (c ? ' ' + c : '') + '">' + ldgMoney(v, sign) + '</span>';
  };
  var row = function (o) {
    return '<div class="ldg-r' + (o.cls ? ' ' + o.cls : '') + '">' +
      '<span class="ldg-k l' + (o.lvl || 3) + '">' + esc(o.l) +
        (o.h ? '<i>' + esc(o.h) + '</i>' : '') + '</span>' +
      vc(o.m, o.sign, o.vcls, o.auto) +
      (o.y || []).map(function (v) { return vc(v, o.sign, o.vcls, o.auto); }).join('') +
      '</div>';
  };
  var line = function (x, sign) {
    return row({ l: x.l, h: x.h, m: x.m, y: x.y, sign: sign, lvl: 3 });
  };

  /* ── الصناديق الثلاثة: الوحدتان الكبيرتان ثمّ حاصلُهما ── */
  var YR = ['السنة الأولى', 'الثانية', 'الثالثة', 'الرابعة'];
  var box = function (cls, label, val, desc, ys, sign) {
    return '<div class="ldg-box ' + cls + '">' +
      '<span class="b-l">' + esc(label) + '</span>' +
      '<span class="b-v"><span class="numP">' + val + '</span><span class="u">د.أ</span></span>' +
      '<span class="b-d">' + esc(desc) + '</span>' +
      '<span class="b-y">' + ys.map(function (v, i) {
        return '<span>' + esc(YR[i] || ('السنة ' + (i + 1))) +
               ' <b class="num">' + ldgMoney(v, sign) + '</b></span>';
      }).join('') + '</span></div>';
  };

  /* 🔴 صندوقان لا ثلاثة: «الصافي» هو رقم البطل أعلى الصفحة حرفيًّا،
     وعرضُه هنا ثانيةً يجعل الشاشة تقول الرقم نفسه مرّتين. وصافي السنوات
     في بلاطته، وصافي كلّ سنةٍ في سطر الدفتر تحت — فلا شيء ضاع. */
  var h = '<div class="ldg-boxes">' +
    box('in',  'الدخل',    ldgMoney(g.incomeT.m),   'شهريًّا — عمولةٌ واشتراكات',
        g.incomeT.y) +
    box('out', 'المصاريف', ldgMoney(g.costT.m, -1), 'شهريًّا — ثابتةٌ ومتغيّرة معًا',
        g.costT.y, -1) +
  '</div>';

  /* ── الدفتر ──
     ⚠️ داخل `.tbl-wrap`: ستّة أعمدة (بندٌ + شهرٌ + أربع سنوات) لا تسع
        شاشةَ ٣٧٥px، والتمرير الأفقي **داخل الدفتر** لا على المستند. */
  h += '<div class="tbl-wrap"><div class="ldg ldg-y' + g.years + '">';
  h += '<div class="ldg-r ldg-h"><span class="ldg-k l1">البند</span>' +
       '<span class="ldg-v">الشهر الأوّل</span>' +
       g.net.y.map(function (v, i) {
         return '<span class="ldg-v">' + esc(YR[i] || ('السنة ' + (i + 1))) + '</span>';
       }).join('') + '</div>';

  h += row({ cls: 'ldg-g in', lvl: 1, l: 'الدخل', h: 'كلّ ما يدخل — قبل أيّ مصروف',
             m: g.incomeT.m, y: g.incomeT.y, vcls: 'pos' });
  g.income.forEach(function (x) { h += line(x, 1); });

  h += row({ cls: 'ldg-g out', lvl: 1, l: 'المصاريف', h: 'كلّ ما يخرج — المتغيّرة والثابتة معًا',
             m: g.costT.m, y: g.costT.y, sign: -1, vcls: 'neg' });
  h += row({ cls: 'ldg-sg', lvl: 2, l: 'متغيّرة', h: 'تكبر مع الحجوزات ومع الأماكن الجديدة',
             m: g.varT.m, y: g.varT.y, sign: -1 });
  g.varc.forEach(function (x) { h += line(x, -1); });
  h += row({ cls: 'ldg-sg', lvl: 2, l: 'ثابتة', h: 'لا تتغيّر بعدد الحجوزات',
             m: g.fixT.m, y: g.fixT.y, sign: -1 });
  g.fixc.forEach(function (x) { h += line(x, -1); });

  h += row({ cls: 'ldg-g net', lvl: 1, l: 'الصافي قبل الضريبة', h: 'الدخل ناقصَ المصاريف — وهو «الربح التشغيلي» في بطاقة الأعلى',
             m: g.pre.m, y: g.pre.y, auto: true });
  h += row({ lvl: 3, l: 'ضريبة تقديرية',
             h: 'نسبةٌ مسطّحة على ربح كلّ سنة — تقديرٌ لا حساب ضريبة، ولا ضريبة على خسارة ولا ترحيلَ لها',
             m: g.tax.m, y: g.tax.y, sign: -1, vcls: 'neg' });
  h += row({ cls: 'ldg-g net fin', lvl: 1, l: 'الصافي بعد الضريبة',
             h: 'الرقم الذي تُبنى عليه القرارات',
             m: g.net.m, y: g.net.y, auto: true });
  h += '</div></div>';

  return h;
}

/**
 * حقلُ «متى تنضمّ» — يُنشِئ نفس ما يُنشئه `numField()` بنيةً (`data-nf`
 * وأزرارَ `.nf-step` وحقل `.nf-val`) كي يلتقطه `wireNumFields` بلا كودٍ
 * خاصّ، ومعه صفٌّ من زرَّي وحدة («أشهر»/«أيام») لا حقلٌ آخر ولا نافذة.
 *
 * القيمةُ المخزَّنة `s.start` **شهرٌ صحيحٌ دائمًا** (١ = اليوم)؛ وحدةُ
 * العرض عرضٌ محض تُقرأ من `S.econUnits[i]` ولا تُكتب إلى الشيت أبدًا —
 * فتبديلها لا يُبدّل شهر الانضمام الحقيقي، هو محسوبٌ منه دائمًا.
 */
function startField(i, s) {
  var unit = (S.econUnits[i] === 'days') ? 'days' : 'months';
  var val  = unit === 'days' ? startToDelayDays(s.start) : startToDelayMonths(s.start);
  var step = unit === 'days' ? 5 : 1;
  var max  = unit === 'days' ? 1460 : 48;  /* نفس أفق مسار ٤٨ شهرًا */
  var key  = 'sp' + i + '.startDelay';
  /* 🔴 لا حاجةَ إلى ترجمةٍ حيّةٍ لشهر «الآن» — الشارة أعلى البطاقة
     (`#ecWhen{i}`) تقول ذلك بالضبط وتتحدّث مع كل حرف عبر `repaintEcon`،
     وهذا الحقل لا يُعاد بناؤه إلّا بتبديل الوحدة أو تنقّلٍ كامل. فحاشيةٌ
     هنا تُكتَب مرّةً وتبقى معروضةً بعد أن يكتب المستخدم رقمًا آخر تكذب
     صامتةً — نفس عائلة «رقمان لحقيقةٍ واحدة» المحظورة في هذا المشروع.
     والحاشية الثابتة هنا **لا تعتمد على `s.start`** فلا تبلى أبدًا:
     تشرح لماذا اليوم يُقرَّب لا تقول رقم الشهر الحيّ (ومصدره الشارة). */
  var hint = unit === 'days' ? 'يُقرَّب لأقرب شهرٍ — دقّة المسار شهرية لا يومية' : '';
  return '<div class="nf" data-nf="' + esc(key) + '" data-min="0" data-max="' + max +
      '" data-step="' + step + '" data-dec="0">' +
    '<div class="nf-top"><label>متى تنضمّ؟</label>' +
      '<span class="sp" style="display:flex;gap:6px">' +
        '<button class="chip' + (unit === 'months' ? ' on' : '') +
          '" type="button" data-startunit="months" data-si="' + i + '">أشهر</button>' +
        '<button class="chip' + (unit === 'days' ? ' on' : '') +
          '" type="button" data-startunit="days" data-si="' + i + '">أيام</button>' +
      '</span></div>' +
    '<div class="nf-row">' +
      '<button class="nf-step" type="button" data-d="-1" aria-label="أنقص">' + icon('minus') + '</button>' +
      '<input class="nf-val" type="text" autocomplete="off" spellcheck="false" inputmode="numeric" value="' + esc(val) + '">' +
      '<span class="nf-suffix">' + (unit === 'days' ? 'يوم' : 'شهر') + '</span>' +
      '<button class="nf-step" type="button" data-d="1" aria-label="زِد">' + icon('plus') + '</button>' +
    '</div>' +
    (hint ? '<span class="hint">' + esc(hint) + '</span>' : '') +
  '</div>';
}

/** المعالج المشترك لكلّ حقول اقتصاديات المنصة — بما فيها حقل «متى تنضمّ»
 *  الذي يحمل قيمةً بوحدة العرض الحالية (يومًا أو شهرًا) ويُترجَم إلى
 *  `start` قبل أن يُكتب، فلا يخزَّن التأخيرُ نفسه في مكانين. */
function econFieldChange(k, v) {
  var m = /^sp(\d+)\.(\w+)$/.exec(k);
  if (m) {
    var i = Number(m[1]), field = m[2];
    if (field === 'startDelay') {
      var unit = (S.econUnits[i] === 'days') ? 'days' : 'months';
      S.econ.sports[i].start = unit === 'days' ? delayDaysToStart(v) : delayMonthsToStart(v);
    } else {
      S.econ.sports[i][field] = v;
    }
  } else {
    S.econ[k] = v;
  }
  S.econDirty = true;
  repaintEcon();
}

/** أزرار «أشهر/أيام»: تبديل وحدة العرض وحدها — تستبدل حقل «متى تنضمّ»
 *  بنسخةٍ من نفس الوحدة الجديدة (نفس `start`، رقمٌ مختلف) وتُعيد وصل
 *  الحقول داخل تلك البطاقة، إذ لا `repaintEcon` يلمس حقول الإدخال
 *  (وإلّا فقد أيّ رقمٍ آخر تحت الكتابة تركيزَه). */
function wireStartUnit(root) {
  $$('[data-startunit]', root).forEach(function (btn) {
    btn.onclick = function () {
      var i = Number(btn.dataset.si);
      S.econUnits[i] = btn.dataset.startunit;
      var card = btn.closest('.card');
      var old  = card.querySelector('[data-nf="sp' + i + '.startDelay"]');
      if (!old) return;
      var tmp = document.createElement('div');
      tmp.innerHTML = startField(i, S.econ.sports[i]);
      old.replaceWith(tmp.firstElementChild);
      wireNumFields(card, econFieldChange);
      wireStartUnit(card);
    };
  });
}

/* صفٌّ في بطاقةٍ بعمودين — نفس مكوّن الدفتر (`.ldg-2`) لا مكوّنٌ ثانٍ. */
function ecoRow(label, value, hint, cls) {
  return '<div class="ldg-r"><span class="ldg-k l3">' + esc(label) +
    (hint ? '<i>' + esc(hint) + '</i>' : '') + '</span>' +
    '<span class="ldg-v' + (cls ? ' ' + cls : '') + '">' + value + '</span></div>';
}

/**
 * اقتصاديات المكان الواحد — تكلفةُ اكتسابه وقيمتُه العمرية.
 * 🔴 والغياب يُقال بسببه لا بشرطةٍ صامتة: مقلوبُ تسرّبٍ صفرٍ ما لا نهاية،
 *    و«عمرٌ أبديّ» كذبةٌ بشكل رقم — فتُخفى القيمة ويُكتب لماذا.
 */
function econUnitRows(r) {
  var h = '<div class="ldg ldg-2">';

  /* 🔴 **حدٌّ أعلى لا رقمٌ دقيق**: التسويق في الورقة موصوفٌ بأنّه «إعلانات
     لجلب اللاعبين» لا لجلب الملاعب، وتحميلُه كلَّه على اكتساب المكان
     يضخّم التكلفة. وهذا مقصود: إن صحّت النسبة عند الحدّ الأعلى فهي
     أصحّ دونه — أمّا رقمٌ أصغر أخترعه أنا فتقديرٌ بلباس قياس. */
  h += ecoRow('تكلفة اكتساب المكان', isNum(r.cac) ? n0(r.cac) + ' د.أ' : '—',
              isNum(r.cac) ? 'حدٌّ أعلى: عمولة المبيعات + كامل تسويق الشهر على الأماكن الجديدة — والتسويق موصوفٌ لجلب اللاعبين لا الملاعب'
                           : 'يلزمها «أماكن جديدة شهريًّا» أكبر من صفر',
              isNum(r.cac) ? 'neg' : 'dim');

  /* ⚠️ ومقلوبُ التسرّب قد يتجاوز أفق النموذج نفسَه (٤٨ شهرًا): تسرّبُ
     ١٪ يعني عمرًا مئةَ شهر — رقمٌ لا يسنده شيءٌ في هذا الملفّ، فيُقال
     تجاوزُه بدل أن يُقرأ قياسًا. */
  h += ecoRow('كم يبقى معك', isNum(r.lifeMonths) ? n1(r.lifeMonths) + ' شهرًا' : '—',
              isNum(r.lifeMonths)
                ? ('١ ÷ التسرّب الشهري' + (r.lifeMonths > 24
                    ? ' — وهو أطول من أفق النموذج (٤٨ شهرًا)، فيقوم كلُّه على تقديرك للتسرّب'
                    : ''))
                : 'بتسرّبٍ صفر لا عمرَ يُحسَب — يبقى إلى الأبد',
              isNum(r.lifeMonths) ? '' : 'dim');

  h += ecoRow('قيمته العمرية', isNum(r.ltv) ? n0(r.ltv) + ' د.أ' : '—',
              'مساهمته الشهرية × عمره — قبل التكاليف الثابتة' +
              (isNum(r.lifeMonths) && r.lifeMonths > 24 ? '، وعمرُه فوق أفق النموذج' : ''),
              isNum(r.ltv) ? 'pos' : 'dim');

  /* ⭐ «القيمة ÷ التكلفة» تقول *هل* يستحقّ المكان ثمنه، وهذه تقول *متى*
     يعود المال — وهو السؤال الذي يقرّر عليه من يموّل من جيبه. والمقام
     **المساهمة** لا الدخل: ما يبقى من المكان بعد متغيّراته وحدها. */
  h += ecoRow('يردّ ثمنه بعد', isNum(r.cacPayback) ? n1(r.cacPayback) + ' شهرًا' : '—',
              isNum(r.cacPayback)
                ? ('تكلفة اكتسابه ÷ ما يعطيه شهريًّا (' + n0(r.contribPerPlace) + ' د.أ)' +
                   (isNum(r.lifeMonths) && r.cacPayback > r.lifeMonths
                      ? ' — 🔴 وهو أطول من عمره معك، أي أنّه يخرج قبل أن يسدّد ثمنه'
                      : ''))
                : 'يلزمها تكلفةُ اكتسابٍ ومساهمةٌ شهرية أكبر من صفر',
              isNum(r.cacPayback)
                ? (isNum(r.lifeMonths) && r.cacPayback > r.lifeMonths ? 'neg' : 'pos')
                : 'dim');

  var ratio = r.ltvOverCac;
  h += '<div class="ldg-r ldg-g net fin"><span class="ldg-k l1">القيمة ÷ التكلفة' +
       '<i>' + esc(isNum(ratio)
         ? (ratio >= 3 ? 'ثلاثةٌ فأعلى مريح · بين ١ و٣ يعمل ويضيق · أقلّ من ١ تدفع أكثر ممّا تكسب'
                       : 'أقلّ من ٣ — راقبْ تكلفة الاكتساب والتسرّب')
         : 'يلزمها تسرّبٌ وأماكنُ جديدة أكبر من صفر') + '</i></span>' +
       '<span class="ldg-v ' + (isNum(ratio) ? (ratio >= 1 ? 'pos' : 'neg') : 'dim') + '">' +
       (isNum(ratio) ? n1(ratio) + '×' : '—') + '</span></div>';

  return h + '</div>';
}

/** التعادل بثلاثة مقاييس، ومعه النقد اللازم للوصول إليه. */
function econBreakRows(r) {
  var h = '<div class="ldg ldg-2">';

  /* ⭐ **المقام قبل القسمة.** كلُّ صفوف التعادل تحته تقسم عليه، وكان
     محسوبًا داخلها ولا يُعرَض رقمًا — فيُقرأ «تتعادل عند ٣٨ مكانًا»
     نتيجةً بلا سبب. وإظهارُه يجعل الثلاثة تُقرأ سلسلةً واحدة. */
  /* ⚠️ منزلةٌ عشرية لا صفر: المصاريف المتغيّرة عندك ضئيلة اليوم، و`pct(…,0)`
     تُخرج «100٪» فتُقرأ قيمةً نائبة لم تُحسَب بعد — والصادقُ «99.7٪». */
  /* ⚠️ و«١٠٠٪» هنا قد تكون **صادقة**: مصاريفك المتغيّرة اليوم صفر فعلًا
     (الرسائل بلا كلفة · البوّابة مطفأة · عمولة المبيعات صفر). وسطرٌ يقول
     ذلك يمنع أن تُقرأ النسبةُ رقمًا لم يُحسَب — وهو الالتباس الوحيد الذي
     يصنعه رقمٌ مستديرٌ تمامًا. */
  h += ecoRow('يبقى من كلّ دينار', isNum(r.contribMargin) ? pct(r.contribMargin, 1) : '—',
              (r.contribution >= r.revenue - 1e-9
                 ? 'كلُّه — لأنّ مصاريفك المتغيّرة اليوم صفر (الرسائل والبوّابة وعمولة المبيعات). ' +
                   'أي أنّ ' + n0(r.contribution) + ' د.أ كلَّها تذهب لتغطية الثابت'
                 : 'الدخل ناقصَ المصاريف التي تكبر معه (رسائل · بوّابة · عمولة مبيعات) — ' +
                   'وهو ' + n0(r.contribution) + ' د.أ شهريًّا، منها يُدفع الثابت'),
              'pos');

  /* ⚠️ المقامُ يُقال بالرقم لا يُوصَف: «التكاليف الثابتة» وصفٌ يقرؤه القارئ
     شاملًا وكان يعني البنية التحتية وحدها (٤٠ من ١٩٣٢) — والوصفُ العامّ
     هو الذي غطّى العطل أربع دفعات. */
  h += ecoRow('تتعادل عند', isNum(r.breakEvenPlaces) ? n1(r.breakEvenPlaces) + ' مكانًا' : '—',
              'ثابتُك الشهري كلُّه (' + n0(r.breakEvenFixed) + ' د.أ — بنيةٌ ورواتبُ وضمانٌ ' +
              'وتسويقٌ وإداريّ) ÷ مساهمة المكان الواحد');
  h += ecoRow('وهي تساوي', isNum(r.breakEvenBookings) ? n0(r.breakEvenBookings) + ' حجزة شهريًّا' : '—',
              'المكان وحده لا يصف شيئًا — مكانٌ بإشغالٍ ضعيف غيرُ مكانٍ ممتلئ');
  h += ecoRow('وقيمةَ حجوزات', isNum(r.breakEvenGmv) ? n0(r.breakEvenGmv) + ' د.أ' : '—',
              'ما يمرّ عبر المنصّة لا ما تقبضه أنت');

  h += ecoRow('أوّل شهرٍ موجب', r.breakEvenMonth ? 'الشهر ' + n0(r.breakEvenMonth) : '—',
              r.breakEvenMonth ? 'أوّل شهرٍ يغطّي فيه دخلُك تكاليفَه كلَّها'
                               : 'لا يتعادل داخل الأربع سنوات بهذه الأرقام',
              r.breakEvenMonth ? 'pos' : 'dim');

  /* 🔴 أهمّ رقمٍ لمن يموّل من جيبه: أعمقُ نقطةٍ يبلغها التراكمي. */
  h += '<div class="ldg-r ldg-g net"><span class="ldg-k l1">أقصى نقدٍ يلزمك' +
       '<i>' + esc(r.cashNeeded > 0
         ? 'أعمق نقطةٍ يبلغها التراكمي — في الشهر ' + n0(r.cashNeededMonth)
         : 'لا يهبط تحت الصفر قطّ بهذه الأرقام') + '</i></span>' +
       '<span class="ldg-v ' + (r.cashNeeded > 0 ? 'neg' : 'pos') + '">' +
       (r.cashNeeded > 0 ? n0(r.cashNeeded) + ' د.أ' : 'لا شيء') + '</span></div>';

  h += ecoRow('تسترد ما وضعتَه', r.paybackMonth ? 'الشهر ' + n0(r.paybackMonth) : '—',
              r.paybackMonth ? 'حين يعود التراكمي إلى الموجب'
                             : 'لا يسترد داخل الأربع سنوات بهذه الأرقام',
              r.paybackMonth ? 'pos' : 'dim');

  h += '</div>' + econCashOutRows(r);
  return h;
}

/* ── ⭐ المال الذي حُسب دخلًا ولم يصل الجيب ────────────────────────
   حقيقتان مختلفتان تمامًا كان يخلطهما رقمٌ واحد:
     • **معلّق** — لك، ويصل بعد أيام. تأخيرُ توقيتٍ لا خسارة.
     • **لن يصل** — خرج من الربح أصلًا (نسبة التحصيل). خسارةٌ لا تأخير.
   وخلطُهما يجعل التأخير يبدو ضياعًا والضياعَ يبدو تأخيرًا، والقرار على
   كلٍّ منهما مختلف: الأوّل يُعالَج بجيبٍ أوسع، والثاني بطريقة تحصيلٍ أخرى.
   ⚠️ **ولا يُعرَض اللوح ما دام النموذج على التحصيل الفوريّ الكامل**:
      صفّان بصفرٍ في كلّ فتحةٍ ضجيجٌ لا معلومة — ومحلُّهما سطرٌ يقول
      كيف يُملآن، فتُعرَف الميزة ولا تُشغَل الشاشة. */
function econCashOutRows(r) {
  var lag  = Number(S.econ.collectDays) || 0;
  var coll = (S.econ.collect == null) ? 1 : Number(S.econ.collect);
  if (!(lag > 0) && !(coll < 1)) {
    return '<p class="hint" style="margin-top:12px">النموذج اليوم يفترض أنّ ' +
             '<b>كلّ دينارٍ يصلك كاملًا وفي شهره</b>. عدّلْ «نسبة ما تُحصّله» و«متوسّط ' +
             'أيام التحصيل» في بطاقة «الطلب والتحصيل» أدناه ليظهر هنا ما هو معلّق ' +
           'عند أصحاب الملاعب وما لن يصلك أصلًا.</p>';
  }

  var h = '<div class="ldg ldg-2" style="margin-top:14px">';
  h += '<div class="ldg-r ldg-sg"><span class="ldg-k l1">من الدخل إلى الجيب' +
       '<i>الفرق بين ما تحسبه دخلًا وما تقبضه فعلًا</i></span>' +
       '<span class="ldg-v"></span></div>';

  if (lag > 0) {
    h += ecoRow('معلّقٌ عندهم الآن', n0(r.arNow) + ' د.أ',
                'دخلٌ اعترفتَ به ولم يصل بعد — مالُك، ويصل خلال ' + n0(lag) + ' يومًا وسطيًّا',
                r.arNow > 0 ? 'warn' : 'dim');
    h += ecoRow('وأعلى ما يبلغه', n0(r.arPeak) + ' د.أ',
                r.arPeakMonth ? 'في الشهر ' + n0(r.arPeakMonth) +
                                ' — وهذا ما يجب أن يحتمله جيبك فوق «أقصى نقدٍ يلزمك»'
                              : 'لا يتراكم شيء',
                r.arPeak > 0 ? 'warn' : 'dim');
  }
  if (coll < 1) {
    /* «د.أ» وحدها تمرّ (كلمةٌ واحدة في طرف الرقم)، أمّا «د.أ شهريًّا»
       فكلمتان تُقلبان — والدورية تُقال في السطر الخفيف. */
    h += ecoRow('ولن يصلك أصلًا شهريًّا', n0(r.badDebtNow) + ' د.أ',
                'من نسبة التحصيل (' + pct(coll, 0) + ') — خسارةٌ لا تأخير، ومطروحةٌ من الربح أعلاه',
                r.badDebtNow > 0 ? 'neg' : 'dim');
  }
  return h + '</div>';
}

/** جدولُ السيناريوهات — البند وثلاثة أعمدة. */
function econScenRows(r, t) {
  var sc = econScenarios(S.econ, t, {
    weekly: S.econ.devWeekly, churn: S.econ.devChurn, newPlace: S.econ.devNewPlace
  });

  var cell = function (v, cls) {
    return '<span class="ldg-v' + (cls ? ' ' + cls : '') + '">' + v + '</span>';
  };
  var row = function (label, hint, fmt, key, cls) {
    return '<div class="ldg-r"><span class="ldg-k l3">' + esc(label) +
      (hint ? '<i>' + esc(hint) + '</i>' : '') + '</span>' +
      cell(fmt(sc.bad[key]), cls) + cell(fmt(sc.base[key]), cls) + cell(fmt(sc.good[key]), cls) + '</div>';
  };
  var money = function (v) { return isNum(v) ? n0(v) : '—'; };
  var month = function (v) { return v ? 'الشهر ' + n0(v) : 'لا يتعادل'; };

  var h = '<div class="ldg">';
  h += '<div class="ldg-r ldg-h"><span class="ldg-k l1">البند</span>' +
       '<span class="ldg-v">متشائم</span><span class="ldg-v">أساسي</span><span class="ldg-v">متفائل</span></div>';

  h += row('الأماكن بعد ١٢ شهرًا', '', function (v) { return n0(v); }, 'places12');
  h += row('دخل السنة الأولى', 'مجموع اثني عشر شهرًا من المسار', money, 'y1Revenue');
  h += row('صافي السنة الأولى', 'بعد الضريبة', money, 'y1Net');

  h += '<div class="ldg-r ldg-g net"><span class="ldg-k l1">صافي السنوات الأربع' +
       '<i>بعد الضريبة</i></span>' +
       cell(money(sc.bad.allYearsNet), sc.bad.allYearsNet < 0 ? 'neg' : 'pos') +
       cell(money(sc.base.allYearsNet), sc.base.allYearsNet < 0 ? 'neg' : 'pos') +
       cell(money(sc.good.allYearsNet), sc.good.allYearsNet < 0 ? 'neg' : 'pos') + '</div>';

  h += row('أوّل شهرٍ موجب', '', month, 'breakEvenMonth');
  h += row('أقصى نقدٍ يلزمك', 'أعمق نقطةٍ في التراكمي', money, 'cashNeeded', 'neg');
  h += row('القيمة ÷ التكلفة', 'قيمةُ المكان العمرية على تكلفة اكتسابه',
           function (v) { return isNum(v) ? n1(v) + '×' : '—'; }, 'ltvOverCac');

  return h + '</div>' + scenAssumeHTML();
}

/* ── ⭐ الافتراض قبل النتيجة ───────────────────────────────────────
   جدولٌ فيه «متفائل: ٩٤٠٠٠» لا يقول ما الذي يجب أن يقع كي يصل إليه —
   فيُقرأ أمنيةً. وهذه تكتب الشرط بالأرقام: «حجوزات ٢٥ بدل ٢٠ · أماكن
   جديدة ٧ بدل ٥ · تسرّب ١٫٢٪ بدل ٢٪». وحينها يعرف القارئ **ماذا يفعل**
   لا كم يتمنّى.
   ⚠️ **والأرقام مشتقّةٌ من `scenarioInput` نفسِها** لا محسوبةً هنا ثانيةً:
      نسخةٌ ثانية من المعادلة تنحرف عن الجدول فوقها أوّلَ تعديل.
   ⚠️ والحجوزات تُذكَر عن **أكبر رياضةٍ عندك بالأماكن** لا عن كلّ رياضة:
      خمسةُ أسطرٍ لمعنًى واحد ضجيج، والنسبة واحدةٌ على الجميع فيكفي مثال. */
function scenAssumeHTML() {
  var dev = { weekly: S.econ.devWeekly, churn: S.econ.devChurn, newPlace: S.econ.devNewPlace };
  var base = S.econ;

  /* أكبر رياضةٍ بالأماكن — وهي التي يعرفها المالك بالاسم */
  var bi = -1, bp = 0;
  (base.sports || []).forEach(function (x, i) {
    if ((Number(x.places) || 0) > bp) { bp = Number(x.places) || 0; bi = i; }
  });

  var line = function (dir, title, cls) {
    var alt = scenarioInput(base, dev, dir);
    var bits = [];
    if (bi >= 0) {
      bits.push('حجوزات «' + esc(base.sports[bi].name) + '» الأسبوعية <b class="num">' +
                n1(alt.sports[bi].weekly) + '</b> بدل <b class="num">' +
                n1(base.sports[bi].weekly) + '</b>');
    }
    bits.push('أماكن جديدة <b class="num">' + n1(alt.newPlace) +
              '</b> بدل <b class="num">' + n1(base.newPlace) + '</b>');
    bits.push('تسرّب <b class="num">' + pct(alt.churn, 1) +
              '</b> بدل <b class="num">' + pct(base.churn, 1) + '</b>');
    return '<p class="scen-if ' + cls + '"><b>' + title + '</b> ' + bits.join('  ·  ') + '</p>';
  };

  return '<div class="scen-ifs">' +
    line(1,  'المتفائل يقع إذا:', 'good') +
    line(-1, 'والمتشائم إذا:',    'bad') +
    '</div>';
}

/* ── ⭐ حصّتك من السوق ─────────────────────────────────────────────
   `maxPlaces` مُدخَلٌ في كلّ بطاقة رياضة منذ دفعاتٍ ويقصّ به المسارُ نموَّه،
   ولا يُعرَض منه رقمٌ يقرؤه أحد. و«معك ٧ مكانًا» لا تصف شيئًا وحدها؛
   «٧ من ٥٠٠» تصف موضعك من الطريق.
   🔴 **والمقام تقديرُك أنت لا رقمٌ مقيس** — ويُقال ذلك في البطاقة نفسها،
      وإلّا قُرئت النسبةُ قياسًا وهي قسمةٌ على رقمٍ كتبتَه بيدك.
   ⚠️ ولا تدخل المقامَ رياضةٌ بلا سقف: «صفر» هناك تعني «لا أعرف حجم
      سوقها» لا «سوقها صفر»، وعدُّها يضخّم حصّتك.
   ⚠️ ولا تُعرَض البطاقة أصلًا إن لم تُصرّح رياضةٌ واحدة بسقف — بطاقةٌ
      تقول «—» في كلّ سطرٍ أسوأ من غيابها. */
function econMarketHTML(r) {
  var mk = r.market;
  if (!mk) return '';

  /* 🔴 **لا كلمةَ عربية في خانة القيمة.** `.ldg-v` اتّجاهُها `ltr` (كي
     تتحاذى الآحاد)، فـ«٢٥ من ٥٠٠ · ٥٪» خرجت معكوسةً على الشاشة:
     «٪من ٥٠٠ · ٢٥ ٥٫٠». وهو مزلق bidi المسجَّل حرفيًّا في هذا المشروع.
     فالخانة نسبةٌ صرفة — وهي المقارَنة الوحيدة الصالحة بين الصفوف —
     والعددان الخامان في السطر الخفيف تحت الاسم، حيث اتّجاه السطر عربيّ. */
  var h = '<div class="ldg ldg-2">';
  mk.sports.forEach(function (x) {
    h += ecoRow(x.name, pct(x.share, 1),
                (x.live
                   ? 'معك ' + placesNoun(x.have) + ' من سقفٍ قدره ' + n0(x.cap) + ' — على المنصّة اليوم'
                   : 'سقفُها ' + n0(x.cap) + ' مكانًا، وتنضمّ في الشهر ' + n0(x.start) +
                     ' — فحصّتُها اليوم صفر وسوقُها كلُّه أمامك'),
                x.live && x.have ? '' : 'dim');
  });
  h += '<div class="ldg-r ldg-g net fin"><span class="ldg-k l1">حصّتك من السوق' +
       '<i>' + esc('معك ' + placesNoun(mk.have) + ' من مجموع سقوفٍ قدرها ' + n0(mk.cap) +
         (mk.uncapped ? ' — و' + countNoun(mk.uncapped, 'رياضةٌ واحدة', 'رياضتان', 'رياضات', 'رياضة') +
                        ' بلا سقفٍ مُدخَل فهي خارج الحساب' : '')) + '</i></span>' +
       '<span class="ldg-v ' + (mk.share > 0 ? 'pos' : 'dim') + '">' +
       pct(mk.share, 1) + '</span></div>';
  return h + '</div>';
}

/**
 * ثمنُ السقف مقيسًا لا مقولًا: السقف أداةُ بيعٍ ممتازة، وثمنُها أنّ
 * أفضل ملعبٍ عندك يتوقّف عن زيادة دخلك بعد نقطة. وهذا يقول كم بلغها.
 */
function econCapNote(r, t) {
  if (!r.capped || !(t.cap > 0)) return 'لا سقفَ للعمولة في النموذج الحالي.';
  if (!r.capped.allSubfields) return 'لا ملاعبَ على المنصّة اليوم لقياس السقف عليها.';
  if (!r.capped.subfields) {
    return '<b>السقف:</b> لا ملعبٍ فرعيّ بلغ سقف ' + n0(t.cap) + ' د.أ بعد — فكلّ حجزةٍ إضافية ما زالت تزيد دخلك.';
  }
  return '<b>السقف:</b> ' + n0(r.capped.subfields) + ' من ' + n0(r.capped.allSubfields) +
         ' ملعبًا فرعيًّا بلغ سقف ' + n0(t.cap) + ' د.أ — أي <b>' + pct(r.capped.share, 0) +
         '</b> من دخلك لا يزيد مهما نمت حجوزاتُه.';
}

/* ما يقوم عليه العمودُ الشهري — في شارةٍ واحدة لا في لوحٍ يكرّر الدفتر. */
function econTodayChip(r) {
  return 'اليوم: <b class="num">' + n0(Math.round(r.places)) + '</b> مكانًا · ' +
         '<b class="num">' + n0(Math.round(r.subfields)) + '</b> ملعبًا فرعيًّا' +
         (r.pending.length ? ' · وعند اكتمال الخطّة <b class="num">' + n0(r.plan.places) + '</b>' : '');
}

/* شارةُ حالة الرياضة على بطاقتها: دخلُها إن كانت على المنصّة اليوم،
   وشهرُها إن كانت قادمة. ولا تُعرَض شارةٌ لرياضةٍ بلا أماكن أصلًا (م5). */
function econWhenChip(x) {
  if (!x.places) return '<span class="chip">بلا أماكن</span>';
  if (x.live)    return '<span class="chip acc">الدخل <b class="num">' + n0(x.income) + '</b> د.أ</span>';
  return '<span class="chip warn"><span class="shape"></span>من الشهر ' + n0(x.start) +
         ' · <b class="num">' + n0(x.income) + '</b> د.أ</span>';
}

/* ── خطّة الإدخال: ما هو على المنصّة اليوم وما هو قادم ─────────────
   ولا يُعرَض هذا اللوح إن كانت الرياضات كلُّها حيّة — سطرٌ يقول «لا شيء
   قادم» ضجيجٌ لا معلومة. */
function econPlanNote(r) {
  if (!r.pending.length) {
    return '<b>خطّة الإدخال:</b> الرياضات كلُّها على المنصّة من الشهر الأوّل — ' +
           'غيّرْ «متى تنضمّ؟» على أيّ بطاقةٍ أعلاه لتؤجّلها.';
  }
  var list = r.pending.slice().sort(function (a, b) { return a.start - b.start; })
    .map(function (x) {
      return esc(x.name) + ' <b>من الشهر ' + n0(x.start) + '</b> (' +
             placesNoun(Math.round(x.places)) + ' · ' + n0(x.income) + ' د.أ شهريًّا)';
    }).join(' · ');
  return '<b>قادمٌ في الخطّة:</b> ' + list + '.<br>' +
         'وعند اكتمالها: <b>' + placesNoun(Math.round(r.plan.places)) + '</b> و' +
         fieldsNoun(Math.round(r.plan.subfields)) + ' فرعيًّا و<b>' + n0(r.plan.income) +
         ' د.أ</b> دخلًا من العمولة — <b>وهذه أرقامُ اليوم لا تحملها</b>: ' +
         'الدخل الشهري أعلاه يعدّ ما هو على المنصّة الآن وحده، والمسارُ وعمودا السنة ' +
         'يدخلانها في شهرها.';
}
/* الأشرطة تعرض دخلَ **الخطّة الكاملة** لكلّ رياضة، والقادمةُ موسومةٌ
   بشهرها ولونها محايد — فلا يُقرأ شريطُ بادلٍ دخلًا يقع اليوم. */
function econBars(r) {
  var live = r.rows.filter(function (x) { return x.places > 0; });
  if (!live.length) return '<div class="empty"><p>ما في أماكن مُدخَلة.</p></div>';
  return hbars(live.map(function (x, i) {
    return { t: x.name, v: x.income,
             d: n0(x.income) + (x.live ? '' : ' · من الشهر ' + n0(x.start)),
             color: x.live ? ['var(--s1)', 'var(--s2)', 'var(--s3)', 'var(--s4)'][i % 4] : 'var(--ink-3)' };
  }), 'var(--s1)');
}
/* 🔴 البلاطات المعروضة **أربع** لا ستّ: «الدخل الشهري» و«تكلفة الرسائل»
   كانتا تقولان ما يقوله الملخّص تحتهما (صندوقُ الدخل · سطرُ الرسائل في
   الدفتر) — ورقمٌ يُقال مرّتين على شاشةٍ واحدة يُقرأ رقمين.
   والفهارس تبقى كما هي كي لا تنزلق معرّفات `ecT{i}v` في إعادة الرسم. */
var TILE_ORDER = [5, 1, 3, 2];

function econTiles(r, t) {
  return [
    null,
    { l: 'النسبة الفعلية', v: pct(r.effRate, 2),
      d: 'من ' + n0(r.gmv) + ' د.أ قيمةَ حجوزات — وهي ما يقبضه أصحاب الملاعب' },
    /* البلاطة صارت «النقد المطلوب» لا «أماكن التعادل»: الثانية بتفصيلها
       الثلاثيّ في بطاقة التعادل أسفل، والأولى الرقمُ الذي يقرّر عليه من
       يموّل من جيبه ولم يكن معروضًا في أيّ مكان. */
    { l: 'أقصى نقدٍ يلزمك', v: n0(r.cashNeeded) + '<span class="u">د.أ</span>',
      d: r.cashNeeded > 0 ? 'قبل أن يُطعم نفسَه — أعمق نقطةٍ في الشهر ' + n0(r.cashNeededMonth)
                          : 'لا يهبط تحت الصفر بهذه الأرقام' },
    { l: 'الدخل لكلّ ملعبٍ فرعيّ', v: n1(r.perSubfield) + '<span class="u">د.أ</span>', d: 'قارنه بالسقف ' + n0(t.cap) },
    null,
    { l: 'صافي السنوات الأربع بعد الضريبة', v: n0(r.allYearsNet) + '<span class="u">د.أ</span>',
      d: r.breakEvenMonth ? 'وأوّل شهرٍ موجب: الشهر ' + n0(r.breakEvenMonth) : 'لا يتعادل داخل الأربع سنوات بهذه الأرقام' }
  ];
}
function kpiE(o, i) {
  return '<div class="card kpi"><span class="k-l">' + esc(o.l) + '</span>' +
         '<span class="k-v"><span class="numP" id="ecT' + i + 'v">' + o.v + '</span></span>' +
         '<span class="k-d" id="ecT' + i + 'd">' + esc(o.d) + '</span></div>';
}

/** يُعيد رسم النتيجة وحدها — إعادةُ بناء الصفحة تُفقد الحقلَ تركيزَه
 *  عند كلّ حرف، وهو ما كان يجعل الكتابة في هذه الصفحة مستحيلة عمليًّا. */
function repaintEcon() {
  var t = T(), r = econCalc(S.econ, t);

  var hv = $('#ecProfit');
  if (hv) {
    var numEl = hv.querySelector('.numP');
    if (numEl) animateNumber(numEl, r.realProfit1, { fmt: n0 }); else hv.innerHTML = big(r.realProfit1, 'د.أ');
  }
  /* تبديلُ صنفٍ لا نمطٍ سطريّ — وإلّا عاد النمط يغلب الورقة عند كلّ رسم. */
  var hero = $('#ecHero');
  if (hero) {
    hero.classList.toggle('is-answer', r.realProfit1 >= 0);
    hero.classList.toggle('is-loss',   r.realProfit1 < 0);
  }
  var hd = $('#ecProfitD'); if (hd) hd.innerHTML = econHeroDesc(r);

  econTiles(r, t).forEach(function (o, i) {
    if (!o) return;                       /* بلاطةٌ محذوفة من العرض */
    var v = $('#ecT' + i + 'v'), d = $('#ecT' + i + 'd');
    if (v) v.innerHTML = o.v;
    if (d) d.textContent = o.d;
  });

  r.rows.forEach(function (x, i) { var e = $('#ecWhen' + i); if (e) e.innerHTML = econWhenChip(x); });
  var pn = $('#ecPlan div'); if (pn) pn.innerHTML = econPlanNote(r);

  var ps = $('#ecPathSub'); if (ps) ps.textContent = econPathSub();
  var bars = $('#ecBars');  if (bars) bars.innerHTML = econBars(r);
  var cap = $('#ecCap');    if (cap) cap.innerHTML = econCapNote(r, t);
  var un = $('#ecUnit');    if (un) un.innerHTML = econUnitRows(r);
  var bk = $('#ecBreak');   if (bk) bk.innerHTML = econBreakRows(r);
  var sn = $('#ecScen');    if (sn) sn.innerHTML = econScenRows(r, t);
  /* ⚠️ البطاقة تُبنى مرّةً بشرط `r.market`، وهذا يملأ جوفها وحده — فلو
     أدخل المالك أوّلَ سقفٍ الآن لم تظهر البطاقة حتى ينتقل ويعود. وهو
     مقبول: الحقل في أسفل الصفحة نفسها، والانتقالُ منها وإليها ضغطة.
     والبديل (إعادةُ بناء الصفحة) يُفقد الحقلَ تركيزَه عند كلّ حرف. */
  var mkt = $('#ecMarket'); if (mkt) mkt.innerHTML = econMarketHTML(r);
  var tc = $('#ecToday'); if (tc) tc.innerHTML = econTodayChip(r);
  var ex = $('#ecExtra'); if (ex) ex.innerHTML = econExtraNote(r);
  var dm = $('#ecDemand'); if (dm) dm.innerHTML = econDemandNote(r);
  var gw = $('#ecGw');    if (gw) gw.textContent = econGwNote(r).replace(/<[^>]+>/g, '');
  var lg = $('#ecLedger'); if (lg) lg.innerHTML = econSummaryHTML(r, t);

  drawEconCharts();
  var sv = $('#econSave'); if (sv) sv.disabled = !S.econDirty;
}

/* الترتيب زمنيّ لا بالأهمّية: التسمياتُ تتدرّج رأسيًّا بترتيب المصفوفة،
   فترتيبٌ غيرُ زمنيّ يجعل السطر الأعلى يقع بعد الذي تحته على المحور. */
function econMarks(r) {
  var out = [];
  var at = function (m) {
    for (var i = 0; i < r.path.length; i++) if (r.path[i].m === m) return r.path[i].net;
    return NaN;
  };
  if (r.cashNeededMonth) out.push({ x: r.cashNeededMonth, y: at(r.cashNeededMonth),
                                    label: 'أعمق نقطة نقد', color: cssVar('--bad') });
  if (r.breakEvenMonth)  out.push({ x: r.breakEvenMonth,  y: at(r.breakEvenMonth),
                                    label: 'أوّل شهر موجب', color: cssVar('--good') });
  if (r.paybackMonth)    out.push({ x: r.paybackMonth,    y: at(r.paybackMonth),
                                    label: 'استرداد ما وضعتَه', color: cssVar('--accent') });
  out.sort(function (a, b) { return a.x - b.x; });
  return out;
}

/* الوصفُ المنطوق يقول ما تقوله العلاماتُ للمبصر — لا «رسمٌ بيانيّ». */
function econChartAria(r) {
  var p = [];
  if (r.breakEvenMonth)  p.push('أوّل شهرٍ موجب هو الشهر ' + r.breakEvenMonth);
  if (r.cashNeededMonth) p.push('وأعمقُ نقطةٍ للنقد في الشهر ' + r.cashNeededMonth);
  if (r.paybackMonth)    p.push('واستردادُ ما وضعتَه في الشهر ' + r.paybackMonth);
  return 'الربح التشغيلي الشهري عبر ثمانية وأربعين شهرًا. ' +
         (p.length ? p.join('، ') + '.' : 'لا يتعادل داخل هذه المدّة.');
}

function drawEconCharts() {
  var r = econCalc(S.econ, T());
  var host = $('#ep1');
  if (host) {
    host.innerHTML = svgLine({
      w: host.clientWidth || 460, h: 236,
      series: [{ pts: r.path.map(function (p) { return [p.m, p.net]; }), color: cssVar('--s1') }],
      /* الرقم عاريًا: حرفٌ عربيّ ملتصقٌ برقمٍ داخل SVG اتّجاهه LTR
         يُعاد ترتيبه بـbidi، والعنوان فوق الرسم يقول «مسار ٤٨ شهرًا». */
      fmtY: n0, fmtX: n0,
      rule: { y: 0, color: cssVar('--ink-3'), label: 'خطّ الصفر' },
      /* ⭐ اللحظاتُ الثلاث التي يُقرأ الرسمُ من أجلها — موسومةً على الخطّ
         نفسه، فلا يُتتبَّع المنحنى بالعين ليُعرَف متى يقطع الصفر.
         ⚠️ وتُعرَض الموجودةُ منها وحدها: علامةٌ لشهرٍ لا يقع (`null`)
            كذبةٌ بشكل خطّ. */
      marks: econMarks(r),
      aria: econChartAria(r)
    });
  }
  var sp = $('#spark');
  if (sp) {
    sp.innerHTML = sparkline(r.path.map(function (p) { return p.net; }), cssVar('--s1'), Math.min(260, sp.clientWidth || 220), 42) +
      '<p class="hint" style="margin-top:2px">مسار ٤٨ شهرًا</p>';
  }
}

/* ═══════════════════════════════════════════════════════════════════
   ⑤ نموذج العمل (الثوابت)

var TERM_GROUPS = [
  { t: 'المال والتسعير', ic: 'coins', d: 'النموذج المعتمد — والحاسبتان تقرآنه',
    rows: [5, 6, 7, 8, 9, 10, 11, 12] },
  { t: 'قواعد الاتفاقية', ic: 'clock', d: 'ما وقّعتَ عليه',
    rows: [23, 24, 25, 26, 27, 28] },
  { t: 'الوعود', ic: 'target', d: 'ما تقوله في المكالمة — وما لا تقوله أبدًا',
    rows: [31, 32] },
  { t: 'حالة المنتج', ic: 'info', d: 'ما هو مفتوحٌ اليوم فعلًا',
    rows: [35, 36] }
];

function vTerms() {
  var t = T();
  var h = '<div class="stack">';

  h += '<div class="note acc">' + icon('info') + '<div><b>كلّ رقمٍ هنا يعيش مرّةً واحدة.</b> ' +
       'الحاسبتان تقرآنه ولا تحملان نسخةً ثانية منه — فتغييره هنا يغيّرهما معًا، في الموقع وفي الشيت.</div></div>';

  /* ── ماذا يعني هذا بالدينار ── */
  var tryB = Number(C.B16 && C.B16.value) || 40, refP = Number(C.B15 && C.B15.value) || 40;
  var comm = commissionPerSubfield(tryB, refP, t.r1, t.n1, t.r2, t.cap);
  h += '<div class="card"><div class="card-h"><h3>ماذا يعني هذا بالدينار</h3><p>على ملعبٍ فرعيّ واحد</p></div>' +
    '<div class="row2" style="margin-bottom:16px">' +
      '<div class="field"><label for="tp">سعر الحجزة المرجعي (د.أ)</label>' +
        '<input class="input n" id="tp" type="number" min="1" step="1" value="' + esc(refP) + '"></div>' +
      '<div class="field"><label for="tb">جرّب: عدد حجوزات الشهر</label>' +
        '<input class="input n" id="tb" type="number" min="0" step="1" value="' + esc(tryB) + '"></div>' +
    '</div>' +
    '<div class="grid g-3" id="tryOut">' + tryTiles(tryB, refP, t) + '</div>' +
    '<div class="chart-host" style="margin-top:18px"><div id="tc"></div></div>' +
  '</div>';

  /* ── المجموعات ── */
  TERM_GROUPS.forEach(function (g) {
    h += '<div class="card"><div class="card-h">' + icon(g.ic) + '<h3>' + esc(g.t) + '</h3><p>' + esc(g.d) + '</p></div>';
    h += '<div class="stack" style="gap:15px">';
    g.rows.forEach(function (rn) {
      var c = C['B' + rn];
      if (!c || !c.label) return;
      h += termField(rn, c);
    });
    h += '</div></div>';
  });

  /* ── فحص المطابقة ── */
  h += '<div class="card"><div class="card-h"><h3>طابق الشيت</h3>' +
    '<p>الموقع يحسب بنفسه ليبقى فوريًّا — وهذا يقارن ناتجه بما حسبه الشيت</p>' +
    '<button class="btn ghost sm sp" type="button" id="verifyBtn">' + icon('refresh') + 'قارن الآن</button></div>' +
    '<div id="verifyOut"><p class="hint">قارنَ الاثنين على نفس المدخلات. أيّ فرقٍ يعني أنّ أحدهما انحرف — وهو ' +
    'أوّل ما يجب أن يُعرَف، لا آخره.</p></div></div>';

  /* ── ترقية ورقة الاقتصاديات ──────────────────────────────────────
     صيغ الورقة كانت تفترض أنّ كلّ رياضةٍ على المنصّة اليوم، فتختلف عن
     الموقع بمجرّد أن تؤجّل رياضة. هذا يعيد كتابتها لتحسب ما يحسبه. */
  h += '<div class="card"><div class="card-h"><h3>رقِّ ورقة الاقتصاديات</h3>' +
    '<p>كي يحسب الشيت <b>شهر انضمام كلّ رياضة</b> كما يحسبه الموقع</p>' +
    '<button class="btn ghost sm sp" type="button" id="upgradeBtn">' + icon('sliders') + 'رقِّ الآن</button></div>' +
    '<div id="upgradeOut"><p class="hint">صيغُ الورقة تفترض أنّ كلّ رياضةٍ أدخلتَ لها أماكنَ هي على المنصّة ' +
    '<b>الآن</b>. فلو أجّلتَ رياضةً ستّة أشهر، ظلّ الشيت يعدّ دخلها في ربح هذا الشهر بينما الموقع يستبعده — ' +
    'ويختلف الرقمان بلا أن يكون أحدهما مخطئًا في حسابه.<br>' +
    'الترقية تكتب في الورقة مسارًا لأماكن <b>كلّ رياضةٍ على حدة</b>، تدخل فيه في شهرها. ' +
    '<b>لا تُدرِج صفًّا ولا عمودًا</b>، ولا تمسّ بياناتك ولا الرسمة، وتشغيلُها مرّتين يكتب نفس الصيغ.</p></div></div>';

  h += '</div>';
  return h;
}

function tryTiles(b, p, t) {
  var comm = commissionPerSubfield(b, p, t.r1, t.n1, t.r2, t.cap);
  var atTier = commissionPerSubfield(t.n1, p, t.r1, t.n1, t.r2, t.cap);
  var capAt = '—';
  if (t.cap > 0 && p > 0 && t.r1 > 0) {
    capAt = (t.cap <= t.n1 * p * t.r1)
      ? n0(Math.ceil(t.cap / (p * t.r1)))
      : (t.r2 > 0 ? n0(t.n1 + Math.ceil((t.cap - t.n1 * p * t.r1) / (p * t.r2))) : 'لا يُبلَغ');
  } else if (t.cap <= 0) capAt = 'بلا سقف';

  return kpi('عمولتك عندها', n2(comm) + '<span class="u">د.أ</span>', 'ما يدفعه الملعب الفرعيّ الواحد ذلك الشهر') +
         kpi('النسبة الفعلية', pct(safeDiv(comm, b * p)), 'ليست ' + pct(t.r1, 0) + ' — التدرّج والسقف ينزلان بها') +
         kpi('الحجزة التي يبدأ عندها السقف', capAt, 'بعدها لا يزيد ولو حجز الشهر كلّه');
}

function termField(rn, c) {
  var id = 'tf' + rn;
  var v = c.value;
  var isPct = /نسبة/.test(c.label);
  var isNumF = typeof v === 'number';
  var isLong = typeof v === 'string' && v.length > 44;
  var opts = (rn === 5) ? (S.boot.vocab && S.boot.vocab.model) || [] : null;

  var ctl;
  if (opts && opts.length) {
    ctl = '<select class="input" id="' + id + '" data-tb="' + rn + '">' + opts.map(function (o) {
      return '<option value="' + esc(o) + '"' + (String(v) === o ? ' selected' : '') + '>' + esc(o) + '</option>';
    }).join('') + '</select>';
  } else if (isPct) {
    ctl = '<div style="display:flex;align-items:center;gap:8px"><input class="input n" id="' + id + '" type="number" step="0.5" min="0" max="100" ' +
          'data-tb="' + rn + '" data-pct="1" value="' + esc(Math.round(Number(v) * 1000) / 10) + '" style="max-width:130px">' +
          '<span style="color:var(--ink-3)">٪</span></div>';
  } else if (isNumF) {
    ctl = '<input class="input n" id="' + id + '" type="number" step="1" min="0" data-tb="' + rn + '" value="' + esc(v) + '" style="max-width:170px">';
  } else if (isLong) {
    ctl = '<textarea class="input" id="' + id + '" data-tb="' + rn + '" rows="2">' + esc(v) + '</textarea>';
  } else {
    ctl = '<input class="input" id="' + id + '" type="text" data-tb="' + rn + '" value="' + esc(v) + '">';
  }

  var missing = String(v).indexOf('املأني') > -1;
  return '<div class="field"><label for="' + id + '">' + esc(c.label) +
    (missing ? ' <span class="chip warn" style="min-height:20px;font-size:11px"><span class="shape"></span>ناقصة</span>' : '') + '</label>' +
    ctl + (c.hint ? '<span class="hint">' + esc(c.hint) + '</span>' : '') + '</div>';
}

afterRender.terms = function () {
  var tp = $('#tp'), tb = $('#tb');
  function redraw() {
    var p = Number(tp.value) || 0, b = Number(tb.value) || 0, t = T();
    $('#tryOut').innerHTML = tryTiles(b, p, t);
    var host = $('#tc');
    if (host) {
      var pts = [];
      for (var k = 0; k <= 90; k += 3) pts.push([k, commissionPerSubfield(k, p, t.r1, t.n1, t.r2, t.cap)]);
      host.innerHTML = svgLine({
        w: host.clientWidth || 520, h: 220,
        series: [{ pts: pts, color: cssVar('--s1') }], fmtY: n0, fmtX: n0,
        rule: t.cap > 0 ? { y: t.cap, color: cssVar('--warn'), label: 'السقف ' + n0(t.cap) } : null,
        aria: 'العمولة على ملعبٍ فرعيّ واحد مقابل عدد حجوزاته الشهرية.'
      });
    }
  }
  if (tp && tb) { tp.oninput = redraw; tb.oninput = redraw; redraw(); }

  $$('#view [data-tb]').forEach(function (el) {
    el.onchange = function () {
      var rn = Number(el.dataset.tb);
      var val = el.dataset.pct ? (Number(el.value) || 0) / 100
              : (el.type === 'number' ? (Number(el.value) || 0) : el.value);
      call('saveConstant', rn, val).then(function (res) {
        C['B' + rn].value = res.value;
        toast('حُفظ في «الثوابت» — والحاسبتان تبعتاه.');
        redraw();
      }).catch(function (e) { toast(e.message || 'ما قدرنا نحفظ.', 'bad'); });
    };
  });

  var vb = $('#verifyBtn');
  if (vb) vb.onclick = function () { runVerify(vb); };

  var ub = $('#upgradeBtn');
  if (ub) ub.onclick = function () {
    var out = $('#upgradeOut');
    ub.classList.add('loading');
    call('upgradeEconSheet').then(function (res) {
      ub.classList.remove('loading');
      out.innerHTML = '<div class="note"><div><b>تمّت الترقية.</b> ' +
        n0(res.wrote) + ' خليّة كُتبت، وشهرُ انضمام كلّ رياضة في صفّ ' + n0(res.joinRow) +
        (res.movedFrom ? ' (نُقل من صفّ ' + n0(res.movedFrom) + ' بقيمه)' : '') + '. ' +
        'اضغط «قارن الآن» أعلاه لترى المطابقة.</div></div>';
      toast('رُقّيت ورقة الاقتصاديات.');
    }).catch(function (e) {
      ub.classList.remove('loading');
      out.innerHTML = '<div class="note bad">' + icon('alert') + '<div>' + esc(e.message || 'ما قدرنا نرقّي الورقة.') + '</div></div>';
    });
  };
};

/** يقارن ما حسبته الواجهة بما حسبه الشيت — على نفس المدخلات. */
function runVerify(btn) {
  if (btn) btn.classList.add('loading');
  var out = $('#verifyOut');
  out.innerHTML = '<p class="hint">نقرأ الشيت…</p>';
  call('getBootstrap').then(function (b) {
    var t = terms(b.constants);
    var sc = b.sheetComputed || {};
    var vc = venueCalc(b.calcInputs, t);
    var ec = econCalc(b.econInputs, t);
    var refP = Number(b.constants.B15.value) || 0, tryB = Number(b.constants.B16.value) || 0;

    var checks = [
      ['عمولة الشهر (الثوابت B17)', commissionPerSubfield(tryB, refP, t.r1, t.n1, t.r2, t.cap), sc.con_B17],
      ['النسبة الفعلية (الثوابت B18)', safeDiv(commissionPerSubfield(tryB, refP, t.r1, t.n1, t.r2, t.cap), tryB * refP), sc.con_B18],
      ['ما يدفعه صاحب الملعب (الحاسبة B31)', vc.pay, sc.cal_B31],
      ['صافي فائدته (الحاسبة B34)', vc.net, sc.cal_B34],
      ['نقطة التعادل (الحاسبة B36)', vc.breakEven, sc.cal_B36],
      ['صافي السنة الأولى (الحاسبة B38)', vc.yearNet, sc.cal_B38],
      ['الدخل الشهري (الاقتصاديات B45)', ec.revenue, sc.eco_B45],
      ['الربح الشهري (الاقتصاديات B48)', ec.profit, sc.eco_B48],
      /* 🔴 **التعريف القديم عمدًا**: الموقع صار يقسم على الثابت كلِّه
         (البند ① — رواتبُ وضمانٌ وتسويقٌ وإداريّ)، وصيغةُ `B54` في الشيت
         ما زالت على البنية التحتية وحدها. فحصُ المطابقة يقارن **ما يقوله
         الشيتُ اليوم** لا ما نتمنّاه — وحارسٌ أحمرُ دائمًا حارسٌ يُتجاهَل.
         ويعود إلى `breakEvenPlaces` بعد تشغيل `upgradeEconSheet()`. */
      ['أماكن التعادل — بتعريف الشيت القديم (B54)', ec.breakEvenPlacesLegacy, sc.eco_B54],
      /* الأرقام الحقيقية — أُضيفت مع قسم التكاليف 2026-09-03. وهي الأهمّ
         في الفحص: الشيت يحسبها بصيغٍ والموقع بحلقةِ ٤٨ شهرًا، فتطابقُهما
         يثبت أنّ المسارين يقولان الشيء نفسه لا شيئين متقاربين. */
      ['تكاليف إضافية — سنة ١ (B76)', ec.extra1, sc.eco_B76],
      ['الربح التشغيلي الشهري (B78)', ec.realProfit1, sc.eco_B78],
      ['صافي السنة الأولى بعد الضريبة (B84)', ec.y1Net, sc.eco_B84],
      ['صافي السنة الثانية بعد الضريبة (B87)', ec.y2Net, sc.eco_B87],
      /* الشيت أفقُه سنتان والموقع أربع ⇒ المقارنة على **السنتين
         الأوليين** لا على مجموع الأربع، وإلّا قارنّا شيئين مختلفين. */
      ['إجمالي السنتين بعد الضريبة (B88)', ec.twoYearNet, sc.eco_B88]
    ];

    var bad = 0;
    var h = '<div class="tbl-wrap"><table class="tbl"><thead><tr><th></th><th>الموقع</th><th>الشيت</th><th>الفرق</th></tr></thead><tbody>';
    checks.forEach(function (c) {
      var mine = c[1], sheet = Number(c[2]);
      var okBoth = isNum(mine) && isNum(sheet);
      var diff = okBoth ? Math.abs(mine - sheet) : NaN;
      var tol = Math.max(0.02, Math.abs(sheet || 0) * 0.001);
      var ok = okBoth ? diff <= tol : (!isNum(mine) && !isNum(sheet));
      if (!ok) bad++;
      h += '<tr><td>' + (ok ? '<span class="chip good"><span class="shape"></span>مطابق</span>'
                            : '<span class="chip bad"><span class="shape"></span>مختلف</span>') +
           ' ' + esc(c[0]) + '</td><td class="n">' + (isNum(mine) ? n2(mine) : '—') +
           '</td><td class="n">' + (isNum(sheet) ? n2(sheet) : esc(String(c[2] === null || c[2] === '' ? '—' : c[2]))) +
           '</td><td class="n">' + (okBoth ? n2(diff) : '—') + '</td></tr>';
    });
    h += '</tbody></table></div>';
    h += bad
      ? '<div class="note bad" style="margin-top:14px">' + icon('alert') + '<div><b>' + bad + ' سطرًا مختلفًا.</b> ' +
        'أحدهما انحرف — والأرجح أنّ الشيت لم يُعِد الحساب بعد، أو أنّ صيغةً فيه عُدّلت بيد. افتح الشيت واقرأ الخانة بنفسها.</div></div>'
      : '<div class="note" style="margin-top:14px;border-inline-start-color:var(--good)">' + icon('check') +
        '<div><b>كلّ سطرٍ مطابق.</b> ما يحسبه الموقع هو ما يحسبه الشيت، على نفس المدخلات.</div></div>';
    out.innerHTML = h;
  }).catch(function (e) { out.innerHTML = '<div class="note bad">' + icon('alert') + '<div>' + esc(e.message || 'فشل') + '</div></div>'; })
    .finally(function () { if (btn) btn.classList.remove('loading'); });
}

/* ═══════════════════════════════════════════════════════════════════
   ⑥⑦⑧ المهام · الأفكار · سجل التواصل
   ═══════════════════════════════════════════════════════════════════ */

function listPage(o) {
  var rows = o.rows;
  var h = '<div class="stack"><div class="card pad-0">' +
    '<div class="sec-h" style="padding:16px 18px 0;margin:0">' +
      '<h2>' + esc(o.title) + '</h2><p>' + n0(rows.length) + ' ' + esc(o.unit) + '</p>' +
      '<button class="btn sm sp" type="button" data-add="' + o.add + '">' + icon('plus') + 'أضف</button></div>' +
    '<div class="tbl-wrap" style="margin-top:12px"><table class="tbl"><thead><tr>' +
      o.cols.map(function (c) { return '<th>' + esc(c.h) + '</th>'; }).join('') + '</tr></thead><tbody>';

  if (!rows.length) {
    h += '<tr><td colspan="' + o.cols.length + '"><div class="empty"><h4>' + esc(o.emptyT) + '</h4><p>' + esc(o.emptyD) + '</p></div></td></tr>';
  } else {
    rows.forEach(function (r) {
      h += '<tr class="clickable" data-row="' + r._row + '" data-tbl="' + o.add + '">' +
        o.cols.map(function (c) { return '<td' + (c.cls ? ' class="' + c.cls + '"' : '') + '>' + c.f(r) + '</td>'; }).join('') + '</tr>';
    });
  }
  return h + '</tbody></table></div></div>' + (o.note || '') + '</div>';
}

function vTasks() {
  var open = openTasks(), done = tasksAll().length - open.length;
  return listPage({
    title: 'المهام', unit: 'مفتوحة' + (done ? ' · ' + n0(done) + ' منجزة' : ''), add: 'task',
    rows: tasksAll(),
    emptyT: 'لا مهامّ بعد', emptyD: 'اضغط «أضف» وارمِ أوّل واحدة.',
    cols: [
      { h: 'المهمّة', cls: 'nm', f: function (r) { return esc(r['المهمّة']); } },
      { h: 'المجال',  f: function (r) { return esc(r['المجال'] || '—'); } },
      { h: 'الأولوية', f: function (r) { return r['الأولوية'] ? '<span class="chip">' + esc(r['الأولوية']) + '</span>' : '—'; } },
      { h: 'الحالة',  f: function (r) {
          var s = String(r['الحالة'] || '').trim();
          return s ? '<span class="chip' + (/تمّ|منجز|مكتمل/.test(s) ? ' good' : '') + '">' + esc(s) + '</span>' : '<span class="chip warn"><span class="shape"></span>مفتوحة</span>'; } },
      { h: 'الموعد', cls: 'n', f: function (r) { return esc(r['#الموعد'] || r['الموعد'] || '—'); } }
    ]
  });
}

function vIdeas() {
  return listPage({
    title: 'الأفكار', unit: 'فكرة · ' + n0(undecidedIdeas().length) + ' بلا قرار', add: 'idea',
    rows: ideasAll(),
    emptyT: 'صندوق الوارد فاضي', emptyD: 'ارمِ الفكرة هنا ولا ترتّبها.',
    cols: [
      { h: 'الفكرة', cls: 'nm', f: function (r) { return esc(r['الفكرة']); } },
      { h: 'من أين', f: function (r) { return esc(r['من أين جاءت'] || '—'); } },
      { h: 'القرار', f: function (r) {
          var d = String(r['القرار'] || '').trim();
          var k = /مؤجَّل/.test(d) ? 'warn' : /رُفض|مرفوض/.test(d) ? 'bad' : /نُفِّذ|مقبول/.test(d) ? 'good' : 'warn';
          return d ? '<span class="chip ' + k + '"><span class="shape"></span>' + esc(d) + '</span>'
                   : '<span class="chip warn"><span class="shape"></span>لم يُقرَّر</span>'; } },
      { h: 'السبب أو الشرط', f: function (r) { return esc(r['السبب أو الشرط'] || '—'); } },
      { h: 'التاريخ', cls: 'n', f: function (r) { return esc(r['#التاريخ'] || r['التاريخ'] || '—'); } }
    ],
    note: '<div class="note">' + icon('info') + '<div>كلّ فكرةٍ قرارُها «لم يُقرَّر» تأخذ حكمًا في الطقس الأسبوعي — ' +
          'والحكم قد يكون «مؤجَّلة» بشرطٍ مكتوب، وهو قرارٌ لا تأجيل.</div></div>'
  });
}

function vLogs() {
  return listPage({
    title: 'سجل التواصل', unit: 'قيد', add: 'log',
    rows: logsAll().slice().reverse(),
    emptyT: 'لا قيود بعد', emptyD: 'كلّ مكالمةٍ أو زيارة تُقيَّد هنا — بماذا وعدتَه تحديدًا.',
    cols: [
      { h: 'التاريخ', cls: 'n', f: function (r) { return esc(r['#التاريخ'] || r['التاريخ'] || '—'); } },
      { h: 'الملعب', cls: 'nm', f: function (r) { return esc(r['الملعب'] || '—'); } },
      { h: 'النوع',  f: function (r) { return r['النوع'] ? '<span class="chip">' + esc(r['النوع']) + '</span>' : '—'; } },
      { h: 'مع مَن', f: function (r) { return esc(r['مع مَن'] || '—'); } },
      { h: 'النتيجة', f: function (r) {
          var v = String(r['النتيجة'] || '').trim();
          var k = /إيجابي/.test(v) ? 'good' : /سلبي|رفض/.test(v) ? 'bad' : '';
          return v ? '<span class="chip ' + k + '">' + (k ? '<span class="shape"></span>' : '') + esc(v) + '</span>' : '—'; } },
      { h: 'وعدتُه بـ', f: function (r) { return esc(r['وعدتُه بـ'] || '—'); } }
    ]
  });
}

/* ═══════════════════════════════════════════════════════════════════
   الأوراق المنزلقة  —  إضافةٌ وتحرير
   ═══════════════════════════════════════════════════════════════════ */

var FORMS = {
  venue: {
    sheet: 'الملاعب', key: 'اسم الملعب', title: 'ملعب',
    fields: [
      { c: 'اسم الملعب', t: 'text', req: true },
      { c: 'المنطقة', t: 'pick' },
      { c: 'المسؤول', t: 'text' },
      { c: 'رقم التلفون', t: 'tel' },
      { c: 'الحالة', t: 'pick' },
      { c: 'عدد الملاعب الفرعية', t: 'num' },
      { c: 'الرياضة', t: 'pick' },
      { c: 'آخر تواصل', t: 'date' },
      { c: 'الخطوة التالية', t: 'text' },
      { c: 'موعد المتابعة', t: 'date' },
      { c: 'من أين وصلتُه', t: 'text' },
      { c: 'ملاحظات / سبب الرفض', t: 'area' }
    ]
  },
  task: {
    sheet: 'المهام', key: 'المهمّة', title: 'مهمّة',
    fields: [
      { c: 'المهمّة', t: 'text', req: true },
      { c: 'المجال', t: 'pick' },
      { c: 'الأولوية', t: 'pick' },
      { c: 'الحالة', t: 'pick' },
      { c: 'على مَن', t: 'text' },
      { c: 'الموعد', t: 'date' },
      { c: 'ملاحظات', t: 'area' }
    ]
  },
  idea: {
    sheet: 'الأفكار', key: 'الفكرة', title: 'فكرة',
    fields: [
      { c: 'الفكرة', t: 'text', req: true },
      { c: 'من أين جاءت', t: 'pick' },
      { c: 'القرار', t: 'pick' },
      { c: 'السبب أو الشرط', t: 'area' },
      { c: 'التاريخ', t: 'date' },
      { c: 'تاريخ القرار', t: 'date' }
    ]
  },
  log: {
    sheet: 'سجل التواصل', key: 'الملعب', title: 'قيد تواصل',
    fields: [
      { c: 'التاريخ', t: 'date' },
      { c: 'الملعب', t: 'venue' },
      { c: 'النوع', t: 'pick' },
      { c: 'مع مَن', t: 'text' },
      { c: 'خلاصة ما دار', t: 'area' },
      { c: 'النتيجة', t: 'pick' },
      { c: 'وعدتُه بـ', t: 'text' }
    ]
  }
};
var VOCAB_KEY = { venue: 'venues', task: 'tasks', idea: 'ideas', log: 'logs' };

function openSheet(kind, row) {
  var spec = FORMS[kind];
  var data = row ? findRow(spec.sheet, row) : {};
  S.sheetCtx = { kind: kind, row: row || 0 };

  $('#sheetTitle').textContent = (row ? 'تعديل ' : 'إضافة ') + spec.title;
  /* ⚠️ السجلّ **بعد الحقول لا قبلها**: اللوح يُفتَح للتعديل، فأوّل ما يقع
     عليه المؤشّر حقلٌ يُكتب فيه. والسجلّ سياقٌ يُقرأ عند الحاجة. */
  $('#sheetBody').innerHTML =
    spec.fields.map(function (f) { return formField(kind, f, data[f.c]); }).join('') +
    (kind === 'venue' && row ? venueHistory(data['اسم الملعب']) : '');
  $('#sheetFoot').innerHTML =
    '<button class="btn" type="button" id="sheetSave">' + icon('save') + (row ? 'احفظ' : 'أضف') + '</button>' +
    '<button class="btn quiet" type="button" data-close="sheet">إلغاء</button>' +
    (row ? '<button class="btn danger" type="button" id="sheetDel" aria-label="امسح">' + icon('trash') + '</button>' : '');

  $('#sheetWrap').hidden = false;
  setTimeout(function () { var f = $('#sheetBody input, #sheetBody select, #sheetBody textarea'); if (f) f.focus(); }, 60);

  $('#sheetSave').onclick = saveSheet;
  var del = $('#sheetDel');
  if (del) del.onclick = function () {
    if (!confirm('نمسح محتوى الصفّ؟ الصفّ نفسه يبقى — فصيغُه تبقى حيّةً لما بعده.')) return;
    call('clearRow', spec.sheet, row).then(function () { closeSheetPanel(); reload(kind); toast('مُسح.'); })
      .catch(function (e) { toast(e.message || 'ما قدرنا نمسح.', 'bad'); });
  };
}

/**
 * سجلُّ الملعب — مكالماتُه من ورقة «سجل التواصل».
 * 🔴 **الرابط موجودٌ في الشيت أصلًا** (عمود «الملعب» في سجل التواصل) ولم
 *    يكن يُعرَض: كانت الورقتان قائمتين متجاورتين لا ملفَّ عميلٍ واحدًا.
 *    فبطاقة الملعب صارت تقول «متى كلّمتَه وبماذا وعدتَه» في مكانها.
 * ⚠️ والمطابقة **بالاسم** لأنّه ما يربطهما في الشيت — فتغييرُ اسم ملعبٍ
 *    يقطع سجلَّه. وهو قيدُ البيانات لا قيدُ العرض، ويُقال في الحاشية.
 */
function venueHistory(name) {
  name = String(name || '').trim();
  if (!name) return '';

  var mine = logsAll().filter(function (r) {
    return String(r['الملعب'] || '').trim() === name;
  }).sort(function (a, b) {
    return String(b['التاريخ'] || '').localeCompare(String(a['التاريخ'] || ''));
  });

  var h = '<div class="vh"><div class="vh-h"><h4>سجلّ التواصل معه</h4>' +
          '<span class="chip' + (mine.length ? '' : ' warn') + '">' +
          (mine.length ? logsNoun(mine.length) : 'ما في مكالمات') + '</span></div>';

  if (!mine.length) {
    /* حالةٌ فارغة تقول المخرج لا تعتذر — نفس نمط بقيّة الفراغات. */
    h += '<p class="hint">ما سُجّلت مكالمةٌ لهذا الملعب بعد. أضِفْها من «سجل التواصل» ' +
         'واختر اسمه، فتظهر هنا.</p></div>';
    return h;
  }

  h += '<ul class="vh-list">' + mine.slice(0, 6).map(function (r) {
    var d = String(r['التاريخ'] || '').trim();
    var ago = daysAgo(d);
    var res = String(r['النتيجة'] || '').trim();
    var promise = String(r['وعدتُه بـ'] || '').trim();
    return '<li class="vh-row">' +
      '<div class="vh-top">' +
        '<b>' + esc(String(r['النوع'] || 'تواصل')) + '</b>' +
        (res ? '<span class="chip">' + esc(res) + '</span>' : '') +
        '<span class="vh-when">' + esc(d || '—') +
          (ago !== null ? ' · قبل ' + daysNoun(ago) : '') + '</span>' +
      '</div>' +
      (r['خلاصة ما دار'] ? '<p class="vh-sum">' + esc(r['خلاصة ما دار']) + '</p>' : '') +
      (promise ? '<p class="vh-promise">وعدتَه بـ: <b>' + esc(promise) + '</b></p>' : '') +
    '</li>';
  }).join('') + '</ul>';

  if (mine.length > 6) {
    h += '<p class="hint">وأقدمُ منها ' + logsNoun(mine.length - 6) + ' في «سجل التواصل».</p>';
  }
  h += '<p class="hint">المطابقة <b>باسم الملعب</b> — فتغييرُ الاسم يقطع سجلَّه.</p>';
  return h + '</div>';
}

function logsNoun(n) { return countNoun(n, 'مكالمة واحدة', 'مكالمتان', 'مكالمات', 'مكالمة'); }

function formField(kind, f, val) {
  var id = 'ff-' + f.c.replace(/[^\w؀-ۿ]/g, '');
  var v = val === undefined || val === null ? '' : val;
  var lab = '<label for="' + id + '">' + esc(f.c) + (f.req ? ' <span style="color:var(--bad)">*</span>' : '') + '</label>';
  var ctl;

  if (f.t === 'area')      ctl = '<textarea class="input" id="' + id + '" data-f="' + esc(f.c) + '" rows="3">' + esc(v) + '</textarea>';
  else if (f.t === 'num')  ctl = '<input class="input n" id="' + id + '" data-f="' + esc(f.c) + '" type="number" min="0" step="1" value="' + esc(v) + '">';
  else if (f.t === 'date') ctl = '<input class="input n" id="' + id + '" data-f="' + esc(f.c) + '" type="date" value="' + esc(v) + '">';
  else if (f.t === 'tel')  ctl = '<input class="input n" id="' + id + '" data-f="' + esc(f.c) + '" type="tel" dir="ltr" placeholder="07 9999 9999" value="' + esc(v) + '">';
  else if (f.t === 'venue') {
    var names = venues().map(function (r) { return r['اسم الملعب']; });
    ctl = '<input class="input" id="' + id + '" data-f="' + esc(f.c) + '" list="dl-ven" value="' + esc(v) + '">' +
          '<datalist id="dl-ven">' + names.map(function (n) { return '<option value="' + esc(n) + '">'; }).join('') + '</datalist>';
  } else if (f.t === 'pick') {
    var opts = vocab(VOCAB_KEY[kind], f.c);
    if (v && opts.indexOf(String(v)) === -1) opts.unshift(String(v));
    if (opts.length) {
      /* قائمةٌ مغلقة + «أخرى…» — فالقيمة الجديدة قرارٌ لا زلّة لوحة مفاتيح.
         (الكتابة الحرّة تصنع «عمّان» و«عمان» مدينتين، والمرشِّح ينشقّ.) */
      ctl = '<select class="input" id="' + id + '" data-f="' + esc(f.c) + '" data-other="1">' +
        '<option value="">—</option>' +
        opts.map(function (o) { return '<option value="' + esc(o) + '"' + (String(v) === o ? ' selected' : '') + '>' + esc(o) + '</option>'; }).join('') +
        '<option value="__other">أخرى…</option></select>' +
        '<input class="input" data-other-for="' + esc(f.c) + '" placeholder="اكتب القيمة الجديدة" hidden>';
    } else {
      ctl = '<input class="input" id="' + id + '" data-f="' + esc(f.c) + '" type="text" value="' + esc(v) + '">';
    }
  } else ctl = '<input class="input" id="' + id + '" data-f="' + esc(f.c) + '" type="text" value="' + esc(v) + '">';

  return '<div class="field">' + lab + ctl + '</div>';
}

function saveSheet() {
  var ctx = S.sheetCtx, spec = FORMS[ctx.kind];
  var patch = {};
  $$('#sheetBody [data-f]').forEach(function (el) {
    var k = el.dataset.f, v = el.value;
    if (el.dataset.other && v === '__other') {
      var o = $('#sheetBody [data-other-for="' + k + '"]');
      v = o ? o.value.trim() : '';
    }
    if (el.type === 'number') v = v === '' ? '' : Number(v);
    patch[k] = v;
  });

  if (!String(patch[spec.key] || '').trim()) { toast('«' + spec.key + '» مطلوبة.', 'bad'); return; }

  var btn = $('#sheetSave'); btn.disabled = true; btn.classList.add('loading');
  var p = ctx.row ? call('saveRow', spec.sheet, ctx.row, patch)
                  : call('appendRow', spec.sheet, patch, spec.key);
  p.then(function (res) {
    closeSheetPanel();
    reload(ctx.kind);
    toast(ctx.row ? 'حُفظ في الشيت.' : 'أُضيف إلى الشيت.');
    if (res && res.skipped && res.skipped.length) {
      var f = res.skipped.filter(function (s) { return /صيغة/.test(s); });
      if (f.length) toast('تُركت ' + f.length + ' خانة صيغة كما هي — الحارس في الخادم.', 'ok');
    }
  }).catch(function (e) { btn.disabled = false; btn.classList.remove('loading'); toast((e && e.message) || 'ما قدرنا نحفظ.', 'bad'); });
}

function closeSheetPanel() { $('#sheetWrap').hidden = true; S.sheetCtx = null; }

function findRow(sheetName, row) {
  var t = ({ 'الملاعب': 'venues', 'المهام': 'tasks', 'الأفكار': 'ideas', 'سجل التواصل': 'logs' })[sheetName];
  var rows = (S.boot[t] && S.boot[t].rows) || [];
  for (var i = 0; i < rows.length; i++) if (rows[i]._row === row) return rows[i];
  return {};
}

function reload(kind) {
  var key = ({ venue: 'venues', task: 'tasks', idea: 'ideas', log: 'logs' })[kind];
  return call('refresh', key).then(function (t) { S.boot[key] = t; render(); });
}

/* ═══════════════════════════════════════════════════════════════════
   لوحة الأوامر
   ═══════════════════════════════════════════════════════════════════ */

function palOpen() {
  $('#pal').hidden = false;
  paintStaticIcons($('#pal'));
  var q = $('#palQ');
  q.value = '';
  palFill('');
  q.focus();                       /* فورًا: العنصر ظاهرٌ الآن فلا داعيَ لمؤقّت */
  setTimeout(function () { q.focus(); }, 40);   /* واحتياطٌ لِما يسرق التركيز */
}
function palClose() { $('#pal').hidden = true; }

function palFill(q) {
  q = String(q || '').trim();
  var rows = [];

  PAGES.forEach(function (g) {
    g.items.forEach(function (p) { rows.push({ ic: p.ic, t: p.t, sub: g.g, go: p.id }); });
  });
  rows.push({ ic: 'play',    t: 'وضع العرض (حاسبة الملعب)', sub: 'أمر', act: function () { go('calc'); setTimeout(openStage, 60); } });
  rows.push({ ic: 'plus',    t: 'أضف ملعبًا',    sub: 'أمر', act: function () { openSheet('venue'); } });
  rows.push({ ic: 'plus',    t: 'أضف مهمّة',     sub: 'أمر', act: function () { openSheet('task'); } });
  rows.push({ ic: 'plus',    t: 'أضف فكرة',      sub: 'أمر', act: function () { openSheet('idea'); } });
  rows.push({ ic: 'plus',    t: 'قيّد تواصلًا',   sub: 'أمر', act: function () { openSheet('log'); } });
  rows.push({ ic: 'sun',     t: 'بدّل المظهر',   sub: 'أمر', act: cycleTheme });
  rows.push({ ic: 'sheet',   t: 'افتح الشيت',    sub: 'أمر', act: function () { window.open(S.boot.sheetUrl, '_blank'); } });
  rows.push({ ic: 'refresh', t: 'أعِد قراءة الشيت', sub: 'أمر', act: function () { boot(); } });

  venues().forEach(function (r) {
    rows.push({ ic: 'pin', t: r['اسم الملعب'], sub: r['المنطقة'] || 'ملعب',
                act: function () { openSheet('venue', r._row); } });
  });

  if (q) rows = rows.filter(function (r) { return (r.t + ' ' + (r.sub || '')).indexOf(q) > -1; });

  S.palRows = rows.slice(0, 40);
  S.palIdx = 0;
  paintPal();
}

function paintPal() {
  var el = $('#palList');
  if (!S.palRows.length) { el.innerHTML = '<div class="pal-empty">ما في نتيجة.</div>'; return; }
  el.innerHTML = S.palRows.map(function (r, i) {
    return '<div class="pal-row' + (i === S.palIdx ? ' on' : '') + '" data-i="' + i + '">' + icon(r.ic) +
           '<b>' + esc(r.t) + '</b><span class="sub">' + esc(r.sub || '') + '</span></div>';
  }).join('');
  var on = $('.pal-row.on', el);
  if (on) on.scrollIntoView({ block: 'nearest' });
}

function palRun(i) {
  var r = S.palRows[i];
  if (!r) return;
  palClose();
  if (r.go) go(r.go); else if (r.act) r.act();
}

/* ═══════════════════════════════════════════════════════════════════
   المظهر
   ═══════════════════════════════════════════════════════════════════ */

var THEMES = [
  { k: 'dark',  ic: 'moon',    t: 'داكن' },
  { k: 'light', ic: 'sun',     t: 'نهاري' },
  { k: 'auto',  ic: 'monitor', t: 'حسب الجهاز' }
];
function themeNow() {
  var t;
  try { t = localStorage.getItem('mstd:theme'); } catch (e) {}
  return (t === 'light' || t === 'auto') ? t : 'dark';
}
function cycleTheme() {
  var i = THEMES.map(function (x) { return x.k; }).indexOf(themeNow());
  var next = THEMES[(i + 1) % THEMES.length].k;
  try { localStorage.setItem('mstd:theme', next); } catch (e) {}
  if (next === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', next);
  paintTheme();
  if (S.ready) { render(); if (S.stageOn) paintStage(); }
}
/** الأيقونة تصف ما اختاره لا ما يُرسَم — وإلّا استحال أن يعرف أنّه في الوضع التلقائي. */
function paintTheme() {
  var cur = THEMES.filter(function (x) { return x.k === themeNow(); })[0];
  $('#themeIc').innerHTML = iconSVG(cur.ic);
  $('#themeLbl').textContent = 'المظهر · ' + cur.t;
}

/* ═══════════════════════════════════════════════════════════════════
   الأحداث
   ═══════════════════════════════════════════════════════════════════ */

document.addEventListener('click', function (e) {
  var t = e.target;

  var go1 = t.closest('[data-go]');       if (go1) { go(go1.dataset.go); return; }
  var add = t.closest('[data-add]');      if (add) { openSheet(add.dataset.add); return; }
  var ven = t.closest('[data-venue]');    if (ven) { e.preventDefault(); openSheet('venue', Number(ven.dataset.venue)); return; }
  var row = t.closest('[data-row]');      if (row) { openSheet(row.dataset.tbl, Number(row.dataset.row)); return; }
  var don = t.closest('[data-done]');     if (don) { markDone(Number(don.dataset.done), don); return; }
  var fs  = t.closest('[data-fs]');       if (fs)  { S.vFilter.status = fs.dataset.fs; render(); return; }
  var pr  = t.closest('.pal-row');        if (pr)  { palRun(Number(pr.dataset.i)); return; }

  var cl = t.closest('[data-close]');
  if (cl) {
    if (cl.dataset.close === 'pal') palClose();
    else if (cl.dataset.close === 'msg') closeProposal();
    else closeSheetPanel();
    return;
  }

  if (t.closest('#btnCmd'))   { palOpen(); return; }
  if (t.closest('#btnTheme')) { cycleTheme(); return; }
  if (t.closest('#btnMenu'))  { $('#rail').classList.toggle('open'); return; }

  /* درجٌ مفتوح بلا مخرجٍ إلّا زرِّه مصيدةٌ صغيرة — النقر خارجه يغلقه. */
  var rail = $('#rail');
  if (rail.classList.contains('open') && !t.closest('.rail')) rail.classList.remove('open');
});

document.addEventListener('change', function (e) {
  var sel = e.target.closest('select[data-other]');
  if (!sel) return;
  var other = $('#sheetBody [data-other-for="' + sel.dataset.f + '"]');
  if (other) { other.hidden = sel.value !== '__other'; if (!other.hidden) other.focus(); }
});

document.addEventListener('keydown', function (e) {
  if ((e.ctrlKey || e.metaKey) && (e.key === 'k' || e.key === 'K')) { e.preventDefault(); palOpen(); return; }

  if (!$('#pal').hidden) {
    if (e.key === 'Escape') { palClose(); return; }
    if (e.key === 'ArrowDown') { e.preventDefault(); S.palIdx = Math.min(S.palIdx + 1, S.palRows.length - 1); paintPal(); return; }
    if (e.key === 'ArrowUp')   { e.preventDefault(); S.palIdx = Math.max(S.palIdx - 1, 0); paintPal(); return; }
    if (e.key === 'Enter')     { e.preventDefault(); palRun(S.palIdx); return; }
    return;
  }
  if (e.key === 'Escape') {
    if (!$('#msgWrap').hidden) { closeProposal(); return; }   // الأعلى طبقةً يُغلَق أوّلًا
    if (S.stageOn) { closeStage(); return; }
    if (!$('#sheetWrap').hidden) { closeSheetPanel(); return; }
  }
});

document.addEventListener('input', function (e) {
  if (e.target.id === 'palQ') palFill(e.target.value);
});

/* الرسوم تُرسم بأبعاد البكسل الحقيقية ⇒ تُعاد عند تغيّر العرض. */
var rz;
window.addEventListener('resize', function () {
  clearTimeout(rz);
  rz = setTimeout(function () {
    if (!S.ready) return;
    if (afterRender[S.page] && $('#view').innerHTML) render();
  }, 220);
});

function markDone(row, btn) {
  if (btn) btn.classList.add('loading');
  var vals = vocab('tasks', 'الحالة');
  var done = vals.filter(function (v) { return /تمّ|منجز|مكتمل/.test(v); })[0] || 'تمّت';
  call('saveRow', 'المهام', row, { 'الحالة': done })
    .then(function () { return reload('task'); })
    .then(function () { toast('علّمناها «' + done + '».'); })
    .catch(function (e) { if (btn) btn.classList.remove('loading'); toast(e.message || 'ما قدرنا نحفظ.', 'bad'); });
}

/* ═══ انطلق ══════════════════════════════════════════════════════ */
/* حارسٌ ضدّ إقلاعين: الحدث قد يكون وقع قبل تسجيلنا، فنفحص الحالة —
   ونداءان يعنيان جلبتين ومستمعَين مكرَّرين على كلّ عنصر. */
var booted = false;
function bootOnce() { if (booted) return; booted = true; boot(); }
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bootOnce);
else bootOnce();

})();
</script>
