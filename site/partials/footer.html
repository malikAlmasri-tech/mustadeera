<footer class="ft">
  <div class="wrap ft-in">

    <div class="ft-brand">
      <img class="ft-logo lt" src="/assets/logo-nav.png" alt="{{t.brandName}}" width="110" height="40" loading="lazy">
      <img class="ft-logo dk" src="/assets/logo-nav-dark.png" alt="" aria-hidden="true" width="110" height="40" loading="lazy">
      <p class="ft-tag">{{t.footerTagline}}</p>
    </div>

    <nav class="ft-col" aria-labelledby="ft-c1">
      <h2 class="ft-h" id="ft-c1">{{t.footerColProduct}}</h2>
      <a href="{{base}}/download/">{{t.linkDownload}}</a>
      <a href="{{base}}/places/">{{t.linkWebApp}}</a>
      <a href="{{base}}/owners/">{{t.linkOwners}}</a>
      <a href="/owner/">{{t.linkOwnerConsole}}</a>
    </nav>

    <nav class="ft-col" aria-labelledby="ft-c2">
      <h2 class="ft-h" id="ft-c2">{{t.footerColCompany}}</h2>
      <a href="{{base}}/about/">{{t.linkAbout}}</a>
      <a href="{{base}}/contact/">{{t.linkContact}}</a>
    </nav>

    <nav class="ft-col" aria-labelledby="ft-c3">
      <h2 class="ft-h" id="ft-c3">{{t.footerColLegal}}</h2>
      <a href="{{base}}/privacy/">{{t.linkPrivacy}}</a>
      <a href="{{base}}/terms/">{{t.linkTerms}}</a>
    </nav>

  </div>

  <div class="wrap ft-btm">
    <p>{{t.footerRights}}</p>
    <a class="ft-lang" href="{{altBase}}{{path}}" hreflang="{{altLang}}" lang="{{altLang}}">{{t.ariaLangSwitch}}</a>
  </div>
</footer>

<!-- زرّ العودة إلى الأعلى — يظهر بعد 700px من التمرير -->
<button class="top" type="button" aria-label="{{t.ariaToTop}}">
  <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20V5"/><path d="m5 12 7-7 7 7"/></svg>
</button>

<!-- كل السلوك في ملفّ خارجي مبصوم يُحمَّل بـdefer (انظر <head>).
     المحتوى كلّه يعمل بلا سكربت، والثيم يُطبَّق في <head> قبل الرسم. -->
