<a class="skip" href="#main">{{t.skipLink}}</a>

<header class="hd">
  <div class="wrap hd-in">

    <a class="hd-brand" href="{{base}}/" aria-label="{{t.ariaBrandHome}}">
      <img class="hd-logo lt" src="/assets/logo-nav.png" alt="{{t.brandName}}" width="93" height="34" fetchpriority="high">
      <img class="hd-logo dk" src="/assets/logo-nav-dark.png" alt="" aria-hidden="true" width="93" height="34">
    </a>

    <nav class="hd-nav" aria-label="{{t.ariaMainNav}}">
      <a href="{{base}}/"{{cur_index}}>{{t.navHome}}</a>
      <a href="{{base}}/places/"{{cur_places}}>{{t.navPlaces}}</a>
      <a href="{{base}}/owners/"{{cur_owners}}>{{t.navOwners}}</a>
      <a href="{{base}}/about/"{{cur_about}}>{{t.navAbout}}</a>
      <a href="{{base}}/contact/"{{cur_contact}}>{{t.navContact}}</a>
    </nav>

    <div class="hd-tools">
      <!-- مبدّل اللغة رابط حقيقي إلى الصفحة المقابلة، لا زرّ JS: يُفهرَس ويُشارَك ويعمل بلا سكربت -->
      <a class="tool lang" href="{{altBase}}{{path}}" hreflang="{{altLang}}" lang="{{altLang}}" aria-label="{{t.ariaLangSwitch}}">{{t.langSwitchLabel}}</a>

      <button class="tool thm" type="button" data-theme-toggle aria-label="{{t.ariaThemeToggle}}">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path class="thm-p" d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
      </button>

      <a class="btn btn-pri hd-cta" href="{{base}}/download/"{{cur_download}}>{{t.navDownload}}</a>

      <!-- زرّ الدرج: يظهر تحت 900px حيث يختفي التنقّل الأفقي -->
      <button class="tool burger" type="button" aria-label="{{t.ariaMenu}}" aria-expanded="false" aria-controls="mnav">
        <span></span><span></span><span></span>
      </button>
    </div>

  </div>

  <!-- شريط تقدّم القراءة — يسكن حدّ الهيدر السفلي فلا يزيد ارتفاعًا -->
  <div class="prog" aria-hidden="true"></div>
</header>

<!-- ============ درج التنقّل على الجوّال ============
     كان التنقّل يختفي كليًّا تحت 900px: لا رابط إلى المُلّاك ولا إلى
     «من نحن» إلّا من أسفل التذييل. هذا الدرج هو ذلك التنقّل الغائب. -->
<div class="mnav-veil" aria-hidden="true"></div>
<nav class="mnav" id="mnav" aria-label="{{t.ariaMainNav}}" aria-hidden="true">
  <div class="mnav-top">
    <img class="hd-logo lt" src="/assets/logo-nav.png" alt="{{t.brandName}}" width="93" height="34" loading="lazy">
    <img class="hd-logo dk" src="/assets/logo-nav-dark.png" alt="" aria-hidden="true" width="93" height="34" loading="lazy">
    <button class="mnav-close" type="button" aria-label="{{t.ariaMenuClose}}">
      <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>

  <a class="mnav-link" style="--i:0" href="{{base}}/"{{cur_index}}>{{t.navHome}}<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></a>
  <a class="mnav-link" style="--i:1" href="{{base}}/places/"{{cur_places}}>{{t.navPlaces}}<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></a>
  <a class="mnav-link" style="--i:2" href="{{base}}/owners/"{{cur_owners}}>{{t.navOwners}}<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></a>
  <a class="mnav-link" style="--i:3" href="{{base}}/about/"{{cur_about}}>{{t.navAbout}}<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></a>
  <a class="mnav-link" style="--i:4" href="{{base}}/contact/"{{cur_contact}}>{{t.navContact}}<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></a>

  <a class="btn btn-pri btn-lg mnav-cta" href="{{base}}/download/">{{t.navDownload}}</a>
  <p class="mnav-foot">{{t.heroNote}}</p>
</nav>
