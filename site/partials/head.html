<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{title}}</title>
<meta name="description" content="{{desc}}">
<link rel="canonical" href="{{canonical}}">

<!-- كل صفحة تشير إلى شقيقتها في اللغة الأخرى، و x-default إلى العربية (لغة الجمهور الأساسي) -->
<link rel="alternate" hreflang="ar" href="{{arUrl}}">
<link rel="alternate" hreflang="en" href="{{enUrl}}">
<link rel="alternate" hreflang="x-default" href="{{arUrl}}">

<meta name="theme-color" content="#FAFAF7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#081D22" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">

<meta property="og:type" content="website">
<meta property="og:site_name" content="{{t.brandName}}">
<meta property="og:locale" content="{{lang}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{desc}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="{{origin}}/assets/og-default.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" href="/assets/logo-fav.png" type="image/png">
<link rel="apple-touch-icon" href="/assets/logo-mark.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="{{fontHref}}">

<!-- ورقة الأنماط ملفّ خارجي مبصوم بمحتواه، لا نصًّا مضمَّنًا في كل صفحة:
     الرئيسة كانت 41KB لأن الورقة تتكرّر في ٢٨ صفحة، وقد تجاوزت ميزانيتها.
     الاسم يحمل بصمة المحتوى ⇒ يُخزَّن سنة كاملة ويتبدّل تلقائيًّا عند أي تعديل.
     الوسم حاجب للرسم ⇒ لا رسمة بلا أنماط، وهو ما كان التضمين يشتريه. -->
<link rel="stylesheet" href="{{cssHref}}">

<!-- السكربت الوحيد المضمَّن، ولا يمكن أن يفشل تحميله. مهمّتان:
     ① الثيم يُطبَّق قبل أوّل رسم كي لا يومض الأبيض على مستخدم الوضع الليلي.
        نفس مفتاح التخزين المستعمل في التطبيق ⇒ من بدّل الثيم هناك يجده هنا.
     ② .has-js تسمح للـCSS بإخفاء عناصر الكشف قبل ظهورها. ومعها مؤقّت أمان:
        إن لم يصل الملفّ الخارجي خلال ثانيتين تُزال الفئة ويظهر كل شيء —
        فلا يبقى نصّ مخفيًّا لأن سكربتًا لم يصل. -->
<script>(function(){var r=document.documentElement;try{var k='mustadaira:theme',v=localStorage.getItem(k);if(v!=='light'&&v!=='dark'){v=(window.matchMedia&&matchMedia('(prefers-color-scheme:dark)').matches)?'dark':'light';}if(v==='dark'){r.classList.add('dark');}}catch(e){}r.className+=' has-js';setTimeout(function(){if(!window.__mstd){r.classList.remove('has-js');}},2000);})();</script>

<script src="{{jsHref}}" defer></script>

<script type="application/ld+json">
{"@context":"https://schema.org","@graph":[
{"@type":"Organization","@id":"{{origin}}/#org","name":"{{t.brandName}}","url":"{{origin}}/","logo":"{{origin}}/assets/logo-mark.png"},
{"@type":"WebSite","@id":"{{origin}}/#site","url":"{{origin}}/","name":"{{t.brandName}}","publisher":{"@id":"{{origin}}/#org"},"inLanguage":"{{lang}}"}
]}
</script>
