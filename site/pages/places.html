<section class="sec">
  <div class="wrap">
    <span class="eyebrow">{{t.plEyebrow}}</span>
    <h1 class="h1-page">{{t.plTitle}}</h1>
    <p class="lead">{{t.plLead}}</p>

    <!-- التصفية تعمل على البطاقات الموجودة في الصفحة نفسها: لا استعلام ولا
         شبكة، وتعمل بلا اتّصال. من لا يعمل عنده السكربت يرى القائمة كاملة
         كما كانت — الأدوات تحسين لا شرط عرض. -->
    <div class="pl-tools">
      <div class="pl-search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
        <input type="search" id="pl-q" autocomplete="off" placeholder="{{t.plSearchPh}}" aria-label="{{t.plSearchPh}}">
      </div>
      {{placesChips}}
    </div>

    <p class="pl-count" data-tpl="{{t.plCountTpl}}" aria-live="polite">{{plCountInit}}</p>

    <!-- القائمة مولَّدة وقت البناء من قاعدة البيانات — لا استعلام وقت الزيارة.
         ما تراه هنا هو ما في القاعدة لحظة آخر نشر. -->
    {{placesList}}

    <p class="pl-empty">{{t.plEmpty}}</p>

    <p class="pl-updated">{{t.plUpdated}} {{buildStamp}} &middot; {{t.plLiveNote}}</p>
  </div>
</section>
