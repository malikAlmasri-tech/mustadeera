<body class="bg-background min-h-screen flex flex-col pt-16 pb-32 overflow-x-hidden">
<!-- TopAppBar (Transactional - Nav suppressed, but header remains for structure) -->

</button>
<div class="font-headline-md text-headline-md-mobile text-primary dark:text-primary-fixed-dim">

        </div>

<h1 class="font-display-lg-mobile text-display-lg-mobile fluid-gradient-text">Neon Court Alpha</h1>

</div>

<span class="font-body-md text-body-md">Duration: 60 Minutes</span>
</div>
<div class="flex items-center gap-3 text-on-surface-variant">

<span class="font-body-md text-body-md">Capacity: 2 - 4 Players</span>
</div>
</div>
</section>

<div class="font-label-sm text-label-sm text-on-surface-variant mt-1">AED 250</div>
</div>
<div class="flex items-center gap-2">
<span class="w-2 h-2 rounded-full bg-surface-tint shadow-[0_0_8px_rgba(0,220,229,0.8)]"></span>
<span class="font-label-sm text-label-sm text-surface-tint">Available</span>

</button>

</div>
</div>

<span class="font-body-lg text-body-lg text-primary ml-0 sm:ml-2">Tue 15, 19:30</span>
<span class="font-headline-md text-headline-md-mobile text-surface-tint block sm:inline sm:ml-4">AED 250</span>
</div>
<button class="w-full sm:w-auto px-8 py-3 rounded-full bg-gradient-to-r from-primary-container to-surface-tint text-on-primary font-label-sm text-label-sm uppercase tracking-widest shadow-[0_0_20px_rgba(0,245,255,0.4)] hover:shadow-[0_0_30px_rgba(0,245,255,0.6)] hover:scale-[1.02] active:scale-95 transition-all duration-300 flex items-center justify-center gap-2">
