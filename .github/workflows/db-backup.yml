# ═══════════════════════════════════════════════════════════════════════════
#  نسخة احتياطية يومية لقاعدة بيانات Supabase — مشفّرة
#
#  لماذا: الخطة المجانية في Supabase **بلا نسخ احتياطية إطلاقًا**.
#  خطأ `delete` واحد أو مشروع محذوف = فقدان كل شيء بلا رجعة.
#
#  ─── إعداد لمرّة واحدة (دقيقتان) ────────────────────────────────────────
#  GitHub ← Settings ← Secrets and variables ← Actions ← New repository secret
#
#  ① SUPABASE_DB_PASSWORD  ← **كلمة سرّ القاعدة وحدها. لا رابط.**
#     من لوحة Supabase ← Project Settings ← Database ← Database password.
#     الصقها كما هي: بلا `postgresql://`، وبلا `@`، وبلا ترميز، وبلا أي شيء حولها.
#
#     ⚠️ لماذا تغيّر هذا: النسخة السابقة طلبت رابطًا كاملًا، وفشلت ثلاث مرّات
#        بـ«password authentication failed for user postgres». السبب أن نصّ
#        **Direct connection** مستخدمه `postgres`، بينما الـpooler يخدم آلاف
#        المشاريع على مضيف واحد ولا يعرف مشروعك إلّا من `postgres.<ref>`.
#        وسبب ثانٍ محتمل: حرف مثل @ أو # في كلمة السرّ يقطع الرابط عند تحليله.
#        ⇒ أُزيل الرابط من المعادلة كلّها: المضيف والمستخدم والمنفذ تُبنى هنا
#          من معرّف المشروع (وهو **ليس سرًّا** — مضمَّن أصلًا في التطبيق والموقع)،
#          وكلمة السرّ تمرّ عبر PGPASSWORD فلا تمرّ بتحليل URL إطلاقًا.
#
#     (التوافق: إن كان SUPABASE_DB_URL القديم موجودًا وحده، يُستخرَج منه ما بين
#      أوّل «:» بعد المستخدم وآخر «@» ويُستعمل ككلمة سرّ.)
#
#  ② BACKUP_PASSPHRASE
#     عبارة سرّ طويلة عشوائية **احفظها في مدير كلمات السرّ**.
#     ⚠️ إن ضاعت فالنسخ الاحتياطية **غير قابلة للاسترجاع** — لا نسخة منها عندي ولا عند GitHub.
#     التشفير ليس زينة: مخرجات Actions قابلة للتنزيل من أي شخص إن كان المستودع عامًّا،
#     والنسخة فيها أرقام هواتف مستخدمين حقيقيين.
#
#  ─── الاسترجاع (جرّبه مرّة قبل أن تحتاجه) ───────────────────────────────
#    export PGPASSWORD='<كلمة-سرّ-القاعدة>'
#    gpg -d backup.sql.gz.gpg | gunzip | psql \
#      -h aws-0-eu-central-1.pooler.supabase.com -p 5432 \
#      -U postgres.nxqddfuwtrsabprxcfez -d postgres
#
#  ملاحظة: GitHub يوقف الجداول الزمنية في مستودع بلا نشاط 60 يومًا.
#          أي دفعة أو تشغيل يدوي يعيد تفعيلها.
# ═══════════════════════════════════════════════════════════════════════════
name: DB backup (daily, encrypted)

on:
  schedule:
    - cron: '0 2 * * *'      # 02:00 UTC = 05:00 بتوقيت عمّان
  workflow_dispatch:          # تشغيل يدوي من تبويب Actions

permissions:
  contents: read

# معرّف المشروع والمنطقة — ليسا سرًّا (المعرّف مضمَّن في التطبيق والموقع).
# وجودهما هنا هو ما يجعل بناء الاتصال صحيحًا دائمًا بلا اعتماد على صياغة يدوية.
env:
  PROJECT_REF: nxqddfuwtrsabprxcfez
  DB_REGION: aws-0-eu-central-1

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: تخطٍّ إن لم تُضبط الأسرار بعد
        id: guard
        env:
          DB_PASS: ${{ secrets.SUPABASE_DB_PASSWORD }}
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          # كلمة السرّ: من السرّ الجديد، أو مستخرَجة من الرابط القديم للتوافق.
          PW="$DB_PASS"
          if [ -z "$PW" ] && [ -n "$DB_URL" ]; then
            # كل ما بين أوّل «:» بعد المستخدم وآخر «@» — يحتمل أن تحوي كلمة السرّ «:»
            PW=$(printf '%s' "$DB_URL" | sed -E 's#^[a-z]+://[^:]+:(.*)@[^@]*$#\1#')
            echo "::warning::تُستعمل كلمة السرّ المستخرَجة من SUPABASE_DB_URL. الأفضل ضبط SUPABASE_DB_PASSWORD وحذف الرابط."
          fi
          # إخفاؤها من السجلّ قبل أي استعمال — لو ظهرت في رسالة خطأ لاحقًا تبقى مموّهة.
          if [ -n "$PW" ]; then echo "::add-mask::$PW"; fi
          echo "PGPASSWORD=$PW" >> "$GITHUB_ENV"

          if [ -z "$PW" ] || [ -z "$PASS" ]; then
            echo "::notice::لم تُضبط SUPABASE_DB_PASSWORD و/أو BACKUP_PASSPHRASE — تخطٍّ بلا فشل."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # عميل Postgres 17: عميل أقدم من الخادم يرفض العمل («server version mismatch»).
      # مستودع أوبونتو يشحن 16، وSupabase على 15/17 ⇒ نأخذه من مستودع PGDG الرسمي.
      - name: تثبيت عميل postgresql-17
        if: steps.guard.outputs.ready == 'true'
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      # فحص الاتصال وحده قبل التفريغ: إن فشل، الرسالة تقول أين الخلل بالضبط
      # بدل «password authentication failed» المبهمة.
      - name: التحقّق من الاتصال
        if: steps.guard.outputs.ready == 'true'
        env:
          PGPASSWORD: ${{ env.PGPASSWORD }}
        run: |
          set -euo pipefail
          PGHOST="${DB_REGION}.pooler.supabase.com"
          PGUSER="postgres.${PROJECT_REF}"
          echo "المضيف:   $PGHOST:5432"
          echo "المستخدم: $PGUSER"
          if ! psql -h "$PGHOST" -p 5432 -U "$PGUSER" -d postgres -c 'select 1' >/dev/null 2>err.txt; then
            echo "::error::فشل الاتصال. تحقّق من SUPABASE_DB_PASSWORD (كلمة سرّ القاعدة، لا كلمة سرّ حسابك في Supabase)."
            sed -E 's/password=[^ ]*/password=***/g' err.txt || true
            exit 1
          fi
          echo "الاتصال سليم."

      - name: تفريغ القاعدة وضغطها وتشفيرها
        if: steps.guard.outputs.ready == 'true'
        env:
          PGPASSWORD: ${{ env.PGPASSWORD }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          STAMP=$(date -u +%Y-%m-%d)
          # الاتصال بأعلام صريحة لا برابط URI: كلمة السرّ تصل عبر PGPASSWORD
          # فلا تمرّ بتحليل URL ⇒ يستحيل أن يكسرها حرف مثل @ أو # أو :.
          # واسم المستخدم مبنيّ هنا (postgres.<ref>) وهو ما يطلبه الـpooler —
          # وكان `postgres` وحده سبب الفشل ثلاث مرّات.
          # --no-owner/--no-privileges: الاسترجاع في مشروع جديد لا يعرف أدوار المشروع القديم.
          # المخططات: public (بياناتنا) + auth (الحسابات وكلمات السرّ المجزّأة) — بلا auth
          # تسترجع البيانات بلا أصحابها.
          pg_dump \
            -h "${DB_REGION}.pooler.supabase.com" -p 5432 \
            -U "postgres.${PROJECT_REF}" -d postgres \
            --schema=public --schema=auth \
            --no-owner --no-privileges --clean --if-exists \
            | gzip -9 > dump.sql.gz

          SIZE=$(stat -c%s dump.sql.gz)
          echo "حجم التفريغ المضغوط: $SIZE بايت"
          # حارس «نجحت النسخة لكنها فارغة» — أخطر من فشل صريح لأنه صامت.
          if [ "$SIZE" -lt 20000 ]; then
            echo "::error::التفريغ أصغر من 20KB ($SIZE) — على الأرجح فشل صامت أو قاعدة فارغة."
            exit 1
          fi

          gpg --batch --yes --symmetric --cipher-algo AES256 \
              --passphrase "$PASS" \
              -o "mustadeera-$STAMP.sql.gz.gpg" dump.sql.gz
          rm -f dump.sql.gz
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"

      - name: رفع النسخة كمخرَج
        if: steps.guard.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ env.STAMP }}
          path: mustadeera-*.sql.gz.gpg
          retention-days: 90
          if-no-files-found: error
